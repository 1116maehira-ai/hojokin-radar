<style>
:root{--bg:#f1f5f9;--card:#fff;--border:#cbd5e1;--primary:#1e40af;--text:#0f172a;--muted:#64748b;--blue-light:#dbeafe;--green:#d1fae5;--green-text:#065f46}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--blue-light:#1e3a5f;--green:#064e3b;--green-text:#6ee7b7}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--blue-light:#1e3a5f;--green:#064e3b;--green-text:#6ee7b7}
:root[data-theme="light"]{--bg:#f1f5f9;--card:#fff;--border:#cbd5e1;--text:#0f172a;--muted:#64748b;--blue-light:#dbeafe;--green:#d1fae5;--green-text:#065f46}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
.badge{background:rgba(255,255,255,.2);border-radius:10px;padding:2px 10px;font-size:12px}
.controls{padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.controls input,.controls select{padding:7px 11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit}
.controls input{flex:1;min-width:200px}
.stat-bar{padding:8px 20px;background:var(--blue-light);display:flex;gap:20px;font-size:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.stat-bar span{color:var(--muted)}.stat-bar strong{color:var(--text);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
thead th{background:var(--card);border-bottom:2px solid var(--border);padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none;letter-spacing:.04em;text-transform:uppercase}
thead th:hover{color:var(--primary)}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--blue-light)}
td{padding:9px 12px;vertical-align:middle}
.co-name{font-weight:600;font-size:13px;line-height:1.3}
.phone{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:var(--primary);font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:3px;padding:1px 6px;font-size:11px;font-weight:600;margin-right:2px}
.tag-s{background:#dcfce7;color:#14532d;border:1px solid #86efac}
.tag-a{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.tag-b{background:#fef9c3;color:#713f12;border:1px solid #fde047}
.tag-c{background:#fee2e2;color:#7f1d1d;border:1px solid #fca5a5}
.tag-job{background:#f3e8ff;color:#581c87;border:1px solid #d8b4fe}
.tag-sns{background:#fef3c7;color:#78350f;border:1px solid #fcd34d}
.ceo{font-size:12px;color:var(--muted)}
.website a{color:var(--primary);text-decoration:none;font-size:12px}
.website a:hover{text-decoration:underline}
.empty{text-align:center;padding:60px;color:var(--muted);font-size:15px}
.sort-icon{font-size:9px;margin-left:2px;opacity:.6}
</style>

var sK='ar',sA=false;
var rO={S:0,A:1,B:2,C:3,'':4};
function e(s){if(s==null)return'';return(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rT(r){if(!r)return'';return'<span class="tag tag-'+r.toLowerCase()+'">'+r+'</span>';}
function initFilters(){
  var inds=[...new Set(DATA.map(r=>r.i).filter(Boolean))].sort();
  var cities=[...new Set(DATA.map(r=>r.c).filter(Boolean))].sort();
  var fi=document.getElementById('fi'),fc=document.getElementById('fc');
  inds.forEach(v=>{var o=document.createElement('option');o.value=v;o.textContent=v;fi.appendChild(o);});
  cities.forEach(v=>{var o=document.createElement('option');o.value=v;o.textContent=v;fc.appendChild(o);});
  document.getElementById('total').textContent=DATA.length;
  document.getElementById('cnt-s').textContent=DATA.filter(r=>r.ar==='S').length;
  document.getElementById('cnt-p').textContent=DATA.filter(r=>r.p).length;
  document.getElementById('hdr-count').textContent=DATA.length+'社';
}
function sort(k){
  if(sK===k)sA=!sA;else{sK=k;sA=(k!=='ar');}
  document.querySelectorAll('[id^=sh-]').forEach(el=>el.textContent='');
  var el=document.getElementById('sh-'+k);if(el)el.textContent=sA?'▲':'▼';
  render();
}
function render(){
  var q=document.getElementById('q').value.toLowerCase();
  var fi=document.getElementById('fi').value,fc=document.getElementById('fc').value;
  var fr=document.getElementById('fr').value,fj=document.getElementById('fj').value;
  var fs=document.getElementById('fs').value;
  var rows=DATA.filter(r=>{
    if(fi&&r.i!==fi)return false;if(fc&&r.c!==fc)return false;
    if(fr&&r.ar!==fr)return false;
    if(fj==='1'&&!r.job)return false;
    if(fj==='0'&&r.job)return false;
    if(fs==='1'&&!r.sns)return false;
    if(fs==='0'&&r.sns)return false;
    if(q){var h=((r.n||'')+' '+(r.ceo||'')+' '+(r.p||'')+' '+(r.c||'')).toLowerCase();if(h.indexOf(q)===-1)return false;}
    return true;
  });
  rows.sort((a,b)=>{
    var av=a[sK]||'',bv=b[sK]||'';
    if(sK==='ar'){var ao=rO[av]!==undefined?rO[av]:4,bo=rO[bv]!==undefined?rO[bv]:4;return sA?ao-bo:bo-ao;}
    if(typeof av==='number')return sA?av-bv:bv-av;
    return sA?(''+av).localeCompare(''+bv,'ja'):(''+bv).localeCompare(''+av,'ja');
  });
  document.getElementById('cnt').textContent=rows.length;
  var html='';
  if(!rows.length){html='<tr><td colspan="8" class="empty">条件に合うデータがありません</td></tr>';}
  else{rows.forEach(r=>{
    var attrs='';
    if(r.job)attrs+='<span class="tag tag-job">求人</span>';
    if(r.sns)attrs+='<span class="tag tag-sns">SNS</span>';
    var hp=r.w?'<a href="'+e(r.w)+'" target="_blank" rel="noopener">HP</a>':'';
    html+='<tr><td><div class="co-name">'+e(r.n)+'</div></td>'
      +'<td>'+e(r.i)+'</td><td>'+e(r.c)+'</td>'
      +'<td><span class="phone">'+e(r.p)+'</span></td>'
      +'<td><span class="ceo">'+e(r.ceo)+'</span></td>'
      +'<td>'+rT(r.ar)+(r.ay?' <small>'+r.ay+'周年</small>':'')+'</td>'
      +'<td class="website">'+hp+'</td>'
      +'<td>'+attrs+'</td></tr>';
  });}
  document.getElementById('tbody').innerHTML=html;
}
initFilters();sort('ar');
