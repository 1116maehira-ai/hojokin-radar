<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業リスト - Hojokin Radar</title>
<style>
:root {
  --bg: #f8f9fa;
  --card: #fff;
  --border: #dee2e6;
  --primary: #0d6efd;
  --text: #212529;
  --muted: #6c757d;
  --green: #198754;
  --yellow: #ffc107;
  --red: #dc3545;
  --blue-light: #e8f0fe;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a2e;--card:#16213e;--border:#2d4a6e;--text:#e2e8f0;--muted:#94a3b8;--blue-light:#1e3a5f;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--primary);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:20px;font-weight:700}
header .badge{background:rgba(255,255,255,.25);border-radius:12px;padding:2px 10px;font-size:12px}
.controls{padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.controls input,.controls select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:13px}
.controls input{flex:1;min-width:180px}
.stat-bar{padding:10px 20px;background:var(--blue-light);display:flex;gap:20px;font-size:13px;flex-wrap:wrap}
.stat-bar span{color:var(--muted)}
.stat-bar strong{color:var(--text)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--card);border-bottom:2px solid var(--border);padding:10px 12px;text-align:left;font-size:12px;color:var(--muted);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:var(--blue-light)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:var(--blue-light)}
td{padding:10px 12px;vertical-align:middle}
.co-name{font-weight:600;font-size:13px}
.co-city{font-size:11px;color:var(--muted)}
.phone{font-family:monospace;font-size:13px;color:var(--primary)}
.tag{display:inline-block;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;margin-right:2px}
.tag-s{background:#d1e7dd;color:#0a3622}
.tag-a{background:#cfe2ff;color:#084298}
.tag-b{background:#fff3cd;color:#664d03}
.tag-c{background:#f8d7da;color:#58151c}
.tag-job{background:#e8d5ff;color:#44006e}
.tag-sns{background:#fce8b2;color:#5f3701}
.ceo{font-size:12px;color:var(--muted)}
.website a{color:var(--primary);text-decoration:none;font-size:12px}
.website a:hover{text-decoration:underline}
.empty{text-align:center;padding:60px;color:var(--muted)}
.table-wrap{overflow-x:auto}
.sort-icon{font-size:10px;margin-left:3px}
</style>
</head>
<body>
<header>
  <h1>📋 営業リスト</h1>
  <span class="badge" id="hdr-count">読込中...</span>
</header>
<div class="controls">
  <input type="text" id="q" placeholder="会社名・代表者名・電話番号で検索..." oninput="render()">
  <select id="fi" onchange="render()">
    <option value="">業種: 全て</option>
  </select>
  <select id="fc" onchange="render()">
    <option value="">市区町村: 全て</option>
  </select>
  <select id="fr" onchange="render()">
    <option value="">周年ランク: 全て</option>
    <option value="S">S (最優先)</option>
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
  </select>
  <select id="fj" onchange="render()">
    <option value="">求人: 全て</option>
    <option value="1">求人あり</option>
    <option value="0">求人なし</option>
  </select>
  <select id="fs" onchange="render()">
    <option value="">SNS: 全て</option>
    <option value="1">SNSあり</option>
    <option value="0">SNSなし</option>
  </select>
</div>
<div class="stat-bar">
  <span>表示: <strong id="cnt">-</strong>件</span>
  <span>全体: <strong id="total">-</strong>件</span>
  <span>周年S: <strong id="cnt-s">-</strong>件</span>
  <span>電話あり: <strong id="cnt-p">-</strong>件</span>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
  <th onclick="sort('n')">会社名 <span class="sort-icon" id="sh-n"></span></th>
  <th onclick="sort('i')">業種 <span class="sort-icon" id="sh-i"></span></th>
  <th onclick="sort('c')">市区町村 <span class="sort-icon" id="sh-c"></span></th>
  <th onclick="sort('p')">電話番号 <span class="sort-icon" id="sh-p"></span></th>
  <th>代表者</th>
  <th onclick="sort('ar')">周年 <span class="sort-icon" id="sh-ar"></span></th>
  <th>Webサイト</th>
  <th>属性</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

var sortKey = 'ar';
var sortAsc = false;
var rankOrder = {S:0,A:1,B:2,C:3,'':4};

function rankTag(r) {
  if (!r) return '';
  var cls = 'tag-' + r.toLowerCase();
  return '<span class="tag ' + cls + '">' + r + '</span>';
}

function initFilters() {
  var industries = [...new Set(DATA.map(r=>r.i).filter(Boolean))].sort();
  var cities = [...new Set(DATA.map(r=>r.c).filter(Boolean))].sort();
  var fi = document.getElementById('fi');
  var fc = document.getElementById('fc');
  industries.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; fi.appendChild(o); });
  cities.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; fc.appendChild(o); });
  document.getElementById('total').textContent = DATA.length;
  document.getElementById('cnt-s').textContent = DATA.filter(r=>r.ar==='S').length;
  document.getElementById('cnt-p').textContent = DATA.filter(r=>r.p).length;
  document.getElementById('hdr-count').textContent = DATA.length + '社';
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sort(k) {
  if (sortKey === k) { sortAsc = !sortAsc; }
  else { sortKey = k; sortAsc = (k !== 'ar'); }
  document.querySelectorAll('[id^=sh-]').forEach(function(el){ el.textContent=''; });
  var el = document.getElementById('sh-' + k);
  if (el) el.textContent = sortAsc ? '▲' : '▼';
  render();
}

function render() {
  var q = document.getElementById('q').value.toLowerCase();
  var fi = document.getElementById('fi').value;
  var fc = document.getElementById('fc').value;
  var fr = document.getElementById('fr').value;
  var fj = document.getElementById('fj').value;
  var fs = document.getElementById('fs').value;

  var rows = DATA.filter(function(r) {
    if (fi && r.i !== fi) return false;
    if (fc && r.c !== fc) return false;
    if (fr && r.ar !== fr) return false;
    if (fj !== '' && String(r.job) !== fj) return false;
    if (fs !== '' && String(r.sns) !== fs) return false;
    if (q) {
      var hay = (r.n + ' ' + r.ceo + ' ' + r.p + ' ' + r.c).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  rows.sort(function(a, b) {
    var av = a[sortKey] || '', bv = b[sortKey] || '';
    if (sortKey === 'ar') {
      var ao = rankOrder[av] !== undefined ? rankOrder[av] : 4;
      var bo = rankOrder[bv] !== undefined ? rankOrder[bv] : 4;
      return sortAsc ? ao - bo : bo - ao;
    }
    if (typeof av === 'number') return sortAsc ? av - bv : bv - av;
    return sortAsc ? av.localeCompare(bv, 'ja') : bv.localeCompare(av, 'ja');
  });

  document.getElementById('cnt').textContent = rows.length;

  var html = '';
  if (rows.length === 0) {
    html = '<tr><td colspan="8" class="empty">条件に合うデータがありません</td></tr>';
  } else {
    rows.forEach(function(r) {
      var attrs = '';
      if (r.job) attrs += '<span class="tag tag-job">求人</span>';
      if (r.sns) attrs += '<span class="tag tag-sns">SNS</span>';
      var website = r.w ? '<a href="' + esc(r.w) + '" target="_blank" rel="noopener">🔗 HP</a>' : '';
      html += '<tr>'
        + '<td><div class="co-name">' + esc(r.n) + '</div><div class="co-city">' + esc(r.c) + '</div></td>'
        + '<td>' + esc(r.i) + '</td>'
        + '<td>' + esc(r.c) + '</td>'
        + '<td><span class="phone">' + esc(r.p) + '</span></td>'
        + '<td><span class="ceo">' + esc(r.ceo) + '</span></td>'
        + '<td>' + rankTag(r.ar) + (r.ay ? ' <small>' + r.ay + '周年</small>' : '') + '</td>'
        + '<td class="website">' + website + '</td>'
        + '<td>' + attrs + '</td>'
        + '</tr>';
    });
  }
  document.getElementById('tbody').innerHTML = html;
}

initFilters();
sort('ar');
</script>
