<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook 友達申請 - TENOHIRA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .summary-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .summary-item .label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .contact-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .contact-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .contact-card.completed {
            opacity: 0.6;
            background: #f9f9f9;
        }

        .contact-index {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .contact-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .contact-company {
            color: #667eea;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .contact-details {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .contact-details-row {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
        }

        .contact-details-label {
            color: #999;
            min-width: 60px;
            font-weight: 500;
        }

        .contact-details-value {
            flex: 1;
            word-break: break-all;
        }

        .contact-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-facebook {
            background: #1877f2;
            color: white;
        }

        .btn-facebook:hover {
            background: #0a66c2;
        }

        .btn-copy {
            background: #f0f0f0;
            color: #333;
        }

        .btn-copy:hover {
            background: #e0e0e0;
        }

        .btn-complete {
            background: #22c55e;
            color: white;
        }

        .btn-complete:hover {
            background: #16a34a;
        }

        .btn-undo {
            background: #94a3b8;
            color: white;
            flex: 1;
        }

        .btn-undo:hover {
            background: #64748b;
        }

        .status-badge {
            display: inline-block;
            background: #22c55e;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 10px;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        footer {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .section-title {
            color: white;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 600;
        }

        #completedSection {
            margin-top: 40px;
        }

        .header-with-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 Facebook 友達申請サポート</h1>
            <p>メルマガ登録者の検索＆メッセージ送信を簡単に</p>
            <div class="summary" id="summary">
                <div class="summary-item">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">登録者数</div>
                </div>
                <div class="summary-item">
                    <div class="number" id="categoryDisplay">-</div>
                    <div class="label">カテゴリ</div>
                </div>
                <div class="summary-item">
                    <div class="number" id="generatedDate">-</div>
                    <div class="label">生成日時</div>
                </div>
            </div>
        </header>

        <div id="error" class="error" style="display: none;"></div>

        <div id="pendingSection">
            <div class="section-title">📝 対応待ち <span id="pendingCount"></span></div>
            <div class="contacts-grid" id="contactsGrid"></div>
        </div>

        <div id="completedSection" style="display: none;">
            <div class="section-title">✅ 済み <span id="completedCount"></span></div>
            <div class="contacts-grid" id="completedGrid" style="opacity: 0.6;"></div>
        </div>

        <footer>
            💡 使い方：
            1️⃣「Facebook検索」をクリック → 2️⃣「メッセージをコピー」で送信 → 3️⃣「完了」をマーク
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let allData = null;
        let completedIds = new Set();

        async function loadData() {
            try {
                const response = await fetch('facebook_search_results.json');
                if (!response.ok) {
                    throw new Error(`HTTPエラー: ${response.status}`);
                }
                allData = await response.json();

                try {
                    const completedResponse = await fetch('contacted.json');
                    if (completedResponse.ok) {
                        const completedData = await completedResponse.json();
                        completedIds = new Set(completedData.completed_ids || []);
                    }
                } catch (e) {
                    completedIds = new Set();
                }

                renderDashboard(allData);
            } catch (error) {
                showError(`データ読み込みエラー: ${error.message}`);
                console.error('Error:', error);
            }
        }

        function renderDashboard(data) {
            document.getElementById('totalCount').textContent = data.total_contacts;
            document.getElementById('categoryDisplay').textContent = data.category;

            const date = new Date(data.generated_at);
            const formattedDate = date.toLocaleDateString('ja-JP', {
                month: 'short',
                day: 'numeric'
            });
            document.getElementById('generatedDate').textContent = formattedDate;

            const pendingContacts = [];
            const completedContacts = [];

            data.contacts.forEach(contact => {
                if (completedIds.has(contact.contact_id)) {
                    completedContacts.push(contact);
                } else {
                    pendingContacts.push(contact);
                }
            });

            const grid = document.getElementById('contactsGrid');
            grid.innerHTML = '';
            pendingContacts.forEach(contact => {
                const card = createContactCard(contact, false);
                grid.appendChild(card);
            });
            document.getElementById('pendingCount').textContent = `(${pendingContacts.length})`;

            if (completedContacts.length > 0) {
                document.getElementById('completedSection').style.display = 'block';
                const completedGrid = document.getElementById('completedGrid');
                completedGrid.innerHTML = '';
                completedContacts.forEach(contact => {
                    const card = createContactCard(contact, true);
                    completedGrid.appendChild(card);
                });
                document.getElementById('completedCount').textContent = `(${completedContacts.length})`;
            } else {
                document.getElementById('completedSection').style.display = 'none';
            }
        }

        function createContactCard(contact, isCompleted = false) {
            const card = document.createElement('div');
            card.className = isCompleted ? 'contact-card completed' : 'contact-card';

            const info = contact.contact_info;
            const fb = contact.facebook_search;
            const msg = contact.message_template;

            const statusBadge = isCompleted ? '<span class="status-badge">済み</span>' : '';

            let actionButtons = '';
            if (isCompleted) {
                actionButtons = `<button class="btn btn-undo" onclick="markIncomplete('${contact.contact_id}')">↶ やり直す</button>`;
            } else {
                actionButtons = `
                    <a href="${fb.search_url}" target="_blank" class="btn btn-facebook">
                        🔍 Facebook検索
                    </a>
                    <button class="btn btn-copy" onclick="copyToClipboard('${escapeForJs(msg)}')">
                        📋 メッセージをコピー
                    </button>
                    <button class="btn btn-complete" onclick="markComplete('${contact.contact_id}')">✅ 完了</button>
                `;
            }

            card.innerHTML = `
                <div style="display: flex; align-items: center; margin-bottom: 15px;">
                    <div class="contact-index">${contact.index}</div>
                    ${statusBadge}
                </div>
                <div class="contact-name">${info.name}</div>
                <div class="contact-company">${info.company}</div>

                <div class="contact-details">
                    <div class="contact-details-row">
                        <span class="contact-details-label">役職</span>
                        <span class="contact-details-value">${info.role}</span>
                    </div>
                    <div class="contact-details-row">
                        <span class="contact-details-label">電話</span>
                        <span class="contact-details-value">${info.phone}</span>
                    </div>
                    <div class="contact-details-row">
                        <span class="contact-details-label">メール</span>
                        <span class="contact-details-value" style="font-size: 12px;">${info.email}</span>
                    </div>
                </div>

                <div class="contact-actions">
                    ${actionButtons}
                </div>
            `;

            return card;
        }

        function escapeForJs(str) {
            return str
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\n/g, '\\n');
        }

        function copyToClipboard(text) {
            const actualText = text
                .replace(/\\n/g, '\n')
                .replace(/\\'/g, "'")
                .replace(/\\\\/g, '\\');

            navigator.clipboard.writeText(actualText)
                .then(() => showToast('✅ メッセージをコピーしました'))
                .catch(() => showToast('⚠️ コピーに失敗しました'));
        }

        async function markComplete(contactId) {
            completedIds.add(contactId);
            await saveCompleted();
            showToast('✅ 完了にマークしました');
            renderDashboard(allData);
        }

        async function markIncomplete(contactId) {
            completedIds.delete(contactId);
            await saveCompleted();
            showToast('↶ やり直しにしました');
            renderDashboard(allData);
        }

        async function saveCompleted() {
            const data = {
                completed_ids: Array.from(completedIds),
                updated_at: new Date().toISOString()
            };

            try {
                const response = await fetch('contacted.json', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data, null, 2)
                });

                if (!response.ok) {
                    localStorage.setItem('completedIds', JSON.stringify(Array.from(completedIds)));
                }
            } catch (e) {
                localStorage.setItem('completedIds', JSON.stringify(Array.from(completedIds)));
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = `❌ ${message}`;
            errorDiv.style.display = 'block';
        }

        loadData();
    </script>
</body>
</html>
