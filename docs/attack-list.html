<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業CRMリスト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --primary: #1e40af;
  --primary-d: #1e3a8a;
  --primary-l: #dbeafe;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --c-pending: #94a3b8;
  --c-contacted: #3b82f6;
  --c-callback: #f97316;
  --c-mailed: #8b5cf6;
  --c-won: #10b981;
  --c-declined: #cbd5e1;
  --won-bg: #f0fdf4;
  --today-bg: #fff1f2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
    --border: #334155; --primary-l: #1e3a5f; --won-bg: #052e16; --today-bg: #3f0d10;
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
  --border: #334155; --primary-l: #1e3a5f; --won-bg: #052e16; --today-bg: #3f0d10;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}

/* ── HEADER ── */
.hdr{background:var(--primary);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hdr h1{font-size:16px;font-weight:800;flex:1;letter-spacing:-.01em}
.hdr-sub{font-size:11px;opacity:.75}
.btn-add{padding:6px 13px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:rgba(255,255,255,.28)}
.btn-refresh{padding:6px 10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;font-size:13px;cursor:pointer}

/* ── STATS ── */
.stats{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.sc{flex-shrink:0;text-align:center;padding:8px 12px;border-radius:10px;cursor:pointer;border:2px solid transparent;background:var(--bg);min-width:64px;transition:all .12s}
.sc:hover{transform:translateY(-1px)}
.sc.on{border-color:var(--primary);background:var(--primary-l)}
.sc .n{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sc .l{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
.sc.st .n{color:#ef4444}
.sc.sp .n{color:var(--c-pending)}
.sc.sco .n{color:var(--c-contacted)}
.sc.scb .n{color:var(--c-callback)}
.sc.sm .n{color:var(--c-mailed)}
.sc.sw .n{color:var(--c-won)}
.sc.sd .n{color:var(--muted)}

/* ── FILTER BAR ── */
.fbar{padding:9px 12px;display:flex;gap:7px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.fbar input,.fbar select{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.fbar input{flex:1;min-width:160px}
.fbar select{cursor:pointer}

/* ── LIST ── */
.lwrap{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--card);border-radius:11px;padding:12px 14px;border-left:4px solid var(--c-pending);cursor:pointer;transition:transform .1s,box-shadow .1s;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card.p-contacted{border-left-color:var(--c-contacted)}
.card.p-pending_callback{border-left-color:var(--c-callback)}
.card.p-mailed{border-left-color:var(--c-mailed)}
.card.p-won{border-left-color:var(--c-won);background:var(--won-bg)}
.card.p-declined{border-left-color:var(--c-declined);opacity:.65}
.card.is-today{background:var(--today-bg)}
.co-name{font-size:14px;font-weight:700;margin-bottom:4px;word-break:break-all}
.co-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
.co-meta+.co-meta{margin-top:4px}
.co-phone{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:var(--primary);font-variant-numeric:tabular-nums}

/* rank badges */
.rk{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:800}
.rk-S{background:#fee2e2;color:#b91c1c}
.rk-A{background:#fef3c7;color:#92600b}
.rk-B{background:#d1fae5;color:#065f46}
.rk-C{background:#f1f5f9;color:#64748b}

/* phase label */
.pl{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700}
.pl-pending{background:#f3f4f6;color:#6b7280}
.pl-contacted{background:#dbeafe;color:#1e40af}
.pl-pending_callback{background:#fed7aa;color:#9a3412}
.pl-mailed{background:#ede9fe;color:#5b21b6}
.pl-won{background:#d1fae5;color:#065f46}
.pl-declined{background:#f3f4f6;color:#9ca3af}

.nt{font-size:10px;color:var(--muted)}
.nt.past{color:#ef4444;font-weight:700}
.nt.due{color:#f97316;font-weight:700}
.log-cnt{font-size:10px;color:var(--muted)}

/* ── MODAL ── */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.ovl.open{display:flex}
.modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.2)}
.mhd{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.mhd h2{font-size:15px;font-weight:800;flex:1;word-break:break-all;line-height:1.3}
.mclose{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mtabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted);transition:color .1s}
.mtab.on{border-bottom-color:var(--primary);color:var(--primary)}
.mbody{padding:14px;overflow-y:auto;flex:1}

/* action grid */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.abtn{padding:12px 8px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .1s,transform .1s;font-family:inherit}
.abtn:hover{opacity:.85;transform:scale(.98)}
.a-ok{background:#dbeafe;color:#1e40af}
.a-ab{background:#fed7aa;color:#9a3412}
.a-cb{background:#fef3c7;color:#92600b}
.a-dm{background:#ede9fe;color:#5b21b6}
.a-lt{background:#d1fae5;color:#065f46}
.a-won{background:#bbf7d0;color:#14532d}
.a-no{background:#fee2e2;color:#7f1d1d}

/* log */
.log-item{padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.log-item:last-child{border-bottom:none}
.log-act{font-weight:700}
.log-dt{color:var(--muted);font-size:11px;margin-top:1px}
.log-note{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}

/* script */
.script-box{background:var(--bg);border-radius:10px;padding:14px;font-size:13px;line-height:1.9;white-space:pre-wrap;border:1px solid var(--border)}

/* info */
.irow{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.irow:last-of-type{border-bottom:none}
.ilabel{color:var(--muted);width:72px;flex-shrink:0;font-size:12px;padding-top:1px}
.ival{flex:1;word-break:break-all;line-height:1.5}
.ival a{color:var(--primary);text-decoration:none}
.ival a:hover{text-decoration:underline}
.sns-wrap{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.sl{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none}
.sl-ig{background:#fce7f3;color:#9d174d}
.sl-x{background:#f3f4f6;color:#111827}
.sl-fb{background:#dbeafe;color:#1e3a8a}
.sl-tt{background:#e0f2fe;color:#0c4a6e}
.sl-job{background:#ede9fe;color:#4c1d95}

/* form elements */
.note-ta{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;margin-top:6px;resize:vertical;min-height:60px;font-family:inherit}
.note-ta:focus{outline:none;border-color:var(--primary)}
.date-row{display:flex;gap:8px;align-items:center;margin-top:12px}
.date-inp{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.save-btn{padding:7px 13px;background:var(--primary);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.save-btn:hover{background:var(--primary-d)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}

/* add modal form */
.add-form{display:flex;flex-direction:column;gap:9px}
.add-inp{padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
.add-inp:focus{outline:none;border-color:var(--primary)}
.add-submit{padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.add-submit:hover{background:var(--primary-d)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;z-index:200;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* empty / loading */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* ── SCRIPT TABS ── */
.stabs{display:flex;gap:5px;margin-bottom:10px}
.stab{padding:6px 18px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s}
.stab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.script-name-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sname{font-size:12px;font-weight:700;color:var(--muted);flex:1}
.edit-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer}
.edit-btn:hover{background:var(--border)}
.script-edit-ta{width:100%;padding:10px 12px;border:1px solid var(--primary);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;line-height:1.9;min-height:260px;resize:vertical;font-family:inherit}
.script-name-inp{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;margin-bottom:8px}
.script-name-inp:focus,.script-edit-ta:focus{outline:none;border-color:var(--primary)}
.edit-actions{display:flex;gap:7px;margin-top:8px;align-items:center}
.save-scr-btn{padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.cancel-scr-btn{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.reset-scr-btn{padding:8px 12px;background:var(--bg);border:1px solid #fca5a5;border-radius:8px;font-size:11px;color:#dc2626;cursor:pointer;margin-left:auto}

/* ── IMPORT ── */
.imp-hint{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.8;background:var(--bg);padding:10px 12px;border-radius:8px;border:1px solid var(--border)}
.imp-hint code{font-family:'SF Mono',Menlo,Consolas,monospace;background:var(--border);padding:1px 4px;border-radius:3px}
.imp-csv-ta{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;line-height:1.6;min-height:130px;resize:vertical;font-family:'SF Mono',Menlo,Consolas,monospace}
.imp-csv-ta:focus{outline:none;border-color:var(--primary)}
.file-lbl{display:block;margin:8px 0;font-size:12px;color:var(--muted)}
.imp-parse-btn{padding:11px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;margin-top:6px}
.imp-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ichip{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700}
.ichip-n{background:#d1fae5;color:#065f46}
.ichip-d{background:#fed7aa;color:#9a3412}
.ichip-s{background:#f3f4f6;color:#6b7280}
.imp-sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.new-list{border:1px solid var(--border);border-radius:8px;overflow:hidden;max-height:160px;overflow-y:auto;margin-bottom:8px}
.new-item{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:8px;align-items:center}
.new-item:last-child{border-bottom:none}
.conflict-card{border:1px solid var(--c-callback);border-radius:9px;margin-bottom:10px;overflow:hidden}
.conflict-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--border);font-size:13px;font-weight:700}
.cbadge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;background:#fed7aa;color:#9a3412}
.cfield{display:grid;grid-template-columns:68px 1fr 1fr;gap:5px;padding:7px 12px;border-bottom:1px solid var(--border);align-items:start;font-size:12px}
.cfield:last-child{border-bottom:none}
.cfield-lbl{color:var(--muted);font-size:11px;padding-top:5px}
.cfield-head{font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:3px}
.cv{padding:5px 8px;border-radius:6px;border:2px solid var(--border);cursor:pointer;background:var(--bg);line-height:1.4;word-break:break-all;transition:all .1s}
.cv.sel{border-color:var(--primary);background:var(--primary-l)}
.cv-same{padding:5px 8px;border-radius:6px;background:var(--bg);line-height:1.4;word-break:break-all;color:var(--muted);font-size:11px}
.imp-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.iact{padding:10px 16px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.iact-new{background:#d1fae5;color:#065f46}
.iact-all{background:var(--primary);color:#fff}
.iact-can{background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.imp-back{padding:5px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:12px}
</style>
</head>
<body>

<div class="hdr">
  <div style="flex:1">
    <h1>📋 営業CRMリスト</h1>
  </div>
  <button class="btn-refresh" onclick="loadData()" title="再読込">🔄</button>
  <button class="btn-add" onclick="openImp()" style="background:rgba(255,255,255,.12);">📥 インポート</button>
  <button class="btn-add" onclick="openAdd()">＋ 追加</button>
</div>

<div class="stats" id="stats"></div>

<div class="fbar">
  <input type="text" id="q" placeholder="会社名・代表者・電話番号で検索..." oninput="renderList()">
  <select id="fi" onchange="renderList()"><option value="">業種: 全て</option></select>
  <select id="fc" onchange="renderList()"><option value="">市区町村: 全て</option></select>
  <select id="fr" onchange="renderList()">
    <option value="">周年ランク: 全て</option>
    <option value="S">S（最優先）</option>
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
  </select>
</div>

<div class="lwrap" id="lwrap"><div class="empty">読み込み中...</div></div>

<!-- company modal -->
<div class="ovl" id="ovl" onclick="closeModal(event)">
  <div class="modal">
    <div class="mhd">
      <h2 id="m-name">-</h2>
      <button class="mclose" onclick="closeModal()">×</button>
    </div>
    <div class="mtabs" id="mtabs">
      <div class="mtab on" onclick="switchTab('action')">📞 アクション</div>
      <div class="mtab" onclick="switchTab('log')">📋 履歴</div>
      <div class="mtab" onclick="switchTab('script')">📜 トークスクリプト</div>
      <div class="mtab" onclick="switchTab('info')">ℹ️ 情報</div>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<!-- add modal -->
<div class="ovl" id="add-ovl" onclick="closeAdd(event)">
  <div class="modal">
    <div class="mhd">
      <h2>＋ 会社を追加</h2>
      <button class="mclose" onclick="closeAdd()">×</button>
    </div>
    <div class="mbody">
      <div class="add-form">
        <input class="add-inp" id="an" placeholder="会社名 *">
        <input class="add-inp" id="ap" placeholder="電話番号">
        <input class="add-inp" id="aw" placeholder="ウェブサイト URL">
        <input class="add-inp" id="ac" placeholder="代表者名">
        <input class="add-inp" id="ai" placeholder="業種">
        <input class="add-inp" id="acy" placeholder="市区町村">
        <input class="add-inp" id="aig" placeholder="Instagram URL">
        <input class="add-inp" id="ax" placeholder="X (Twitter) URL">
        <input class="add-inp" id="aind" placeholder="Indeed URL">
        <button class="add-submit" onclick="doAdd()">追加する</button>
      </div>
    </div>
  </div>
</div>

<!-- import modal -->
<div class="ovl" id="imp-ovl" onclick="closeImp(event)">
  <div class="modal">
    <div class="mhd">
      <h2>📥 リストをインポート</h2>
      <button class="mclose" onclick="closeImp()">×</button>
    </div>
    <div class="mbody" id="imp-body">
      <!-- step 1 injected by openImp() -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://osipzwbsfbgbegjowydm.supabase.co';
const SB_KEY = 'sb_publishable_yO0lVlOP_r-qhnwjxqq0UQ_qjxSrlnC';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let cos = [], cur = null, curTab = 'action', curF = 'all';
const today = new Date().toISOString().slice(0,10);

const PHASES = {
  pending:          {lab:'未対応',      cls:'pl-pending'},
  contacted:        {lab:'電話済み',    cls:'pl-contacted'},
  pending_callback: {lab:'折り返し待ち',cls:'pl-pending_callback'},
  mailed:           {lab:'DM/手紙済み', cls:'pl-mailed'},
  won:              {lab:'商談獲得',    cls:'pl-won'},
  declined:         {lab:'お断り',      cls:'pl-declined'},
};

const ACTS = [
  {k:'tel_ok',  lab:'📞 電話→担当者OK',  cls:'a-ok',  phase:'contacted',        nd:false},
  {k:'tel_ab',  lab:'📵 電話→不在',       cls:'a-ab',  phase:'pending_callback', nd:true,  days:1},
  {k:'tel_cb',  lab:'📅 電話→かけ直し',  cls:'a-cb',  phase:'pending_callback', nd:true,  days:3},
  {k:'dm',      lab:'💬 DM送付',          cls:'a-dm',  phase:'mailed',           nd:true,  days:3},
  {k:'letter',  lab:'✉️ 手紙・ハガキ',   cls:'a-lt',  phase:'mailed',           nd:true,  days:7},
  {k:'won',     lab:'🎯 商談獲得！',      cls:'a-won', phase:'won',              nd:true,  days:7},
  {k:'declined',lab:'❌ お断り',          cls:'a-no',  phase:'declined',         nd:false},
];

const ACT_LABS = Object.fromEntries(ACTS.map(a=>[a.k, a.lab]));

// ── SCRIPTS (localStorage) ────────────────────────────

let curScr = 'A', scrEditing = false;
function getScripts() {
  try { const s=localStorage.getItem(SCR_KEY); return s?JSON.parse(s):{...SCR_DEFAULTS}; } catch { return {...SCR_DEFAULTS}; }
}
function putScripts(obj) {
  try { localStorage.setItem(SCR_KEY, JSON.stringify(obj)); } catch {}
}

// ── SCRIPT TAB ────────────────────────────────────────
function renderScriptTab() {
  const scrs = getScripts();
  const s = scrs[curScr] || SCR_DEFAULTS[curScr];
  scrEditing = false;
  const tabs = ['A','B','C'].map(k=>
    `<button class="stab ${k===curScr?'on':''}" onclick="setScrTab('${k}')">${scrs[k]?.name||SCR_DEFAULTS[k].name}</button>`
  ).join('');
  document.getElementById('mbody').innerHTML = `
    <div class="stabs">${tabs}</div>
    <div class="script-name-row">
      <span class="sname" id="cur-sname">${esc(s.name)}</span>
      <button class="edit-btn" onclick="startEditScript()">✏️ 編集</button>
    </div>
    <div id="scr-view"><div class="script-box">${esc(s.body)}</div></div>
    <div id="scr-edit" style="display:none">
      <input class="script-name-inp" id="sn-inp" value="${esc(s.name)}" placeholder="スクリプト名">
      <textarea class="script-edit-ta" id="sb-inp">${esc(s.body)}</textarea>
      <div class="edit-actions">
        <button class="save-scr-btn" onclick="saveScript()">💾 保存</button>
        <button class="cancel-scr-btn" onclick="cancelEditScript()">キャンセル</button>
        <button class="reset-scr-btn" onclick="resetScript()">デフォルトに戻す</button>
      </div>
    </div>`;
}

function setScrTab(k) { curScr=k; renderScriptTab(); }

function startEditScript() {
  scrEditing=true;
  document.getElementById('scr-view').style.display='none';
  document.getElementById('scr-edit').style.display='';
}

function cancelEditScript() {
  scrEditing=false;
  document.getElementById('scr-view').style.display='';
  document.getElementById('scr-edit').style.display='none';
}

function saveScript() {
  const name = document.getElementById('sn-inp')?.value.trim();
  const body = document.getElementById('sb-inp')?.value;
  if (!name||body===undefined) return;
  const scrs = getScripts();
  scrs[curScr] = {name, body};
  putScripts(scrs);
  toast('✅ スクリプトを保存しました');
  renderScriptTab();
}

function resetScript() {
  if (!confirm(curScr+'スクリプトをデフォルトに戻しますか？')) return;
  const scrs = getScripts();
  scrs[curScr] = {...SCR_DEFAULTS[curScr]};
  putScripts(scrs);
  toast('🔄 デフォルトに戻しました');
  renderScriptTab();
}

// ── IMPORT ────────────────────────────────────────────
let impParsed = {news:[], conflicts:[]};
const IMP_COLS = ['company_name','phone','website','ceo_name','industry','city','anniversary_rank','anniversary_years'];
const IMP_LABS = {company_name:'会社名',phone:'電話番号',website:'ウェブサイト',ceo_name:'代表者名',industry:'業種',city:'市区町村',anniversary_rank:'周年ランク',anniversary_years:'周年年数'};

function openImp() {
  impParsed = {news:[], conflicts:[]};
  document.getElementById('imp-body').innerHTML = renderImpStep1();
  document.getElementById('imp-ovl').classList.add('open');
}
function closeImp(e) {
  if (e && e.target!==document.getElementById('imp-ovl')) return;
  document.getElementById('imp-ovl').classList.remove('open');
}

function renderImpStep1() {
  return `
    <div class="imp-hint">
      <strong>CSV形式でリストを貼り付けるか、ファイルを選択してください。</strong><br>
      列順: <code>会社名</code>, <code>電話番号</code>, <code>ウェブサイト</code>, <code>代表者名</code>, <code>業種</code>, <code>市区町村</code>, <code>周年ランク(S/A/B/C)</code>, <code>周年年数</code><br>
      ※ 1行目がヘッダーの場合は自動でスキップします。重複は会社名または電話番号で検出します。
    </div>
    <textarea class="imp-csv-ta" id="imp-csv" placeholder="例:
株式会社ABC,098-000-0001,https://example.com,山田太郎,建設業,那覇市,A,30
株式会社DEF,098-000-0002,,,,沖縄市,B,20"></textarea>
    <label class="file-lbl">またはCSVファイルを選択: <input type="file" id="imp-file" accept=".csv,.txt" onchange="onImpFile(this)"></label>
    <button class="imp-parse-btn" onclick="parseImport()">🔍 解析する</button>`;
}

function onImpFile(input) {
  const f = input.files?.[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => { document.getElementById('imp-csv').value = e.target.result; };
  r.readAsText(f, 'utf-8');
}

function parseCSVLine(line) {
  const res=[]; let cur='', inQ=false;
  for (let i=0;i<line.length;i++) {
    const ch=line[i];
    if (ch==='"') { inQ=!inQ; }
    else if (ch===','&&!inQ) { res.push(cur.trim()); cur=''; }
    else { cur+=ch; }
  }
  res.push(cur.trim());
  return res;
}

function isHeaderRow(row) {
  const first=(row[0]||'').toLowerCase();
  return first.includes('会社')||first.includes('company')||first==='名前'||first==='name';
}

function parseImport() {
  const raw = (document.getElementById('imp-csv')?.value||'').trim();
  if (!raw) { toast('❌ CSVを入力してください'); return; }
  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  let startIdx = 0;
  const firstRow = parseCSVLine(lines[0]);
  if (isHeaderRow(firstRow)) startIdx = 1;

  const news=[], conflicts=[];
  for (let i=startIdx;i<lines.length;i++) {
    const cols = parseCSVLine(lines[i]);
    if (!cols[0]) continue;
    const row = {};
    IMP_COLS.forEach((k,j)=>{ const v=cols[j]||''; if (v) row[k]=v; });

    const existing = cos.find(c=>{
      if (row.company_name && c.company_name===row.company_name) return true;
      if (row.phone && c.phone && c.phone===row.phone) return true;
      return false;
    });

    if (!existing) {
      news.push(row);
    } else {
      const diffs = IMP_COLS.filter(k=>{
        const nv=(row[k]||'').trim();
        const ov=(existing[k]||'').toString().trim();
        return nv && nv!==ov;
      });
      conflicts.push({existing, incoming:row, diffs, chosen:{}});
    }
  }

  impParsed = {news, conflicts};
  conflicts.forEach(cf=>{
    cf.diffs.forEach(k=>{ cf.chosen[k]='new'; });
  });
  renderImpStep2();
}

function renderImpStep2() {
  const {news, conflicts} = impParsed;
  const total = news.length + conflicts.length;
  if (!total) { toast('❌ 新規・重複ともに0件でした'); return; }

  let html = `
    <button class="imp-back" onclick="document.getElementById('imp-body').innerHTML=renderImpStep1()">← 戻る</button>
    <div class="imp-summary">
      <div class="ichip ichip-n">✅ 新規 ${news.length}件</div>
      <div class="ichip ichip-d">⚠️ 重複 ${conflicts.length}件</div>
    </div>`;

  if (news.length) {
    html += `<div class="imp-sec">新規追加（${news.length}件）</div>
    <div class="new-list">
      ${news.map(r=>`<div class="new-item">
        <span>${esc(r.company_name)}</span>
        ${r.phone?`<span style="color:var(--muted);font-size:11px;">${esc(r.phone)}</span>`:''}
        ${r.industry?`<span style="color:var(--muted);font-size:11px;">${esc(r.industry)}</span>`:''}
      </div>`).join('')}
    </div>`;
  }

  if (conflicts.length) {
    html += `<div class="imp-sec">重複（差分あり）— どちらの情報を使うか選択してください（${conflicts.length}件）</div>`;
    html += conflicts.map((cf,idx)=>{
      const fields = cf.diffs.map(k=>{
        const ov=esc(cf.existing[k]||'-');
        const nv=esc(cf.incoming[k]||'-');
        const selE=cf.chosen[k]==='existing'?'sel':'';
        const selN=cf.chosen[k]==='new'?'sel':'';
        return `<div class="cfield">
          <div class="cfield-lbl">${IMP_LABS[k]||k}</div>
          <div>
            <div class="cfield-head">現在の値</div>
            <div class="cv ${selE}" onclick="pickField(${idx},'${k}','existing')">${ov}</div>
          </div>
          <div>
            <div class="cfield-head">新しい値</div>
            <div class="cv ${selN}" onclick="pickField(${idx},'${k}','new')">${nv}</div>
          </div>
        </div>`;
      }).join('');
      const sameFields = IMP_COLS.filter(k=>!cf.diffs.includes(k)&&cf.existing[k]);
      const sameHtml = sameFields.length ? sameFields.map(k=>`<div class="cfield">
        <div class="cfield-lbl">${IMP_LABS[k]||k}</div>
        <div class="cv-same" style="grid-column:2/4">同じ: ${esc(cf.existing[k])}</div>
      </div>`).join('') : '';
      return `<div class="conflict-card" id="ccf-${idx}">
        <div class="conflict-hd">
          <span>${esc(cf.existing.company_name)}</span>
          <span class="cbadge">${cf.diffs.length}項目差分</span>
        </div>
        ${fields}${sameHtml}
      </div>`;
    }).join('');
  }

  html += `<div class="imp-acts">
    ${news.length?`<button class="iact iact-new" onclick="doImpNew()">✅ 新規${news.length}件だけ追加</button>`:''}
    ${conflicts.length?`<button class="iact iact-all" onclick="doImpAll()">💾 新規＋重複を反映</button>`:''}
    <button class="iact iact-can" onclick="closeImp()">キャンセル</button>
  </div>`;

  document.getElementById('imp-body').innerHTML = html;
}

function pickField(idx, key, side) {
  impParsed.conflicts[idx].chosen[key] = side;
  const card = document.getElementById('ccf-'+idx);
  if (!card) return;
  card.querySelectorAll('.cfield').forEach(row=>{
    const lbl = row.querySelector('.cfield-lbl');
    if (!lbl) return;
    const k = Object.entries(IMP_LABS).find(([,v])=>v===lbl.textContent)?.[0];
    if (!k) return;
    const [leftEl, rightEl] = [...row.querySelectorAll('.cv')];
    if (leftEl) leftEl.classList.toggle('sel', impParsed.conflicts[idx].chosen[k]==='existing');
    if (rightEl) rightEl.classList.toggle('sel', impParsed.conflicts[idx].chosen[k]==='new');
  });
}

async function doImpNew() {
  const {news} = impParsed;
  if (!news.length) return;
  const rows = news.map(r=>({...r, phase:'pending'}));
  const {data,error} = await sb.from('ceremony_attacks').insert(rows).select();
  if (error) { toast('❌ 追加失敗: '+error.message); return; }
  if (data) data.forEach(d=>cos.push(d));
  buildFilters(); renderStats(); renderList();
  toast(`✅ ${news.length}件を追加しました`);
  closeImp();
}

async function doImpAll() {
  const {news, conflicts} = impParsed;
  let added=0, updated=0, errs=[];

  if (news.length) {
    const rows = news.map(r=>({...r, phase:'pending'}));
    const {data,error} = await sb.from('ceremony_attacks').insert(rows).select();
    if (error) errs.push(error.message);
    else { data.forEach(d=>cos.push(d)); added=data.length; }
  }

  for (const cf of conflicts) {
    const upd = {};
    cf.diffs.forEach(k=>{
      if (cf.chosen[k]==='new') upd[k] = cf.incoming[k]||null;
    });
    if (!Object.keys(upd).length) continue;
    const {error} = await sb.from('ceremony_attacks').update(upd).eq('id',cf.existing.id);
    if (error) errs.push(error.message);
    else { Object.assign(cf.existing, upd); updated++; }
  }

  buildFilters(); renderStats(); renderList();
  if (errs.length) { toast('⚠️ 一部エラー: '+errs[0]); }
  else { toast(`✅ 追加${added}件、更新${updated}件 完了`); }
  closeImp();
}

// ── DATA ──────────────────────────────────────────────
async function loadData() {
  document.getElementById('lwrap').innerHTML = '<div class="empty">読み込み中...</div>';
  const {data, error} = await sb.from('ceremony_attacks').select('*');
  if (error) { document.getElementById('lwrap').innerHTML = '<div class="empty">❌ 読み込みエラー: '+esc(error.message)+'</div>'; return; }
  cos = data || [];
  buildFilters();
  renderStats();
  renderList();
}

function buildFilters() {
  const fi = document.getElementById('fi'), fc = document.getElementById('fc');
  // clear old options except first
  while (fi.options.length > 1) fi.remove(1);
  while (fc.options.length > 1) fc.remove(1);
  [...new Set(cos.map(c=>c.industry||c.i).filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option'); o.value=o.textContent=v; fi.appendChild(o);
  });
  [...new Set(cos.map(c=>c.city||c.c).filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option'); o.value=o.textContent=v; fc.appendChild(o);
  });
}

// ── STATS ─────────────────────────────────────────────
function renderStats() {
  const cnt = {
    all: cos.length,
    today: cos.filter(c=>c.next_date&&c.next_date<=today&&c.phase!=='declined'&&c.phase!=='won').length,
    pending: cos.filter(c=>c.phase==='pending').length,
    contacted: cos.filter(c=>c.phase==='contacted').length,
    cb: cos.filter(c=>c.phase==='pending_callback').length,
    mailed: cos.filter(c=>c.phase==='mailed').length,
    won: cos.filter(c=>c.phase==='won').length,
    declined: cos.filter(c=>c.phase==='declined').length,
  };
  const chips = [
    {f:'all',      cls:'',    n:cnt.all,      l:'全て'},
    {f:'today',    cls:'st',  n:cnt.today,    l:'今日'},
    {f:'pending',  cls:'sp',  n:cnt.pending,  l:'未対応'},
    {f:'contacted',cls:'sco', n:cnt.contacted,l:'電話済み'},
    {f:'pending_callback',cls:'scb',n:cnt.cb, l:'折り返し'},
    {f:'mailed',   cls:'sm',  n:cnt.mailed,   l:'DM/手紙'},
    {f:'won',      cls:'sw',  n:cnt.won,      l:'商談獲得'},
    {f:'declined', cls:'sd',  n:cnt.declined, l:'お断り'},
  ];
  document.getElementById('stats').innerHTML = chips.map(c=>
    `<div class="sc ${c.cls} ${curF===c.f?'on':''}" onclick="setF('${c.f}')">
      <div class="n">${c.n}</div><div class="l">${c.l}</div>
    </div>`
  ).join('');
}

function setF(f){ curF=f; renderStats(); renderList(); }

// ── LIST ──────────────────────────────────────────────
function getRows() {
  const q  = document.getElementById('q').value.toLowerCase();
  const fi = document.getElementById('fi').value;
  const fc = document.getElementById('fc').value;
  const fr = document.getElementById('fr').value;
  let rows = cos.filter(c=>{
    const industry = c.industry||c.i||'';
    const city     = c.city||c.c||'';
    const rank     = c.anniversary_rank||c.ar||'';
    if (fi && industry!==fi) return false;
    if (fc && city!==fc) return false;
    if (fr && rank!==fr) return false;
    if (curF==='today') {
      if (!c.next_date||c.next_date>today||c.phase==='declined'||c.phase==='won') return false;
    } else if (curF!=='all') {
      if (c.phase!==curF) return false;
    }
    if (q) {
      const h = ((c.company_name||'')+' '+(c.ceo_name||'')+' '+(c.phone||'')+' '+(c.city||'')).toLowerCase();
      if (!h.includes(q)) return false;
    }
    return true;
  });
  const ro={S:0,A:1,B:2,C:3,'':4};
  const po={pending_callback:0,contacted:1,mailed:2,pending:3,won:4,declined:5};
  rows.sort((a,b)=>{
    const at=(a.next_date&&a.next_date<=today&&a.phase!=='declined'&&a.phase!=='won')?0:1;
    const bt=(b.next_date&&b.next_date<=today&&b.phase!=='declined'&&b.phase!=='won')?0:1;
    if (at!==bt) return at-bt;
    const pa=po[a.phase]??99, pb=po[b.phase]??99;
    if (pa!==pb) return pa-pb;
    const ra=ro[a.anniversary_rank||a.ar]??99, rb=ro[b.anniversary_rank||b.ar]??99;
    return ra-rb;
  });
  return rows;
}

function renderList() {
  const rows = getRows();
  const w = document.getElementById('lwrap');
  if (!rows.length) { w.innerHTML='<div class="empty">条件に合う会社がありません</div>'; return; }
  w.innerHTML = rows.map(c=>{
    const phase   = c.phase||'pending';
    const ph      = PHASES[phase]||PHASES.pending;
    const rank    = c.anniversary_rank||c.ar||'';
    const years   = c.anniversary_years||c.ay||'';
    const city    = c.city||c.c||'';
    const ind     = c.industry||c.i||'';
    const ceo     = c.ceo_name||c.ceo||'';
    const phone   = c.phone||c.p||'';
    const isToday = c.next_date&&c.next_date<=today&&phase!=='declined'&&phase!=='won';
    const logs    = (c.source_data||{}).contact_log||[];
    const hasSns  = c.instagram_url||c.x_url||c.facebook_url||c.tiktok_url;
    const hasJob  = c.indeed_url||c.own_recruit_url||c.job_antenna_url;

    let ntHtml='';
    if (c.next_date) {
      const nc = c.next_date<today?'past':(c.next_date===today?'due':'');
      ntHtml=`<span class="nt ${nc}">📅${c.next_date}</span>`;
    }
    return `<div class="card p-${phase} ${isToday?'is-today':''}" onclick="openModal('${esc(c.id)}')">
      <div>
        <div class="co-name">${esc(c.company_name)}</div>
        <div class="co-meta">
          ${rank?`<span class="rk rk-${rank}">${rank}</span>`:''}
          ${years?`<span>${years}周年</span>`:''}
          ${city?`<span>📍${esc(city)}</span>`:''}
          ${ind?`<span>${esc(ind)}</span>`:''}
          ${ceo?`<span>👤${esc(ceo)}</span>`:''}
          ${phone?`<span class="co-phone">📞${esc(phone)}</span>`:''}
        </div>
        <div class="co-meta">
          <span class="pl ${ph.cls}">${ph.lab}</span>
          ${ntHtml}
          ${logs.length?`<span class="log-cnt">📝${logs.length}件</span>`:''}
          ${hasSns?'<span style="color:#8b5cf6;font-size:10px;">SNS</span>':''}
          ${hasJob?'<span style="color:#3730a3;font-size:10px;">求人</span>':''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── MODAL ─────────────────────────────────────────────
function openModal(id) {
  cur = cos.find(c=>String(c.id)===String(id));
  if (!cur) return;
  curTab='action';
  document.getElementById('m-name').textContent = cur.company_name;
  document.getElementById('ovl').classList.add('open');
  document.querySelectorAll('.mtab').forEach((el,i)=>el.classList.toggle('on',i===0));
  renderTab();
}

function closeModal(e) {
  if (e && e.target!==document.getElementById('ovl')) return;
  document.getElementById('ovl').classList.remove('open');
  cur=null;
}

function switchTab(t) {
  curTab=t;
  const order=['action','log','script','info'];
  document.querySelectorAll('.mtab').forEach((el,i)=>el.classList.toggle('on',order[i]===t));
  renderTab();
}

function renderTab() {
  const c   = cur;
  const src = c.source_data||{};
  const logs= src.contact_log||[];
  const b   = document.getElementById('mbody');

  if (curTab==='action') {
    b.innerHTML = `
      <div class="agrid">${ACTS.map(a=>`<button class="abtn ${a.cls}" onclick="doAct('${a.k}')">${a.lab}</button>`).join('')}</div>
      <div class="section-label">メモ（任意）</div>
      <textarea class="note-ta" id="act-note" placeholder="例：担当者名・伝言内容など..."></textarea>
      <div class="date-row">
        <span style="font-size:12px;color:var(--muted)">次回フォロー日:</span>
        <input type="date" class="date-inp" id="nd-inp" value="${c.next_date||''}">
        <button class="save-btn" onclick="saveNd()">保存</button>
      </div>`;

  } else if (curTab==='log') {
    if (!logs.length) { b.innerHTML='<div class="empty">連絡記録がまだありません</div>'; return; }
    b.innerHTML = [...logs].reverse().map(l=>`
      <div class="log-item">
        <div class="log-act">${ACT_LABS[l.action]||l.action||'-'}</div>
        <div class="log-dt">${l.date||''}${l.time?' '+l.time:''}</div>
        ${l.note?`<div class="log-note">${esc(l.note)}</div>`:''}
      </div>`).join('');

  } else if (curTab==='script') {
    renderScriptTab();

  } else if (curTab==='info') {
    const rank  = c.anniversary_rank||c.ar||'';
    const years = c.anniversary_years||c.ay||'';
    const phone = c.phone||c.p||'';
    const web   = c.website||c.w||'';
    const ceo   = c.ceo_name||c.ceo||'';
    const city  = c.city||c.c||'';
    const ind   = c.industry||c.i||'';

    const snsHtml = [
      c.instagram_url?`<a class="sl sl-ig" href="${esc(c.instagram_url)}" target="_blank" rel="noopener">📸 Instagram</a>`:'',
      c.x_url?`<a class="sl sl-x" href="${esc(c.x_url)}" target="_blank" rel="noopener">✕ X</a>`:'',
      c.facebook_url?`<a class="sl sl-fb" href="${esc(c.facebook_url)}" target="_blank" rel="noopener">📘 Facebook</a>`:'',
      c.tiktok_url?`<a class="sl sl-tt" href="${esc(c.tiktok_url)}" target="_blank" rel="noopener">🎵 TikTok</a>`:'',
    ].filter(Boolean).join('');

    const jobHtml = [
      c.indeed_url?`<a class="sl sl-job" href="${esc(c.indeed_url)}" target="_blank" rel="noopener">Indeed</a>`:'',
      c.own_recruit_url?`<a class="sl sl-job" href="${esc(c.own_recruit_url)}" target="_blank" rel="noopener">自社求人</a>`:'',
      c.job_antenna_url?`<a class="sl sl-job" href="${esc(c.job_antenna_url)}" target="_blank" rel="noopener">求人アンテナ</a>`:'',
    ].filter(Boolean).join('');

    const rows = [
      ['電話番号', phone?`<a href="tel:${esc(phone)}">${esc(phone)}</a>`:'-'],
      ['代表者',   esc(ceo)||'-'],
      ['業種',     esc(ind)||'-'],
      ['所在地',   esc(city)||'-'],
      ['周年',     rank?`<span class="rk rk-${rank}">${rank}</span>${years?' '+years+'周年':''}`:'-'],
      ['HP',       web?`<a href="${esc(web)}" target="_blank" rel="noopener">ウェブサイトを開く →</a>`:'-'],
      ['SNS',      snsHtml?`<div class="sns-wrap">${snsHtml}</div>`:'-'],
      ['求人',     jobHtml?`<div class="sns-wrap">${jobHtml}</div>`:'-'],
    ];

    b.innerHTML = rows.map(([l,v])=>`
      <div class="irow"><div class="ilabel">${l}</div><div class="ival">${v}</div></div>
    `).join('') + `
      <div style="margin-top:14px;">
        <div class="section-label">メモ</div>
        <textarea class="note-ta" id="info-memo" placeholder="メモを入力...">${esc(src.memo||'')}</textarea>
        <button class="save-btn" style="margin-top:8px;" onclick="saveMemo()">メモを保存</button>
      </div>`;
  }
}

// ── ACTIONS ───────────────────────────────────────────
async function doAct(key) {
  const c   = cur;
  const act = ACTS.find(a=>a.k===key);
  if (!act) return;
  const note = document.getElementById('act-note')?.value.trim()||'';
  const now  = new Date();
  const src  = {...(c.source_data||{})};
  const log  = [...(src.contact_log||[])];
  log.push({action:key, date:now.toISOString().slice(0,10), time:now.toTimeString().slice(0,5), note});
  src.contact_log = log;

  let nd = c.next_date||null;
  if (act.nd) {
    const d = new Date(); d.setDate(d.getDate()+act.days);
    nd = d.toISOString().slice(0,10);
  }

  const upd = {phase:act.phase, source_data:src, next_date:nd};
  const {error} = await sb.from('ceremony_attacks').update(upd).eq('id',c.id);
  if (error) { toast('❌ 保存失敗: '+error.message); return; }
  Object.assign(c, upd);
  const idx=cos.findIndex(x=>x.id===c.id); if (idx>=0) Object.assign(cos[idx],upd);
  const el=document.getElementById('act-note'); if (el) el.value='';
  if (document.getElementById('nd-inp')) document.getElementById('nd-inp').value=nd||'';
  renderStats(); renderList();
  toast('✅ '+act.lab+' を記録しました');
}

async function saveNd() {
  const nd = document.getElementById('nd-inp')?.value||null;
  const {error} = await sb.from('ceremony_attacks').update({next_date:nd}).eq('id',cur.id);
  if (error) { toast('❌ 保存失敗'); return; }
  cur.next_date=nd;
  const idx=cos.findIndex(x=>x.id===cur.id); if (idx>=0) cos[idx].next_date=nd;
  renderStats(); renderList();
  toast('📅 次回フォロー日を保存しました');
}

async function saveMemo() {
  const memo = document.getElementById('info-memo')?.value||'';
  const src  = {...(cur.source_data||{}), memo};
  const {error} = await sb.from('ceremony_attacks').update({source_data:src}).eq('id',cur.id);
  if (error) { toast('❌ 保存失敗'); return; }
  cur.source_data=src;
  const idx=cos.findIndex(x=>x.id===cur.id); if (idx>=0) cos[idx].source_data=src;
  toast('✅ メモを保存しました');
}

// ── ADD COMPANY ───────────────────────────────────────
function openAdd() { document.getElementById('add-ovl').classList.add('open'); }
function closeAdd(e) {
  if (e && e.target!==document.getElementById('add-ovl')) return;
  document.getElementById('add-ovl').classList.remove('open');
}

async function doAdd() {
  const name = document.getElementById('an').value.trim();
  if (!name) { toast('❌ 会社名は必須です'); return; }
  const row = {
    company_name: name,
    phone:        document.getElementById('ap').value.trim()||null,
    website:      document.getElementById('aw').value.trim()||null,
    ceo_name:     document.getElementById('ac').value.trim()||null,
    industry:     document.getElementById('ai').value.trim()||null,
    city:         document.getElementById('acy').value.trim()||null,
    instagram_url:document.getElementById('aig').value.trim()||null,
    x_url:        document.getElementById('ax').value.trim()||null,
    indeed_url:   document.getElementById('aind').value.trim()||null,
    phase:        'pending',
  };
  const {data,error} = await sb.from('ceremony_attacks').insert(row).select().single();
  if (error) { toast('❌ 追加失敗: '+error.message); return; }
  cos.push(data);
  buildFilters(); renderStats(); renderList();
  document.getElementById('add-ovl').classList.remove('open');
  ['an','ap','aw','ac','ai','acy','aig','ax','aind'].forEach(id=>{ document.getElementById(id).value=''; });
  toast('✅ '+name+' を追加しました');
}

// ── UTILS ─────────────────────────────────────────────
function esc(s) {
  if (s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600);
}

// ── INIT ──────────────────────────────────────────────
loadData();
</script>
