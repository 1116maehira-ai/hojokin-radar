<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>タイミング・ジャンプ</title>
<style>
  :root { --sky1:#8ec9ff; --sky2:#d6efff; --ground:#6bbf59; --dirt:#8a5a2b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #0e1726; display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 12px; color: #fff; overflow: hidden;
  }
  .wrap { width: 100%; max-width: 720px; }
  .frame {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.5);
    background: linear-gradient(#8ec9ff, #d6efff);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute; top: 10px; left: 12px; right: 12px;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
    font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.25); color:#16324f;
  }
  .bar { flex: 1; height: 12px; background: rgba(255,255,255,.55); border-radius: 99px; overflow: hidden; }
  .bar > i { display:block; height:100%; width:0%; background: linear-gradient(90deg,#ffcf3f,#ff8a3f); transition: width .1s linear; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(8,18,33,.62); color: #fff; padding: 20px;
    backdrop-filter: blur(2px);
  }
  .overlay h1 { font-size: clamp(22px, 6vw, 40px); }
  .overlay p { font-size: clamp(13px, 3.6vw, 17px); opacity: .92; line-height: 1.6; }
  .btn {
    margin-top: 6px; border: none; cursor: pointer; font-weight: 800;
    font-size: clamp(15px, 4vw, 19px); color: #16324f;
    background: linear-gradient(#ffe07a, #ffc23f); padding: 12px 28px; border-radius: 999px;
    box-shadow: 0 6px 0 #d99a1e, 0 8px 18px rgba(0,0,0,.35); transition: transform .05s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #d99a1e, 0 4px 10px rgba(0,0,0,.35); }
  .hide { display: none !important; }
  .tag { font-size: 12px; opacity:.8; letter-spacing:.05em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="frame" id="frame">
      <canvas id="c" width="1280" height="720"></canvas>
      <div class="hud">
        <span id="dist">0m</span>
        <div class="bar"><i id="fill"></i></div>
        <span>🚩</span>
      </div>

      <div class="overlay" id="startScreen">
        <div class="tag">TIMING JUMP</div>
        <h1>タイミング・ジャンプ</h1>
        <p>タップ / クリック / スペースキー で<b>ジャンプ</b>！<br>岩を避けてゴール🚩を目指そう。</p>
        <button class="btn" id="startBtn">スタート</button>
      </div>

      <div class="overlay hide" id="overScreen">
        <h1 id="overTitle">ゲームオーバー</h1>
        <p id="overMsg"></p>
        <button class="btn" id="retryBtn">もう一度</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const GROUND_Y = H - 140;

  const startScreen = document.getElementById('startScreen');
  const overScreen  = document.getElementById('overScreen');
  const overTitle   = document.getElementById('overTitle');
  const overMsg     = document.getElementById('overMsg');
  const fill        = document.getElementById('fill');
  const distEl      = document.getElementById('dist');

  // --- 本番グラフィックの読み込み（失敗時は図形描画にフォールバック） ---
  const IMG = {};
  const SRC = {
    player: 'assets/player.png',
    rock:   'assets/rock.png',
    flag:   'assets/flag.png',
    bg:     'assets/background.jpg',
  };
  for (const k in SRC) {
    const im = new Image();
    im.onload = () => { IMG[k] = im; };
    im.onerror = () => { IMG[k] = null; };
    im.src = SRC[k];
  }

  const GOAL_DIST = 900;
  const GRAVITY   = 2600;
  const JUMP_V    = -1050;

  let state = 'ready';
  let player, obstacles, dist, speed, spawnTimer, nextGap, t, last;

  function reset() {
    player = { x: 220, y: GROUND_Y, vy: 0, r: 46, onGround: true, squash: 0 };
    obstacles = [];
    dist = 0;
    speed = 520;
    spawnTimer = 0;
    nextGap = 1.1;
    t = 0;
  }

  function start() {
    reset();
    state = 'playing';
    startScreen.classList.add('hide');
    overScreen.classList.add('hide');
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function jump() {
    if (state === 'ready') { start(); return; }
    if (state === 'over' || state === 'clear') { start(); return; }
    if (state === 'playing' && player.onGround) {
      player.vy = JUMP_V;
      player.onGround = false;
    }
  }

  function spawnObstacle() {
    const h = 60 + Math.random() * 70;
    obstacles.push({ x: W + 60, w: 54 + Math.random()*20, h, passed:false });
  }

  function gameOver(cleared) {
    state = cleared ? 'clear' : 'over';
    overTitle.textContent = cleared ? '🎉 クリア！' : 'ゲームオーバー';
    overMsg.textContent = cleared
      ? `ゴール到達！ 走った距離 ${Math.floor(dist)}m`
      : `記録 ${Math.floor(dist)}m ／ ゴールまで あと ${Math.max(0, GOAL_DIST - Math.floor(dist))}m`;
    overScreen.classList.remove('hide');
  }

  function update(dt) {
    t += dt;
    speed = Math.min(1000, 520 + dist * 0.55);
    dist += speed * dt / 60;

    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND_Y) { player.y = GROUND_Y; player.vy = 0; player.onGround = true; }
    player.squash = Math.max(0, player.squash - dt*4);

    spawnTimer += dt;
    if (spawnTimer >= nextGap) {
      spawnTimer = 0;
      spawnObstacle();
      const base = Math.max(0.75, 1.25 - dist*0.0006);
      nextGap = base + Math.random() * 0.5;
    }

    for (const o of obstacles) {
      o.x -= speed * dt;
      const rx = Math.max(o.x, Math.min(player.x, o.x + o.w));
      const topY = GROUND_Y - o.h;
      const ry = Math.max(topY, Math.min(player.y, GROUND_Y));
      const dx = player.x - rx, dy = player.y - ry;
      if (dx*dx + dy*dy < (player.r*0.66)*(player.r*0.66)) {
        player.squash = 1; draw(); gameOver(false); return;
      }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -40);

    if (dist >= GOAL_DIST) { draw(); gameOver(true); return; }

    const pct = Math.min(100, dist / GOAL_DIST * 100);
    fill.style.width = pct + '%';
    distEl.textContent = Math.floor(dist) + 'm';
  }

  function drawBackground() {
    if (IMG.bg) {
      // カバー描画 + ゆっくり横スクロール（パララックス）
      const img = IMG.bg;
      const scale = Math.max(W / img.width, H / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      const off = ((dist * 0.5) % dw);
      const y = H - dh; // 下端合わせ
      ctx.drawImage(img, -off, y, dw, dh);
      ctx.drawImage(img, dw - off, y, dw, dh);
    } else {
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#8ec9ff'); g.addColorStop(1,'#d6efff');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#bfe6a8';
      for (let i=0;i<4;i++){
        const bx = ((-dist*3 + i*420) % (W+420) + (W+420)) % (W+420) - 210;
        ctx.beginPath(); ctx.arc(bx, GROUND_Y+40, 180, Math.PI, 0); ctx.fill();
      }
    }
    // 走行面（地面バンド）— 画像の有無に関わらず一定にして接地感を安定させる
    ctx.fillStyle = '#6bbf59'; ctx.fillRect(0, GROUND_Y+40, W, H-GROUND_Y);
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(0, GROUND_Y+70, W, H-GROUND_Y);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 4;
    for (let i=0;i<14;i++){
      const lx = ((-dist*6 + i*120) % (W+120) + (W+120)) % (W+120);
      ctx.beginPath(); ctx.moveTo(lx, GROUND_Y+54); ctx.lineTo(lx-30, GROUND_Y+54); ctx.stroke();
    }
  }

  function drawGoal() {
    const goalScreenX = W + (GOAL_DIST - dist) * 2.2;
    if (goalScreenX < W + 80) {
      if (IMG.flag) {
        const fh = 190, fw = fh * (IMG.flag.width / IMG.flag.height);
        ctx.drawImage(IMG.flag, goalScreenX - 6, GROUND_Y + 42 - fh, fw, fh);
      } else {
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(goalScreenX, GROUND_Y-120, 8, 160);
        ctx.beginPath();
        ctx.moveTo(goalScreenX+8, GROUND_Y-120);
        ctx.lineTo(goalScreenX+70, GROUND_Y-100);
        ctx.lineTo(goalScreenX+8, GROUND_Y-80);
        ctx.fill();
      }
    }
  }

  function drawObstacle(o) {
    const topY = GROUND_Y - o.h;
    if (IMG.rock) {
      // 岩画像を当たり判定ボックスに合わせて（少し大きめに見栄え）描画
      const iw = o.w * 1.7, ih = iw * (IMG.rock.height / IMG.rock.width);
      ctx.drawImage(IMG.rock, o.x + o.w/2 - iw/2, GROUND_Y + 44 - ih, iw, ih);
    } else {
      ctx.fillStyle = '#7a7f87';
      roundRect(o.x, topY, o.w, o.h, 10); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      roundRect(o.x+6, topY+6, o.w-12, o.h*0.4, 8); ctx.fill();
    }
  }

  function drawPlayer() {
    const sq = player.squash;
    // 影
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    const shadowScale = 1 - (GROUND_Y - player.y)/500;
    ctx.beginPath(); ctx.ellipse(player.x, GROUND_Y+40, 46*shadowScale, 12*shadowScale, 0,0,Math.PI*2); ctx.fill();

    if (IMG.player) {
      const base = 128;
      const w = base * (1 + sq*0.22);
      const h = base * (1 - sq*0.30);
      // 接地: プレイヤーの足元(player.y)に画像の下端を合わせる
      ctx.drawImage(IMG.player, player.x - w/2, player.y + 44 - h, w, h);
    } else {
      const rx = player.r * (1 + sq*0.25);
      const ry = player.r * (1 - sq*0.35);
      ctx.fillStyle = '#57c977';
      ctx.beginPath(); ctx.ellipse(player.x, player.y - ry, rx, ry, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(player.x-14, player.y-ry-6, 11, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x+14, player.y-ry-6, 11, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a2b1f';
      ctx.beginPath(); ctx.arc(player.x-11, player.y-ry-5, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x+17, player.y-ry-5, 5, 0, Math.PI*2); ctx.fill();
    }
  }

  function draw() {
    drawBackground();
    drawGoal();
    for (const o of obstacles) drawObstacle(o);
    drawPlayer();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(now) {
    if (state !== 'playing') return;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    if (state === 'playing') { draw(); requestAnimationFrame(loop); }
  }

  const frame = document.getElementById('frame');
  frame.addEventListener('pointerdown', (e)=>{ e.preventDefault(); jump(); });
  window.addEventListener('keydown', (e)=>{
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  });
  document.getElementById('startBtn').addEventListener('click', (e)=>{ e.stopPropagation(); start(); });
  document.getElementById('retryBtn').addEventListener('click', (e)=>{ e.stopPropagation(); start(); });

  reset(); draw();
})();
</script>
</body>
</html>
