// レスポンシブ判定（768px以下はスマホ扱い）
const useIsMobile = () => {
  const [isMobile, setIsMobile] = React.useState(typeof window !== 'undefined' && window.innerWidth <= 768);
  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return isMobile;
};

// メルマガ本文に冠辞・脳手郎画像・結語を自動付与する
function wrapWithNoteroTemplate(bodyText) {
  // 既にテンプレート（冒頭挨拶か末尾署名）が含まれてたら二重にしない
  const alreadyWrapped =
    bodyText.includes('様子のおかしなウチの社長') ||
    bodyText.includes('広報担当の脳手郎です') ||

// subjects がどんな形式で保存されていても配列に正規化する
function normalizeSubjects(subjects) {
  if (Array.isArray(subjects)) return subjects;
  if (!subjects) return [];
  if (typeof subjects === 'string') {
    try { const p = JSON.parse(subjects); return Array.isArray(p) ? p : Object.values(p); } catch(_) { return [subjects]; }
  }
  if (typeof subjects === 'object') return Object.values(subjects);
  return [];
}

function HistoryView({ supabaseUrl, supabaseKey, isMobile, COLOR }) {
  const [list, setList] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [topics, setTopics] = React.useState({});

  React.useEffect(() => {
    const load = async () => {
      setLoading(true);
      try {
        // 送信済みバリエーションを取得
        const res = await fetch(
          `${supabaseUrl}/rest/v1/magazine_variations?select=*&or=(scheduled_sent.eq.true,selected.eq.true)&order=sent_at.desc.nullslast,scheduled_at.desc.nullslast`,
          { headers: { apikey: supabaseKey, Authorization: `Bearer ${supabaseKey}` } }
        );
        const data = await res.json();
        setList(data || []);

        // ネタ名を取得
        const topicIds = [...new Set((data || []).map(v => v.topic_id).filter(Boolean))];
        if (topicIds.length > 0) {
          const tRes = await fetch(
            `${supabaseUrl}/rest/v1/magazine_topics?id=in.(${topicIds.join(',')})&select=id,title`,
            { headers: { apikey: supabaseKey, Authorization: `Bearer ${supabaseKey}` } }
          );
          const tData = await tRes.json();
          const map = {};
          (tData || []).forEach(t => { map[t.id] = t.title; });
          setTopics(map);
        }
      } catch(e) { console.error(e); }
      setLoading(false);
    };
    load();
  }, []);

  const formatDate = (str) => {
    if (!str) return '-';
    const d = new Date(str);
    return d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  };

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: isMobile ? '12px' : '24px', background: '#F8FAFC' }}>
      <h1 style={{ fontSize: 20, fontWeight: 900, color: COLOR.text, marginBottom: 18 }}>📋 配信履歴</h1>
      {loading ? (
        <div style={{ textAlign: 'center', padding: 40, color: COLOR.textFaint }}>読み込み中...</div>
      ) : list.length === 0 ? (
        <div style={{ textAlign: 'center', padding: 40, color: COLOR.textFaint }}>配信履歴がありません</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {list.map(v => (
            <div key={v.id} style={{ background: '#fff', borderRadius: 12, border: `1px solid ${COLOR.border}`, padding: '14px 18px' }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10, marginBottom: 6 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 800, color: COLOR.text, marginBottom: 3 }}>
                    {topics[v.topic_id] || 'ネタ名不明'} - バリエーション{v.variation_no}
                  </div>
                  <div style={{ fontSize: 12, color: COLOR.textSub }}>
                    {v.edited_subjects && Object.keys(v.edited_subjects).length > 0
                      ? Object.values(v.edited_subjects)[0]
                      : normalizeSubjects(v.subjects)[0] || '件名なし'}
                  </div>
                </div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  {v.sent_at ? (
                    <span style={{ fontSize: 11, background: '#DCFCE7', color: '#166534', borderRadius: 6, padding: '3px 8px', fontWeight: 700 }}>✅ 送信済み</span>
                  ) : (
                    <span style={{ fontSize: 11, background: '#FEF3C7', color: '#92400E', borderRadius: 6, padding: '3px 8px', fontWeight: 700 }}>📅 送信記録なし</span>
                  )}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
                <div style={{ fontSize: 11, color: COLOR.textFaint }}>
                  📅 予約：{formatDate(v.scheduled_at)}
                </div>
                {v.sent_at && (
                  <div style={{ fontSize: 11, color: COLOR.textFaint }}>
                    ✉️ 送信：{formatDate(v.sent_at)}
                  </div>
                )}
                {v.sent_count > 0 && (
                  <div style={{ fontSize: 11, color: COLOR.textFaint }}>
                    👥 {v.sent_count}件送信
                  </div>
                )}
                {v.categories && v.categories.length > 0 && (
                  <div style={{ fontSize: 11, color: COLOR.textFaint }}>
                    🏷️ {v.categories.join('・')}
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TopicManager({ supabaseUrl, supabaseKey, showToast }) {
  const isMobile = useIsMobile();
  const [mobileView, setMobileView] = React.useState('list'); // 'list' | 'detail'
  const [topics, setTopics] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [showAdd, setShowAdd] = React.useState(false);
  const [newTitle, setNewTitle] = React.useState('');
  const [newUrl, setNewUrl] = React.useState('');
  const [newText, setNewText] = React.useState('');
  const [newDirect, setNewDirect] = React.useState(false); // そのまま使うモード
  const [newDirectSubject, setNewDirectSubject] = React.useState(''); // そのまま使う時の件名
  const [newDirectBody, setNewDirectBody] = React.useState(''); // 直接入力本文
  const [expanding, setExpanding] = React.useState({});
  const [selectedTopic, setSelectedTopic] = React.useState(null);
  const [variations, setVariations] = React.useState([]);
  const [loadingVars, setLoadingVars] = React.useState(false);

  React.useEffect(() => { loadTopics(); }, []);

  const loadTopics = async () => {
    setLoading(true);
    try {
      const res = await fetch(`${supabaseUrl}/rest/v1/magazine_topics?select=*&order=created_at.desc`, {
        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
      });
      const data = await res.json();
      if (Array.isArray(data)) setTopics(data);
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  const loadVariations = async (topicId) => {
    setLoadingVars(true);
    setVariations([]);
    try {
      const res = await fetch(`${supabaseUrl}/rest/v1/magazine_variations?topic_id=eq.${topicId}&order=variation_no`, {
        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
      });
      const data = await res.json();
      if (Array.isArray(data)) setVariations(data);
    } catch(e) { console.error(e); }
    setLoadingVars(false);
  };

  const [fetchingUrl, setFetchingUrl] = React.useState(false);
  const [autoflowing, setAutoflowing] = React.useState(false);
  const [autoflowLog, setAutoflowLog] = React.useState([]);

  const runYoutubeAutoflow = async () => {
    if (!newUrl) { showToast('YouTubeのURLを入力してください', 'error'); return; }
    if (!newUrl.includes('youtube.com') && !newUrl.includes('youtu.be')) {
      showToast('YouTubeのURLを入力してください', 'error'); return;
    }
    setAutoflowing(true);
    setAutoflowLog(['🚀 パイプライン開始...']);
    try {
      showToast('⏳ YouTube全自動パイプライン実行中...（2〜5分かかります）');
      const res = await fetch('/api/youtube-to-articles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ youtubeUrl: newUrl, recipientCategory: '直クライアント' }),
      });
      let data;
      try { data = await res.json(); } catch(_) {
        throw new Error(`サーバーエラー (HTTP ${res.status}) — Vercelのログを確認してください`);
      }
      if (!res.ok || data.error) {
        const msg = data?.error || `HTTP ${res.status}`;
        showToast('エラー: ' + msg, 'error');
        const serverLog = Array.isArray(data?.log) ? data.log : [];
        setAutoflowLog([...serverLog, '❌ ' + msg]);
      } else {
        const count = (data.articles || data.results || []).length;
        showToast(`✅ 完了！${count}件の記事をWixブログ＆Supabaseに保存しました🎉`);
        const serverLog = Array.isArray(data?.log) ? data.log : [];
        setAutoflowLog([
          ...serverLog,
          `✅ 完了！ ${count}件の記事を生成`,
          ...(data.articles || data.results || []).map((r, i) => `  ${i+1}. ${r.blog_title || r.blogTitle || r.subject || 'article'}`),
        ]);
        const topicRes = await fetch(`${supabaseUrl}/rest/v1/magazine_topics?order=created_at.desc&limit=5`, {
          headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
        });
        const topicData = await topicRes.json();
        if (Array.isArray(topicData)) setTopics(topicData);
        setNewUrl(''); setNewTitle(''); setNewText('');
        setShowAdd(false);
      }
    } catch(e) {
      showToast('全自動パイプラインに失敗しました', 'error');
      setAutoflowLog(prev => [...prev, '❌ 通信エラー: ' + e.message]);
    }
    setAutoflowing(false);
  };

  const fetchYouTube = async (url) => {
    if (!url) return;
    setFetchingUrl(true);

    const isYoutube = url.includes('youtube.com') || url.includes('youtu.be');
    const apiEndpoint = isYoutube ? '/api/fetch-youtube' : '/api/fetch-url';
    showToast(isYoutube ? 'YouTube字幕を取得中...⏳' : 'ページを取得中...⏳');

    try {
      const res = await fetch(apiEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();
      if (data.error) {
        showToast('取得に失敗しました: ' + data.error, 'error');
      } else {
        if (data.title && !newTitle) setNewTitle(data.title);
        if (data.content) setNewText(data.content);
        showToast(isYoutube
          ? (data.hasTranscript ? '字幕取得成功！✅' : 'タイトル・説明文を取得しました')
          : (data.hasContent ? '記事を取得しました！✅' : 'タイトルのみ取得しました')
        );
      }
    } catch(e) {
      showToast('URL取得に失敗しました', 'error');
    }
    setFetchingUrl(false);
  };

  const addTopic = async () => {
    if (!newTitle.trim() && !newUrl.trim()) { showToast('URLかタイトルを入力してください', 'error'); return; }
    if (!newTitle.trim() && newUrl.trim()) setNewTitle(newUrl);
    try {
      const res = await fetch(`${supabaseUrl}/rest/v1/magazine_topics`, {
        method: 'POST',
        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({ title: newTitle, source_url: newUrl || null, source_text: newText || null, status: newDirect ? 'expanded' : 'draft' }),
      });
      const data = await res.json();
      if (data && data[0]) {
        setTopics(prev => [data[0], ...prev]);
        // 直接使うモードの場合、バリエーション1件を即作成
        if (newDirect && newDirectBody.trim()) {
          await fetch(`${supabaseUrl}/rest/v1/magazine_variations`, {
            method: 'POST',
            headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic_id: data[0].id, variation_no: 1, body_mail: newDirectBody, subjects: newDirectSubject.trim() ? [newDirectSubject.trim()] : [], summary: '直接入力', categories: [], selected: false }),
          });
          setSelectedTopic(data[0]);
          loadVariations(data[0].id);
          if (isMobile) setMobileView('detail');
        }
        setNewTitle(''); setNewUrl(''); setNewText(''); setNewDirect(false); setNewDirectBody(''); setNewDirectSubject('');
        setShowAdd(false);
        showToast(newDirect ? 'ネタを登録しました！（そのまま使う）' : 'ネタを登録しました！');
      }
    } catch(e) { showToast('登録失敗しました', 'error'); }
  };

  const expandTopic = async (topic) => {
    setExpanding(prev => ({ ...prev, [topic.id]: true }));
    try {
      const res = await fetch('/api/expand-topic', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: topic.title, source_url: topic.source_url, source_text: topic.source_text }),
      });
      const data = await res.json();
      if (!data.variations) { showToast('生成失敗しました', 'error'); return; }

      for (const v of data.variations) {
        await fetch(`${supabaseUrl}/rest/v1/magazine_variations`, {
          method: 'POST',
          headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic_id: topic.id, variation_no: v.variation_no, body_mail: v.body_mail || '', body_insta: v.body_insta, subjects: v.subjects, summary: v.summary, categories: [], selected: false }),
        });
      }

      await fetch(`${supabaseUrl}/rest/v1/magazine_topics?id=eq.${topic.id}`, {
        method: 'PATCH',
        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'expanded' }),
      });

      setTopics(prev => prev.map(t => t.id === topic.id ? { ...t, status: 'expanded' } : t));
      showToast('4展開完了！バリエーションを確認してください🎉');
      setSelectedTopic(topic);
      await loadVariations(topic.id);
    } catch(e) { showToast('展開失敗しました', 'error'); console.error(e); }
    setExpanding(prev => ({ ...prev, [topic.id]: false }));
  };

  const [generatingImages, setGeneratingImages] = React.useState(false);
  const [generatingImageVar, setGeneratingImageVar] = React.useState({});
  const [imageGenLog, setImageGenLog] = React.useState([]);

  const generateImages = async (topicId, variationId) => {
    if (variationId) {
      setGeneratingImageVar(prev => ({ ...prev, [variationId]: true }));
    } else {
      setGeneratingImages(true);
    }
    setImageGenLog(['🎨 画像生成を開始します...']);
    try {
      const body = variationId ? { topicId, variationId } : { topicId };
      const res = await fetch('/api/generate-images', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.log) setImageGenLog(data.log);
      if (!res.ok || !data.success) {
        showToast(data.error || '画像生成失敗', 'error');
        return;
      }
      setVariations(prev => prev.map(v => {
        const r = (data.results || []).find(x => x.variationId === v.id);
        if (!r?.imageUrls?.length) return v;
        return { ...v, blog_image_url: r.imageUrls[0], blog_image_urls: r.imageUrls };
      }));
      showToast('🎨 画像生成完了！');
    } catch(e) {
      showToast('画像生成エラー: ' + e.message, 'error');
    } finally {
      if (variationId) {
        setGeneratingImageVar(prev => ({ ...prev, [variationId]: false }));
      } else {
        setGeneratingImages(false);
      }
    }
  };

  const [editingVar, setEditingVar] = React.useState({});
  const [mediaUploadingVar, setMediaUploadingVar] = React.useState({}); // { varId: true/false }
  const [showVideoLinkModal, setShowVideoLinkModal] = React.useState(null); // varId or null
  const [videoLinkInput, setVideoLinkInput] = React.useState('');
  const [bodyImageSizesVar, setBodyImageSizesVar] = React.useState({}); // { varId: totalBytes }
  const MAX_BODY_IMAGE_BYTES = 10 * 1024 * 1024; // 10MB
  const textareaRefs = React.useRef({}); // { varId: DOM要素 }
  const cursorPosRefs = React.useRef({}); // { varId: position }

  // ===== 配信許可→実送信 =====
  const [sendingVar, setSendingVar] = React.useState({}); // { varId: true/false }
  const [collapsedVars, setCollapsedVars] = React.useState({});
  const [historyList, setHistoryList] = React.useState([]);
  const [historyLoading, setHistoryLoading] = React.useState(false);
  const [sendProgressVar, setSendProgressVar] = React.useState({}); // { varId: {done, total} }
  const [sendResultVar, setSendResultVar] = React.useState(null); // { varId, success, failed }
  const [showApproveConfirm, setShowApproveConfirm] = React.useState(null); // variation object or null
  const CAT_LABEL_TO_VALUE = {
    '代理店': '代理店', '直クライアント': '直クライアント', 'メディア': 'メディア',
    '見込み客': '見込み客', '外注・業者': '外注・業者', '補助金候補': '補助金候補',
  };

  const fetchMembersForCategories = async (categories) => {
    if (!categories || categories.length === 0) return [];
    const orFilter = categories.map(c => `category.eq.${encodeURIComponent(c)}`).join(',');
    const res = await fetch(`${supabaseUrl}/rest/v1/mailing_list?select=name,email,category&send_yn=eq.Y&or=(${orFilter})`, {
      headers: { apikey: supabaseKey, Authorization: `Bearer ${supabaseKey}` },
    });
    const data = await res.json();
    return Array.isArray(data) ? data.filter(m => m.email) : [];
  };

  const handleSendVariation = async (v) => {
    const members = await fetchMembersForCategories(v.categories || []);
    if (members.length === 0) { showToast('送信対象がいません（カテゴリ未選択 or 送付先なし）', 'error'); return; }

    const subjectIndices = (v.selected_subjects && v.selected_subjects.length > 0) ? v.selected_subjects : [0];
    const baseSubject = v.edited_subjects?.[subjectIndices[0]] ?? normalizeSubjects(v.subjects)[subjectIndices[0]] ?? 'お知らせ';
    const subject = baseSubject;

    setSendingVar(prev => ({ ...prev, [v.id]: true }));
    setSendProgressVar(prev => ({ ...prev, [v.id]: { done: 0, total: members.length } }));

    let successCount = 0;
    let failedList = [];

    for (let i = 0; i < members.length; i++) {
      const m = members[i];
      const personalBody = wrapWithNoteroTemplate(v.body_mail || '').replace(/{{氏名}}/g, m.name || 'ご担当者');
      setSendProgressVar(prev => ({ ...prev, [v.id]: { done: i, total: members.length } }));
      try {
        const res = await fetch('/api/send-mail', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: m.email, subject, body: personalBody }),
        });
        if (res.ok) successCount++;
        else failedList.push(m.name || m.email);
      } catch (e) {
        failedList.push(m.name || m.email);
      }
      await new Promise(r => setTimeout(r, 300));
    }

    setSendingVar(prev => ({ ...prev, [v.id]: false }));
    setSendProgressVar(prev => ({ ...prev, [v.id]: { done: members.length, total: members.length } }));
    setSendResultVar({ varId: v.id, success: successCount, failed: failedList });

    if (successCount > 0) {
      await updateVariation(v.id, 'selected', true);
      setVariations(prev => prev.map(va => va.id === v.id ? { ...va, selected: true } : va));

      // ブログにも同時投稿
      if (v.post_blog) {
        try {
          const subjectIndices2 = (v.selected_subjects && v.selected_subjects.length > 0) ? v.selected_subjects : [0];
          const blogTitle = v.edited_subjects?.[subjectIndices2[0]] ?? normalizeSubjects(v.subjects)[subjectIndices2[0]] ?? 'お知らせ';
          const blogBody = v.body_mail || '';
          const blogRes = await fetch('/api/post-blog', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: blogTitle, body: blogBody }),
          });
          if (blogRes.ok) {
            showToast(`📝 ブログ投稿も完了！`);
          } else {
            showToast('ブログ投稿に失敗しました', 'error');
          }
        } catch (e) {
          showToast('ブログ投稿エラー: ' + e.message, 'error');
        }
      }
    }
    showToast(`送信完了！${successCount}件成功 / ${failedList.length}件失敗`);
  };

  // テスト送信：1116maehira@gmail.com に1通だけ送る（件名に[テスト]付き・selectedは変えない）
  const TEST_EMAIL = '1116maehira@gmail.com';
  const handleTestSendVariation = async (v) => {
    const subjectIndices = (v.selected_subjects && v.selected_subjects.length > 0) ? v.selected_subjects : [0];
    const baseSubject = v.edited_subjects?.[subjectIndices[0]] ?? normalizeSubjects(v.subjects)[subjectIndices[0]] ?? 'お知らせ';
    const subject = '[テスト] ' + baseSubject;
    const personalBody = wrapWithNoteroTemplate(v.body_mail || '').replace(/{{氏名}}/g, '前平雄一朗');

    setSendingVar(prev => ({ ...prev, [v.id]: true }));
    setSendProgressVar(prev => ({ ...prev, [v.id]: { done: 0, total: 1 } }));

    try {
      const res = await fetch('/api/send-mail', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: TEST_EMAIL, subject, body: personalBody }),
      });
      setSendingVar(prev => ({ ...prev, [v.id]: false }));
      setSendProgressVar(prev => ({ ...prev, [v.id]: { done: 1, total: 1 } }));
      if (res.ok) {
        showToast(`🧪 テスト送信完了！${TEST_EMAIL} に送りました`);
      } else {
        showToast('テスト送信に失敗しました', 'error');
      }
    } catch (e) {
      setSendingVar(prev => ({ ...prev, [v.id]: false }));
      showToast('テスト送信に失敗しました', 'error');
    }
  };

  const toggleSelected = async (varId, current) => {
    try {
      await fetch(`${supabaseUrl}/rest/v1/magazine_variations?id=eq.${varId}`, {
        method: 'PATCH',
        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ selected: !current }),
      });
      setVariations(prev => prev.map(v => v.id === varId ? { ...v, selected: !current } : v));
      showToast(!current ? '今月使うバリエーションに追加！' : '選択を解除しました');
    } catch(e) { showToast('更新失敗', 'error'); }
  };

  const updateVariation = async (varId, field, value) => {
    try {
      await fetch(`${supabaseUrl}/rest/v1/magazine_variations?id=eq.${varId}`, {
        method: 'PATCH',
        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: value }),
      });
      setVariations(prev => prev.map(v => v.id === varId ? { ...v, [field]: value } : v));
    } catch(e) { showToast('保存失敗', 'error'); }
  };

  const updateCategories = async (varId, cat, checked) => {
    const v = variations.find(v => v.id === varId);
    const cats = v.categories || [];
    const newCats = checked ? [...cats, cat] : cats.filter(c => c !== cat);
    await updateVariation(varId, 'categories', newCats);
  };

  // テキストをカーソル位置（なければ末尾）に挿入する共通ヘルパー
  const insertAtCursorVar = (varId, insertText) => {
    setVariations(prev => prev.map(va => {
      if (va.id !== varId) return va;
      const current = va.body_mail || '';
      const pos = cursorPosRefs.current[varId];
      const validPos = (typeof pos === 'number' && pos >= 0 && pos <= current.length) ? pos : current.length;
      const before = current.slice(0, validPos);
      const after = current.slice(validPos);
      const needsLeadingBreak = before.length > 0 && !before.endsWith('\n\n');
      const needsTrailingBreak = after.length > 0 && !after.startsWith('\n\n');
      const newText = before + (needsLeadingBreak ? '\n\n' : '') + insertText + (needsTrailingBreak ? '\n\n' : '') + after;
      cursorPosRefs.current[varId] = before.length + (needsLeadingBreak ? 2 : 0) + insertText.length + (needsTrailingBreak ? 2 : 0);
      updateVariation(varId, 'body_mail', newText);
      return { ...va, body_mail: newText };
    }));
  };

  const handleImageUploadForVar = async (varId, file) => {
    if (!file) return;

    const currentTotal = bodyImageSizesVar[varId] || 0;
    if (currentTotal + file.size > MAX_BODY_IMAGE_BYTES) {
      const usedMB = (currentTotal / 1024 / 1024).toFixed(1);
      const fileMB = (file.size / 1024 / 1024).toFixed(1);
      showToast(`⚠️ 画像合計が10MBを超えます（現在${usedMB}MB＋この画像${fileMB}MB）。画像を圧縮するか他の画像を削除してください。`, 'error');
      return;
    }

    setMediaUploadingVar(prev => ({ ...prev, [varId]: true }));
    // 編集モードに切り替えて、挿入結果が見えるようにする
    setEditingVar(prev => ({ ...prev, [varId + '_mail']: true }));

    try {
      const ext = file.name.split('.').pop();
      const fileName = `topic_${varId}_${Date.now()}.${ext}`;
      const res = await fetch(`${supabaseUrl}/storage/v1/object/magazine-media/${fileName}`, {
        method: 'POST',
        headers: {
          apikey: supabaseKey,
          Authorization: `Bearer ${supabaseKey}`,
          'Content-Type': file.type,
        },
        body: file,
      });
      if (res.ok) {
        const publicUrl = `${supabaseUrl}/storage/v1/object/public/magazine-media/${fileName}`;
        insertAtCursorVar(varId, `📷 ${publicUrl}`);
        setBodyImageSizesVar(prev => ({ ...prev, [varId]: (prev[varId] || 0) + file.size }));
        showToast('画像を追加しました！カーソル位置に挿入されています');
      } else {
        showToast('画像のアップロードに失敗しました', 'error');
      }
    } catch (e) {
      showToast('画像のアップロードに失敗しました', 'error');
    }
    setMediaUploadingVar(prev => ({ ...prev, [varId]: false }));
  };

  const handleAddVideoLinkVar = () => {
    if (!videoLinkInput.trim() || !showVideoLinkModal) return;
    setEditingVar(prev => ({ ...prev, [showVideoLinkModal + '_mail']: true }));
    insertAtCursorVar(showVideoLinkModal, `🎬 ${videoLinkInput.trim()}`);
    setVideoLinkInput('');
    setShowVideoLinkModal(null);
    showToast('動画リンクを追加しました！カーソル位置に挿入されています');
  };

  // おすすめ配信時刻：翌営業日の10:00（土日なら月曜10:00に繰り越し）
  const getRecommendedDateTime = () => {
    const now = new Date();
    const d = new Date(now);
    d.setDate(d.getDate() + 1);
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    d.setHours(10, 0, 0, 0);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  const handleApprove = async (v) => {
    let scheduled = v.scheduled_at;
    if (!scheduled) {
      // DBには保存せず、モーダル表示用に一時的にセットするだけ
      scheduled = getRecommendedDateTime();
    }
    setShowApproveConfirm({ ...v, scheduled_at: scheduled });
  };

  // 送信前（未送信）の配信予定を取り消す。一度送信済み（selected=true）のものは取り消し不可。
  const handleCancelApprove = async (v) => {
    await updateVariation(v.id, 'scheduled_at', null);
    setVariations(prev => prev.map(va => va.id === v.id ? { ...va, scheduled_at: null } : va));
    showToast('配信予定を取り消しました。文章を見直してから再度許可してください');
  };

  const statusLabel = (s) => {
    if (s === 'expanded') return { label: '展開済み', bg: '#D1FAE5', color: '#065F46' };
    if (s === 'used') return { label: '使用済み', bg: '#E0E7FF', color: '#3730A3' };
    return { label: '下書き', bg: '#F3F4F6', color: '#6B7280' };
  };

  return (
    <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
      {/* ネタ一覧（PC：常時表示、スマホ：list表示時のみ） */}
      {(!isMobile || mobileView === 'list') && (
      <div style={{ width: isMobile ? '100%' : 300, background: '#fff', borderRight: isMobile ? 'none' : '1px solid #E2E8F0', display: 'flex', flexDirection: 'column', flexShrink: 0, flex: isMobile ? 1 : 'unset' }}>
        <div style={{ padding: '14px 16px', borderBottom: '1px solid #E2E8F0', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div>
            <h2 style={{ fontSize: 15, fontWeight: 700, color: '#0F172A' }}>💡 ネタ管理</h2>
            <div style={{ fontSize: 11, color: '#94A3B8', marginTop: 2 }}>{topics.length}件登録済み</div>
          </div>
          <button onClick={() => setShowAdd(!showAdd)} style={{ padding: '6px 12px', border: 'none', borderRadius: 7, background: '#6366F1', color: '#fff', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>＋ 追加</button>
        </div>

        {showAdd && (
          <div style={{ padding: 12, borderBottom: '1px solid #E2E8F0', background: '#F8FAFC' }}>
            <input placeholder="ネタタイトル（URLから自動取得も可）" value={newTitle} onChange={e => setNewTitle(e.target.value)}
              style={{ width: '100%', padding: '7px 10px', border: '1px solid #E2E8F0', borderRadius: 6, fontSize: 12, marginBottom: 6, boxSizing: 'border-box' }} />
            <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
              <input placeholder="元URL（YouTube/記事など、任意）" value={newUrl} onChange={e => setNewUrl(e.target.value)}
                style={{ flex: 1, padding: '7px 10px', border: '1px solid #E2E8F0', borderRadius: 6, fontSize: 12, boxSizing: 'border-box' }} />
              <button onClick={() => fetchYouTube(newUrl)} disabled={fetchingUrl || !newUrl}
                style={{ padding: '7px 10px', border: 'none', borderRadius: 6, background: fetchingUrl ? '#E2E8F0' : '#6366F1', color: fetchingUrl ? '#94A3B8' : '#fff', fontSize: 11, fontWeight: 700, cursor: fetchingUrl ? 'wait' : 'pointer', whiteSpace: 'nowrap' }}>
                {fetchingUrl ? '取得中...' : '▶ 取得'}
              </button>
            </div>
            {(newUrl.includes('youtube.com') || newUrl.includes('youtu.be')) && (
              <div style={{ marginBottom: 8 }}>
                <button onClick={runYoutubeAutoflow} disabled={autoflowing || !newUrl}
                  style={{ width: '100%', padding: '10px', border: 'none', borderRadius: 8, background: autoflowing ? '#E2E8F0' : 'linear-gradient(135deg, #FF4500, #FF6B35)', color: autoflowing ? '#94A3B8' : '#fff', fontSize: 13, fontWeight: 800, cursor: autoflowing ? 'wait' : 'pointer', letterSpacing: '0.02em' }}>
                  {autoflowing ? '⏳ 全自動処理中...（2〜5分）' : '🎬 YouTube → 記事・画像・Wix・DB 全自動'}
                </button>
                {autoflowLog.length > 0 && (
                  <div style={{ marginTop: 6, padding: '8px 10px', background: '#F1F5F9', borderRadius: 6, fontSize: 11, color: '#475569', lineHeight: 1.7 }}>
                    {autoflowLog.map((line, i) => <div key={i}>{line}</div>)}
                  </div>
                )}
              </div>
            )}
            {/* 4つ展開 or そのまま使う の切り替え */}
            <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
              <button onClick={() => setNewDirect(false)}
                style={{ flex: 1, padding: '7px', border: `1.5px solid ${!newDirect ? '#6366F1' : '#E2E8F0'}`, borderRadius: 6, background: !newDirect ? '#EEF2FF' : '#fff', color: !newDirect ? '#6366F1' : '#94A3B8', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
                🔀 4つに展開する
              </button>
              <button onClick={() => setNewDirect(true)}
                style={{ flex: 1, padding: '7px', border: `1.5px solid ${newDirect ? COLOR.primary : '#E2E8F0'}`, borderRadius: 6, background: newDirect ? '#FFF4ED' : '#fff', color: newDirect ? COLOR.primary : '#94A3B8', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
                📝 そのまま使う
              </button>
            </div>
            {!newDirect ? (
              <textarea placeholder="ネタ内容を手入力（任意）" value={newText} onChange={e => setNewText(e.target.value)}
                style={{ width: '100%', padding: '7px 10px', border: '1px solid #E2E8F0', borderRadius: 6, fontSize: 12, minHeight: 70, resize: 'vertical', boxSizing: 'border-box', fontFamily: 'inherit' }} />
            ) : (
              <>
                <input
                  placeholder="📌 件名を入力してください"
                  value={newDirectSubject}
                  onChange={e => setNewDirectSubject(e.target.value)}
                  style={{ width: '100%', padding: '7px 10px', border: `1.5px solid ${COLOR.primary}`, borderRadius: 6, fontSize: 12, marginBottom: 6, boxSizing: 'border-box', fontFamily: 'inherit' }}
                />
                <textarea placeholder="メール本文をそのまま貼り付けてください" value={newDirectBody} onChange={e => setNewDirectBody(e.target.value)}
                  style={{ width: '100%', padding: '7px 10px', border: `1.5px solid ${COLOR.primary}`, borderRadius: 6, fontSize: 12, minHeight: 140, resize: 'vertical', boxSizing: 'border-box', fontFamily: 'inherit' }} />
              </>
            )}
            <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
              <button onClick={addTopic} style={{ flex: 1, padding: '7px', border: 'none', borderRadius: 6, background: '#6366F1', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>登録</button>
              <button onClick={() => setShowAdd(false)} style={{ flex: 1, padding: '7px', border: '1px solid #E2E8F0', borderRadius: 6, background: '#fff', fontSize: 12, cursor: 'pointer' }}>NG</button>
            </div>
          </div>
        )}

        <div style={{ flex: 1, overflow: 'auto', padding: '8px' }}>
          {loading ? (
            <div style={{ textAlign: 'center', padding: 30, color: '#94A3B8', fontSize: 13 }}>読み込み中...</div>
          ) : topics.length === 0 ? (
            <div style={{ textAlign: 'center', padding: 30, color: '#94A3B8' }}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>💡</div>
              <div style={{ fontSize: 13 }}>ネタを追加してください</div>
            </div>
          ) : topics.map(t => {
            const st = statusLabel(t.status);
            const isExpanding = expanding[t.id];
            return (
              <div key={t.id} style={{ padding: '11px 12px', borderRadius: 9, marginBottom: 5, background: selectedTopic && selectedTopic.id === t.id ? '#EEF2FF' : t.status === 'expanded' ? '#F1F5F9' : '#F8FAFC', border: selectedTopic && selectedTopic.id === t.id ? '1.5px solid #6366F1' : '1.5px solid transparent', opacity: t.status === 'expanded' ? 0.7 : 1 }}>
                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 6, marginBottom: 6 }}>
                  <span onClick={() => { setSelectedTopic(t); loadVariations(t.id); if (isMobile) setMobileView('detail'); }} style={{ fontSize: 13, fontWeight: 600, color: '#1E293B', lineHeight: 1.4, flex: 1, cursor: 'pointer' }}>{t.title}</span>

                          style={{ padding: '9px 12px', border: `1px solid ${COLOR.border}`, borderRadius: 8, fontSize: 14, color: COLOR.text, background: COLOR.white }} />
                      </div>

                      {/* SNS連携チェックボックス（ボタンのみ・連携処理は今後実装） */}
                      <div style={{ marginBottom: 16, display: 'flex', gap: 16, flexWrap: 'wrap' }}>
                        <label style={{ display: 'flex', alignItems: 'center', gap: 7, cursor: 'pointer', fontSize: 13, fontWeight: 600, color: COLOR.textSub }}>

                          📸 Instagramにも同時投稿
                        </label>
                        <label style={{ display: 'flex', alignItems: 'center', gap: 7, cursor: 'pointer', fontSize: 13, fontWeight: 600, color: COLOR.textSub }}>
                          <input type="checkbox" checked={!!v.post_blog} style={{ width: 16, height: 16, accentColor: COLOR.secondary }}
                            onChange={e => { setVariations(prev => prev.map(va => va.id === v.id ? { ...va, post_blog: e.target.checked } : va)); updateVariation(v.id, 'post_blog', e.target.checked); }} />
                          📝 ブログにも同時投稿
                        </label>
                      </div>

                      {/* 配信許可ボタン＋取り消しボタン */}
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                        <button onClick={() => handleApprove(v)} disabled={sendingVar[v.id]}
                          style={{ width: '100%', padding: isMobile ? '16px' : '14px', border: 'none', borderRadius: 12, background: sendingVar[v.id] ? '#D4D4D8' : `linear-gradient(135deg, ${COLOR.primary}, ${COLOR.secondary})`, color: '#fff', fontSize: isMobile ? 16 : 15, fontWeight: 900, cursor: sendingVar[v.id] ? 'wait' : 'pointer', letterSpacing: 0.5 }}>
                          {sendingVar[v.id]
                            ? `⏳ 送信中... ${sendProgressVar[v.id]?.done || 0}/${sendProgressVar[v.id]?.total || 0}`
                            : v.selected
                              ? '✅ 配信済み（再送信する）'
                              : v.scheduled_at ? `🚀 配信を許可する（${new Date(v.scheduled_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}）` : '🚀 配信を許可する'}
                        </button>
                        {v.scheduled_at && !v.selected && !sendingVar[v.id] && (
                          <button onClick={() => handleCancelApprove(v)}
                            style={{ width: '100%', padding: '12px', border: `1.5px solid ${COLOR.border}`, borderRadius: 12, background: COLOR.white, color: COLOR.textSub, fontSize: 14, fontWeight: 800, cursor: 'pointer' }}>
                            ⏸ 配信予定を取り消し
                          </button>
                        )}
                      </div>
                    </div>}
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </div>
      )} {/* スマホ：detail表示の閉じ */}

      {/* ===== 動画リンク追加モーダル ===== */}
      {showVideoLinkModal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ background: COLOR.white, borderRadius: 16, padding: 28, width: 380, boxShadow: '0 20px 60px rgba(0,0,0,0.2)' }}>
            <h2 style={{ fontSize: 16, fontWeight: 900, color: COLOR.text, marginBottom: 14 }}>🎬 動画リンクを追加</h2>
            <input
              value={videoLinkInput}
              onChange={e => setVideoLinkInput(e.target.value)}
              placeholder="https://youtube.com/... または instagram.com/..."
              style={{ width: '100%', padding: '10px 12px', border: `1px solid ${COLOR.border}`, borderRadius: 8, fontSize: 14, color: COLOR.text, marginBottom: 16, boxSizing: 'border-box' }}
              autoFocus
            />
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={() => { setShowVideoLinkModal(null); setVideoLinkInput(''); }}
                style={{ flex: 1, padding: '10px', border: `1px solid ${COLOR.border}`, borderRadius: 9, background: COLOR.white, fontSize: 13, cursor: 'pointer', fontWeight: 700, color: COLOR.textSub }}>キャンセル</button>
              <button onClick={handleAddVideoLinkVar}
                style={{ flex: 2, padding: '10px', border: 'none', borderRadius: 9, background: COLOR.primary, color: '#fff', fontSize: 13, cursor: 'pointer', fontWeight: 800 }}>本文に追加</button>
            </div>
          </div>
        </div>
      )}

      {/* ===== 配信許可確認モーダル ===== */}
      {showApproveConfirm && !sendingVar[showApproveConfirm.id] && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ background: COLOR.white, borderRadius: 16, padding: 28, width: 400, boxShadow: '0 20px 60px rgba(0,0,0,0.2)' }}>
            <div style={{ fontSize: 32, textAlign: 'center', marginBottom: 12 }}>🚀</div>
            <h2 style={{ fontSize: 18, fontWeight: 900, color: COLOR.text, textAlign: 'center', marginBottom: 8 }}>配信を許可しますか？</h2>
            <p style={{ fontSize: 13, color: COLOR.textSub, textAlign: 'center', marginBottom: 20 }}>
              配信予定：<strong style={{ color: COLOR.primary }}>{showApproveConfirm.scheduled_at ? new Date(showApproveConfirm.scheduled_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '未定'}</strong>
            </p>
            <div style={{ background: COLOR.surfaceAlt, borderRadius: 10, padding: '12px 16px', marginBottom: 20, fontSize: 13, color: COLOR.textSub }}>
              送信カテゴリ：{(showApproveConfirm.categories || []).length > 0 ? (showApproveConfirm.categories || []).join('、') : '（未選択）'}
            </div>
            {/* テスト送信ボタン */}
            <button onClick={() => { const v = showApproveConfirm; setShowApproveConfirm(null); handleTestSendVariation(v); }}
              style={{ width: '100%', padding: '11px', border: 'none', borderRadius: 9, background: '#0891B2', color: '#fff', fontSize: 14, cursor: 'pointer', fontWeight: 800, marginBottom: 10 }}>
              🧪 テスト送信（自分だけ：{TEST_EMAIL}）
            </button>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={async () => { const v = showApproveConfirm; setShowApproveConfirm(null); if (!v.selected) { await updateVariation(v.id, 'scheduled_at', null); setVariations(prev => prev.map(va => va.id === v.id ? { ...va, scheduled_at: null } : va)); } }} style={{ flex: 1, padding: '11px', border: `1px solid ${COLOR.border}`, borderRadius: 9, background: COLOR.white, fontSize: 14, cursor: 'pointer', fontWeight: 700, color: COLOR.textSub }}>キャンセル</button>
              <button onClick={async () => { const v = showApproveConfirm; setShowApproveConfirm(null); await updateVariation(v.id, 'scheduled_at', v.scheduled_at); setVariations(prev => prev.map(va => va.id === v.id ? { ...va, scheduled_at: v.scheduled_at } : va)); showToast(`✅ 予約完了！${new Date(v.scheduled_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}に自動送信されます`); }} style={{ flex: 2, padding: '11px', border: 'none', borderRadius: 9, background: COLOR.primary, color: '#fff', fontSize: 14, cursor: 'pointer', fontWeight: 800 }}>🚀 予約確定！</button>
            </div>
          </div>
        </div>
      )}

      {/* ===== 送信結果モーダル ===== */}
      {sendResultVar && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ background: COLOR.white, borderRadius: 16, padding: 32, width: 400, boxShadow: '0 20px 60px rgba(0,0,0,0.2)' }}>
            <div style={{ fontSize: 40, textAlign: 'center', marginBottom: 12 }}>{sendResultVar.failed.length === 0 ? '🎉' : '⚠️'}</div>
            <h2 style={{ fontSize: 18, fontWeight: 900, color: COLOR.text, textAlign: 'center', marginBottom: 16 }}>送信完了！</h2>
            <div style={{ display: 'flex', gap: 12, marginBottom: 20 }}>
              <div style={{ flex: 1, background: '#DCFCE7', borderRadius: 10, padding: '14px', textAlign: 'center' }}>
                <div style={{ fontSize: 28, fontWeight: 900, color: COLOR.success }}>{sendResultVar.success}</div>
                <div style={{ fontSize: 12, color: COLOR.success, fontWeight: 700 }}>✅ 成功</div>
              </div>
              <div style={{ flex: 1, background: sendResultVar.failed.length > 0 ? '#FEE2E2' : COLOR.surfaceAlt, borderRadius: 10, padding: '14px', textAlign: 'center' }}>
                <div style={{ fontSize: 28, fontWeight: 900, color: sendResultVar.failed.length > 0 ? COLOR.danger : COLOR.textFaint }}>{sendResultVar.failed.length}</div>
                <div style={{ fontSize: 12, color: sendResultVar.failed.length > 0 ? COLOR.danger : COLOR.textFaint, fontWeight: 700 }}>❌ 失敗</div>
              </div>
            </div>
            {sendResultVar.failed.length > 0 && (
              <div style={{ background: '#FEF2F2', borderRadius: 8, padding: 12, marginBottom: 16, fontSize: 12, color: COLOR.danger }}>
                <strong>失敗：</strong> {sendResultVar.failed.join('、')}
              </div>
            )}
            <button onClick={() => setSendResultVar(null)} style={{ width: '100%', padding: '12px', border: 'none', borderRadius: 9, background: COLOR.primary, color: '#fff', fontSize: 14, cursor: 'pointer', fontWeight: 800 }}>閉じる</button>
          </div>
        </div>
      )}
    </div>
  );
}

const { useState, useEffect } = React;

function App() {
  const isMobile = useIsMobile();
  const [activeNav, setActiveNav] = useState(2);
  const [selectedCat, setSelectedCat] = useState('agency');
  const [statuses, setStatuses] = useState({});
  const [selectedSubject, setSelectedSubject] = useState({});
  const [bodies, setBodies] = useState({});
  const [preview, setPreview] = useState('pc');
  const [generating, setGenerating] = useState(false);
  const [mailingList, setMailingList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [listSearch, setListSearch] = useState('');
  const [listCatFilter, setListCatFilter] = useState('all');
  const [listYNFilter, setListYNFilter] = useState('all');
  const [listGroupBy, setListGroupBy] = useState('company'); // 'company' | 'none'
  const [listRoleFilter, setListRoleFilter] = useState('all'); // 'all' | 'exec'
  const [collapsedGroups, setCollapsedGroups] = useState({});
  const [deleting, setDeleting] = useState({});
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(null); // member object
  const [saving, setSaving] = useState({});
  const [sending, setSending] = useState(false);
  const [sendProgress, setSendProgress] = useState({ done: 0, total: 0, current: '' });
  const [sendResult, setSendResult] = useState(null); // { success, failed }
  const [showSendModal, setShowSendModal] = useState(false);
  const [testMode, setTestMode] = useState(false);
  const TEST_EMAIL = '1116maehira@gmail.com';
  const [showCardModal, setShowCardModal] = useState(false);
  const [cardImage, setCardImage] = useState(null); // base64
  const [cardImagePreview, setCardImagePreview] = useState(null);
  const [cardOcrLoading, setCardOcrLoading] = useState(false);
  const [cardResult, setCardResult] = useState(null); // {name, company, email, phone, role}
  const [cardSaving, setCardSaving] = useState(false);
  const [mediaUploading, setMediaUploading] = useState(false);
  const [showVideoLinkModal, setShowVideoLinkModal] = useState(false);
  const [videoLinkInput, setVideoLinkInput] = useState('');
  const [bodyImageSizes, setBodyImageSizes] = useState({}); // { catId: totalBytes }
  const MAX_BODY_IMAGE_BYTES = 10 * 1024 * 1024; // 10MB

  const [storageFiles, setStorageFiles] = useState([]);
  const [storageLoading, setStorageLoading] = useState(false);
  const [storageDeleteMB, setStorageDeleteMB] = useState('');
  const [storageDeleting, setStorageDeleting] = useState(false);
  const bodyTextareaRef = React.useRef(null);
  const lastCursorPos = React.useRef({}); // { [catId]: position }


  useEffect(() => { loadMailingList(); }, []);
  useEffect(() => { if (activeNav === 5) loadStorageFiles(); }, [activeNav]);

  const loadMailingList = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/mailing_list?select=*&order=no`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      if (Array.isArray(data)) setMailingList(data);
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  const updateField = async (id, field, value) => {
    setSaving(prev => ({ ...prev, [id]: true }));
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/mailing_list?id=eq.${id}`, {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ [field]: value }),
      });
      setMailingList(prev => prev.map(m => m.id === id ? { ...m, [field]: value } : m));
    } catch(e) { showToast('保存失敗しました', 'error'); }
    setSaving(prev => ({ ...prev, [id]: false }));
  };

  const getCatMembers = (catId) => {
    return mailingList.filter(m => {
      const mapped = CAT_MAP[m.category] || '';
      return mapped === catId && m.send_yn === 'Y' && m.email && !m.unsubscribed;
    });
  };

  const deleteMember = async (id) => {
    setDeleting(prev => ({ ...prev, [id]: true }));
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/mailing_list?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      });
      setMailingList(prev => prev.filter(m => m.id !== id));
      showToast('削除しました');
    } catch(e) { showToast('削除に失敗しました', 'error'); }
    setDeleting(prev => ({ ...prev, [id]: false }));
    setShowDeleteConfirm(null);
  };

  // 役員クラス判定（役職に社長・会長・取締役・専務・常務・理事長・CEOを含む）
  const isExec = (role) => {
    if (!role) return false;
    return /社長|会長|取締役|専務|常務|理事長|CEO|代表|副社長|頭取/.test(role);
  };

  const filteredList = mailingList.filter(m => {
    const matchSearch = !listSearch ||
      (m.name || '').includes(listSearch) ||
      (m.company || '').includes(listSearch) ||
      (m.email || '').includes(listSearch) ||
      (m.role || '').includes(listSearch);
    const matchCat = listCatFilter === 'all' || m.category === listCatFilter;
    const matchYN = listYNFilter === 'all' || m.send_yn === listYNFilter;
    const matchRole = listRoleFilter === 'all' || (listRoleFilter === 'exec' && isExec(m.role));
    return matchSearch && matchCat && matchYN && matchRole;
  });

  // 会社グルーピング
  const groupedList = (() => {
    if (listGroupBy === 'none') return [{ company: null, members: filteredList }];
    const map = {};
    filteredList.forEach(m => {
      const key = m.company || '（会社名なし）';
      if (!map[key]) map[key] = [];
      map[key].push(m);
    });
    return Object.entries(map)
      .sort(([a], [b]) => a.localeCompare(b, 'ja'))
      .map(([company, members]) => ({ company, members }));
  })();

  const cat = CATEGORIES.find(c => c.id === selectedCat);
  const subjects = SAMPLE_SUBJECTS[selectedCat];
  const currentSubject = selectedSubject[selectedCat] ?? 0;
  const currentBody = bodies[selectedCat] ?? SAMPLE_BODY[selectedCat];
  const okCount = Object.values(statuses).filter(s => s === 'ok').length;
  const members = getCatMembers(selectedCat);
  const totalSend = CATEGORIES.reduce((acc, c) => acc + getCatMembers(c.id).length, 0);

  const showToast = (msg, type = 'success') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3000);
  };

  const handleOK = () => {
    setStatuses(prev => ({ ...prev, [selectedCat]: 'ok' }));
    const next = CATEGORIES.find(c => !statuses[c.id] && c.id !== selectedCat);
    if (next) setSelectedCat(next.id);
    showToast(`${cat.label}のメルマガをOKしました！`);
  };

  const handleCardFileSelect = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // data:image/jpeg;base64,xxxx
      const base64 = result.split(',')[1];
      setCardImage(base64);
      setCardImagePreview(result);
      setCardResult(null);
    };
    reader.readAsDataURL(file);
  };

  const handleCardOcr = async () => {
    if (!cardImage) return;
    setCardOcrLoading(true);
    try {
      const mediaType = cardImagePreview.match(/data:(.*?);base64/)?.[1] || 'image/jpeg';
      const res = await fetch('/api/ocr-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: cardImage, mediaType }),
      });
      const data = await res.json();
      if (res.ok && data.success) {
        setCardResult(data.data);
      } else {
        showToast('読み取りに失敗しました：' + (data.error || '不明なエラー'), 'error');
      }
    } catch (e) {
      showToast('読み取りに失敗しました', 'error');
    }
    setCardOcrLoading(false);
  };

  // テキストをカーソル位置（なければ末尾）に挿入する共通ヘルパー
  const insertAtCursor = (catId, insertText) => {
    setBodies(p => {
      const current = p[catId] ?? SAMPLE_BODY[catId];
      const pos = lastCursorPos.current[catId];
      const validPos = (typeof pos === 'number' && pos >= 0 && pos <= current.length) ? pos : current.length;

      // 挿入位置の前後に適切な改行を入れる（既存テキストの改行状況を見て調整）
      const before = current.slice(0, validPos);
      const after = current.slice(validPos);
      const needsLeadingBreak = before.length > 0 && !before.endsWith('\n\n');
      const needsTrailingBreak = after.length > 0 && !after.startsWith('\n\n');
      const newText = before + (needsLeadingBreak ? '\n\n' : '') + insertText + (needsTrailingBreak ? '\n\n' : '') + after;

      // 次回挿入はこの直後にできるよう、カーソル位置を更新
      lastCursorPos.current[catId] = before.length + (needsLeadingBreak ? 2 : 0) + insertText.length + (needsTrailingBreak ? 2 : 0);

      return { ...p, [catId]: newText };
    });
  };

  const handleImageUploadForBody = async (file) => {
    if (!file) return;

    const currentTotal = bodyImageSizes[selectedCat] || 0;
    if (currentTotal + file.size > MAX_BODY_IMAGE_BYTES) {
      const usedMB = (currentTotal / 1024 / 1024).toFixed(1);
      const fileMB = (file.size / 1024 / 1024).toFixed(1);
      showToast(`⚠️ 画像合計が10MBを超えます（現在${usedMB}MB＋この画像${fileMB}MB）。画像を圧縮するか、他の画像を削除してください。`, 'error');
      return;
    }

    setMediaUploading(true);
    try {
      const ext = file.name.split('.').pop();
      const fileName = `${selectedCat}_${Date.now()}.${ext}`;
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/magazine-media/${fileName}`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': file.type,
        },
        body: file,
      });
      if (res.ok) {
        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/magazine-media/${fileName}`;
        insertAtCursor(selectedCat, `📷 ${publicUrl}`);
        setBodyImageSizes(p => ({ ...p, [selectedCat]: (p[selectedCat] || 0) + file.size }));
        showToast('画像を追加しました！カーソル位置に挿入されています');
      } else {
        showToast('画像のアップロードに失敗しました', 'error');
      }
    } catch (e) {
      showToast('画像のアップロードに失敗しました', 'error');
    }
    setMediaUploading(false);
  };

  const loadStorageFiles = async () => {
    setStorageLoading(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/magazine-media`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ limit: 1000, sortBy: { column: 'created_at', order: 'asc' } }),
      });
      const data = await res.json();
      if (res.ok) setStorageFiles(data || []);
    } catch (e) {
      showToast('ストレージ情報の取得に失敗しました', 'error');
    }
    setStorageLoading(false);
  };

  const totalStorageBytes = storageFiles.reduce((acc, f) => acc + (f.metadata?.size || 0), 0);

  const handleDeleteOldestMB = async () => {
    const targetMB = parseFloat(storageDeleteMB);
    if (!targetMB || targetMB <= 0) { showToast('削除するMB数を入力してください', 'error'); return; }
    const targetBytes = targetMB * 1024 * 1024;

    setStorageDeleting(true);
    try {
      // 古い順（作成日時昇順）に並んでいる前提で、累積サイズが目標に達するまでファイルを選定
      let accumulated = 0;
      const toDelete = [];
      for (const f of storageFiles) {
        if (accumulated >= targetBytes) break;
        toDelete.push(f.name);
        accumulated += (f.metadata?.size || 0);
      }

      if (toDelete.length === 0) { showToast('削除対象がありません', 'error'); setStorageDeleting(false); return; }

      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/magazine-media`, {
        method: 'DELETE',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ prefixes: toDelete }),
      });

      if (res.ok) {
        showToast(`✅ 古い画像${toDelete.length}件（約${(accumulated / 1024 / 1024).toFixed(1)}MB）を削除しました`);
        setStorageDeleteMB('');
        loadStorageFiles();
      } else {
        showToast('削除に失敗しました', 'error');
      }
    } catch (e) {
      showToast('削除に失敗しました', 'error');
    }
    setStorageDeleting(false);
  };

  const handleAddVideoLink = () => {
    if (!videoLinkInput.trim()) return;
    insertAtCursor(selectedCat, `🎬 ${videoLinkInput.trim()}`);
    setVideoLinkInput('');
    setShowVideoLinkModal(false);
    showToast('動画リンクを追加しました！カーソル位置に挿入されています');
  };

  const handleCardSave = async () => {
    if (!cardResult) return;
    setCardSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/mailing_list`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal',
        },
        body: JSON.stringify({
          name: cardResult.name || '',
          company: cardResult.company || '',
          email: cardResult.email || '',
          phone: cardResult.phone || '',
          role: cardResult.role || '',
          category: (cardResult.categories && cardResult.categories.length > 0) ? cardResult.categories[0] : '見込み客',
          send_yn: cardResult.send_yn || (cardResult.email ? 'Y' : 'N'),
        }),
      });
      if (res.ok) {
        showToast('名刺を登録しました！🎉');
        setShowCardModal(false);
        setCardImage(null);
        setCardImagePreview(null);
        setCardResult(null);
        loadMailingList();
      } else {
        const errData = await res.json().catch(() => null);
        if (res.status === 409 || errData?.code === '23505') {
          showToast('⚠️ このメールアドレスは既にリストに登録済みです', 'error');
        } else {
          showToast('登録に失敗しました：' + (errData?.message || '不明なエラー'), 'error');
        }
      }
    } catch (e) {
      showToast('登録に失敗しました', 'error');
    }
    setCardSaving(false);
  };

  const handleSendAll = async () => {
    // 全カテゴリの送信対象を収集
    const allTasks = [];
    CATEGORIES.forEach(c => {
      const members = testMode
        ? [{ email: TEST_EMAIL, name: '前平雄一朗（テスト）' }]
        : getCatMembers(c.id);
      const subjectIdx = selectedSubject[c.id] ?? 0;
      const subject = (testMode ? '[テスト] ' : '') + SAMPLE_SUBJECTS[c.id][subjectIdx];
      const body = bodies[c.id] ?? SAMPLE_BODY[c.id];
      members.forEach(m => {
        allTasks.push({ member: m, subject, body, catLabel: c.label });
      });
    });

    if (allTasks.length === 0) { showToast('送信対象がいません', 'error'); return; }

    setSending(true);
    setSendProgress({ done: 0, total: allTasks.length, current: '' });
    setSendResult(null);

    let successCount = 0;
    let failedList = [];

    for (let i = 0; i < allTasks.length; i++) {
      const { member, subject, body } = allTasks[i];
      const personalBody = body.replace(/{{氏名}}/g, member.name || 'ご担当者');
      setSendProgress({ done: i, total: allTasks.length, current: member.name || member.email });

      try {
        const res = await fetch('/api/send-mail', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: member.email, subject, body: personalBody }),
        });
        if (res.ok) { successCount++; }
        else { failedList.push(member.name || member.email); }
      } catch(e) {
        failedList.push(member.name || member.email);
      }
      // 連続送信の間隔（スパム対策）
      await new Promise(r => setTimeout(r, 300));
    }

    setSending(false);
    setSendProgress({ done: allTasks.length, total: allTasks.length, current: '' });
    setSendResult({ success: successCount, failed: failedList });
    showToast(`送信完了！ ${successCount}件成功 / ${failedList.length}件失敗`);
  };

  const handleRegenerate = async () => {
    setGenerating(true);
    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: cat.label, subject: subjects[currentSubject] }),
      });
      const data = await res.json();
      const text = data.text || '';
      if (text) {
        setBodies(prev => ({ ...prev, [selectedCat]: text }));
        showToast('AIで本文を再生成しました！');
      }
    } catch(e) { showToast('生成に失敗しました', 'error'); }
    setGenerating(false);
  };

    if (id === selectedCat && activeNav === 1) return { label: '編集中', bg: '#FEF3C7', color: '#92400E' };

              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>

                            <div style={{ fontSize: 11, color: '#94A3B8', marginBottom: 3 }}>{f.label}</div>
                            <input
                              value={cardResult[f.key] || ''}
                              onChange={e => setCardResult({ ...cardResult, [f.key]: e.target.value })}
                              style={{ width: '100%', padding: '7px 10px', border: '1px solid #E2E8F0', borderRadius: 7, fontSize: 13, color: '#1E293B', background: '#fff' }}
                            />
                          </div>
                        ))}
                      </div>
                      {/* カテゴリ選択 */}
                      <div style={{ marginBottom: 12 }}>
                        <div style={{ fontSize: 11, color: '#94A3B8', marginBottom: 6 }}>カテゴリ（複数選択可）</div>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                          {['代理店','直クライアント','メディア','見込み客','外注・業者','補助金候補'].map(cat => {
                            const checked = (cardResult.categories || []).includes(cat);
                            return (
                              <button key={cat} onClick={() => {
                                const cats = cardResult.categories || [];
                                setCardResult({ ...cardResult, categories: checked ? cats.filter(c => c !== cat) : [...cats, cat] });
                              }} style={{ padding: '5px 10px', border: `1.5px solid ${checked ? COLOR.primary : COLOR.border}`, borderRadius: 8, background: checked ? '#FFF4ED' : COLOR.white, color: checked ? COLOR.primary : COLOR.textSub, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
                                {checked ? '✓ ' : ''}{cat}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                      {/* メルマガ送付Y/N */}
                      <div style={{ marginBottom: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
                        <div style={{ fontSize: 11, color: '#94A3B8' }}>メルマガ送付</div>
                        <button onClick={() => setCardResult({ ...cardResult, send_yn: (cardResult.send_yn || 'Y') === 'Y' ? 'N' : 'Y' })}
                          style={{ padding: '6px 18px', border: 'none', borderRadius: 8, background: (cardResult.send_yn || 'Y') === 'Y' ? '#DCFCE7' : '#FEE2E2', color: (cardResult.send_yn || 'Y') === 'Y' ? '#166534' : '#991B1B', fontSize: 13, fontWeight: 900, cursor: 'pointer' }}>
                          {(cardResult.send_yn || 'Y') === 'Y' ? '✓ 送る（Y）' : '✗ 送らない（N）'}
                        </button>
                      </div>
                      {!cardResult.email && (
                        <div style={{ fontSize: 11, color: '#92400E', background: '#FEF3C7', borderRadius: 8, padding: '8px 12px', marginBottom: 12 }}>
                          ⚠️ メールが読み取れませんでした。手入力するか、送付Nのまま登録できます。
                        </div>
                      )}
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button onClick={() => { setCardImage(null); setCardImagePreview(null); setCardResult(null); }}
                          style={{ flex: 1, padding: '10px', border: '1px solid #E2E8F0', borderRadius: 9, background: '#fff', fontSize: 13, cursor: 'pointer', fontWeight: 600, color: '#64748B' }}>撮り直し</button>
                        <button onClick={handleCardSave} disabled={cardSaving}
                          style={{ flex: 2, padding: '10px', border: 'none', borderRadius: 9, background: '#10B981', color: '#fff', fontSize: 13, cursor: 'pointer', fontWeight: 700, opacity: cardSaving ? 0.6 : 1 }}>
                          {cardSaving ? '⏳ 登録中...' : '✅ リストに登録'}
                        </button>
                      </div>
                    </>
                  )}
                </>
              )}
            </div>
          </div>
        )}

        {/* ===== その他のページ（準備中） ===== */}
        {/* ===== 設定（ストレージ管理） ===== */}
        {activeNav === 5 && (
          <div style={{ flex: 1, overflow: 'auto', padding: isMobile ? 16 : 24 }}>
            <h1 style={{ fontSize: 20, fontWeight: 900, color: COLOR.text, marginBottom: 18 }}>⚙️ 設定</h1>

            <div style={{ background: COLOR.white, borderRadius: 16, border: `1px solid ${COLOR.border}`, padding: 22, maxWidth: 480 }}>
              <div style={{ fontSize: 15, fontWeight: 800, color: COLOR.text, marginBottom: 14 }}>📦 メルマガ画像ストレージ</div>

              {storageLoading ? (
                <div style={{ color: COLOR.textFaint, fontSize: 14, padding: 12 }}>読み込み中...</div>
              ) : (
                <>
                  <div style={{ background: COLOR.surfaceAlt, borderRadius: 12, padding: 18, marginBottom: 18 }}>
                    <div style={{ fontSize: 32, fontWeight: 900, color: COLOR.primary }}>{(totalStorageBytes / 1024 / 1024).toFixed(1)} MB</div>
                    <div style={{ fontSize: 13, color: COLOR.textSub, marginTop: 4, fontWeight: 600 }}>使用中｜ファイル数：{storageFiles.length}件</div>
                  </div>

                  <div style={{ fontSize: 13, color: COLOR.textSub, marginBottom: 10, fontWeight: 600 }}>古い画像から指定MB分を削除します</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <input
                      type="number"
                      value={storageDeleteMB}
                      onChange={e => setStorageDeleteMB(e.target.value)}
                      placeholder="例：50"
                      style={{ flex: 1, padding: '10px 14px', border: `1px solid ${COLOR.border}`, borderRadius: 9, fontSize: 14, color: COLOR.text }}
                    />
                    <span style={{ alignSelf: 'center', fontSize: 14, color: COLOR.textSub, fontWeight: 600 }}>MB分</span>
                    <button onClick={handleDeleteOldestMB} disabled={storageDeleting}
                      style={{ padding: '10px 18px', border: 'none', borderRadius: 9, background: COLOR.danger, color: '#fff', fontSize: 14, fontWeight: 800, cursor: storageDeleting ? 'wait' : 'pointer', opacity: storageDeleting ? 0.6 : 1, whiteSpace: 'nowrap' }}>
                      {storageDeleting ? '⏳ 削除中...' : '🗑️ 削除'}
                    </button>
                  </div>
                  <div style={{ fontSize: 12, color: COLOR.textFaint, marginTop: 10 }}>
                    ⚠️ 削除した画像は過去のメルマガ本文からも見られなくなります
                  </div>

                  <button onClick={loadStorageFiles} style={{ marginTop: 18, padding: '8px 16px', border: `1px solid ${COLOR.border}`, borderRadius: 9, background: COLOR.white, fontSize: 13, cursor: 'pointer', color: COLOR.textSub, fontWeight: 700 }}>🔄 再読み込み</button>
                </>
              )}
            </div>
          </div>
        )}

        {/* ===== ダッシュボード ===== */}
        {activeNav === 0 && <Dashboard supabaseUrl={SUPABASE_URL} supabaseKey={SUPABASE_KEY} />}

        {/* ===== その他のページ（準備中） ===== */}
        {activeNav === 4 && (
          <HistoryView supabaseUrl={SUPABASE_URL} supabaseKey={SUPABASE_KEY} isMobile={isMobile} COLOR={COLOR} />
        )}

      </div>

      {/* モバイル用 下部タブバー */}
      {isMobile && (
        <div style={{ display: 'flex', background: COLOR.white, borderTop: `1px solid ${COLOR.border}`, flexShrink: 0, paddingBottom: 'env(safe-area-inset-bottom, 0)' }}>
          {NAV.map((item, i) => item && (
            <div key={i} onClick={() => setActiveNav(i)}
              style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, padding: '9px 2px', cursor: 'pointer', color: activeNav === i ? COLOR.primary : COLOR.textFaint, borderTop: activeNav === i ? `3px solid ${COLOR.primary}` : '3px solid transparent' }}>
              <span style={{ fontSize: 19 }}>{item.icon}</span>
              <span style={{ fontSize: 10, fontWeight: 700, whiteSpace: 'nowrap' }}>{item.label}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
