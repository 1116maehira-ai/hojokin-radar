# 補助金レーダー 監視対象設定 v3
# type: rss … RSSフィードをそのまま読む
# type: links … ページ内のリンク一覧を取得し、前回との差分を新着とみなす

sites:
  # ===== jGrants 公式API（デジタル庁・最優先）=====
  # 受付中の補助金を締切・補助上限・対象つきの構造化データで取得。
  # keywords を1語ずつ叩いてid重複排除し、areas(対象地域)で沖縄企業が使えるものだけ残す。
  - id: jgrants
    name: jGrants（デジタル庁 補助金API）
    type: jgrants
    areas: [全国, 沖縄県]
    keywords:
      - DX
      - デジタル
      - IT導入
      - 映像
      - 動画
      - コンテンツ
      - 観光
      - 人材育成
      - リスキリング
      - ホームページ
      - 販路開拓
      - ものづくり
      - 小規模事業者
      - 事業再構築
      - 新事業

  # ===== 沖縄ローカル =====
  - id: jnet21
    name: J-Net21 支援情報ヘッドライン
    type: rss
    url: https://j-net21.smrj.go.jp/snavi/articles.rss

  - id: okinawa_pref
    name: 沖縄県庁 商工労働部 公募・募集
    type: links
    url: https://www.pref.okinawa.lg.jp/shigoto/index.html
    include: "(公募|募集|補助|助成|委託|支援事業|プロポーザル)"

  - id: isco
    name: ISCO 沖縄ITイノベーション戦略センター
    type: links
    url: https://isc-okinawa.org/information/
    include: "(公募|募集|補助|助成|委託|支援|採択)"

  - id: okinawa_ric
    name: 沖縄県産業振興公社 補助金・助成金
    type: links
    url: https://okinawa-ric.jp/service/subsidy.html
    include: "(公募|募集|補助|助成|委託|支援|リスキリング|事業承継)"

  - id: okinawa_ric_news
    name: 沖縄県産業振興公社 新着情報
    type: links
    url: https://okinawa-ric.jp/
    include: "(公募|募集|補助|助成|委託|支援事業)"

  - id: ocvb
    name: OCVB 沖縄観光コンベンションビューロー
    type: links
    url: https://www.ocvb.or.jp/
    include: "(公募|募集|委託|プロポーザル|企画)"

  - id: ogb_okinawa
    name: 内閣府 沖縄総合事務局 公募情報
    type: links
    url: https://www.ogb.go.jp/keisan/3842
    include: "(公募|募集|補助|助成|委託|支援|事業)"

  # ===== 国・全国系 =====
  - id: chusho_shindan
    name: 中小企業庁 補助金・助成金
    type: links
    url: https://www.chusho.meti.go.jp/shien/index.html
    include: "(補助|助成|公募|募集|支援)"
    exclude: "(終了|締切済|受付終了)"

  - id: meti_koubo
    name: 経済産業省 公募情報
    type: links
    url: https://www.meti.go.jp/information/publicoffer/kobo/index.html
    include: "(補助|助成|委託|公募|支援|DX|デジタル|映像|コンテンツ|観光|中小)"
    exclude: "(終了|締切済|受付終了)"

  - id: shokibo_shokokai
    name: 小規模事業者持続化補助金（商工会地区）
    type: links
    url: https://official.jizokukanb.com/news/
