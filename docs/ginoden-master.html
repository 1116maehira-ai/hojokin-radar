<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>商品マスター</title>
<style>
:root {
  --navy:#1a2b45; --navy-dim:#243553;
  --sky:#3b82c4; --sky-bg:#e8f1fb;
  --amber:#f59e0b; --amber-bg:#fef3c7;
  --green:#10b981; --green-bg:#d1fae5;
  --red:#ef4444; --red-bg:#fee2e2;
  --page:#f0f4f8; --card:#ffffff; --border:#dde4ed;
  --text:#1e293b; --text-mid:#475569; --text-lo:#94a3b8;
  --sh:0 1px 4px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0e1c30; --navy-dim:#152438;
  --sky:#5a9fd4; --sky-bg:#1a2d42;
  --amber:#fbbf24; --amber-bg:#2a1f00;
  --green:#34d399; --green-bg:#042e1c;
  --red:#f87171; --red-bg:#2d0a0a;
  --page:#0c1520; --card:#152130; --border:#243044;
  --text:#e2e8f0; --text-mid:#94a3b8; --text-lo:#475569;
  --sh:0 1px 4px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --navy:#0e1c30; --navy-dim:#152438;
  --sky:#5a9fd4; --sky-bg:#1a2d42;
  --amber:#fbbf24; --amber-bg:#2a1f00;
  --green:#34d399; --green-bg:#042e1c;
  --red:#f87171; --red-bg:#2d0a0a;
  --page:#0c1520; --card:#152130; --border:#243044;
  --text:#e2e8f0; --text-mid:#94a3b8; --text-lo:#475569;
  --sh:0 1px 4px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;background:var(--page);color:var(--text);font-size:13px;line-height:1.5}

/* HEADER */
.hdr{background:var(--navy);color:#fff;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-logo{font-size:13px;font-weight:700;letter-spacing:.04em}
.hdr-logo .ac{color:var(--amber)}
.hdr-badge{background:var(--sky);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;letter-spacing:.04em}
.hdr-r{display:flex;align-items:center;gap:12px;font-size:12px;color:rgba(255,255,255,.65)}
.hdr-warn{color:var(--amber);font-weight:600}

/* LAYOUT */
.app{display:flex;height:calc(100vh - 52px)}

/* SIDEBAR */
.sb{width:180px;min-width:180px;background:var(--navy-dim);overflow-y:auto;padding:10px 0;flex-shrink:0}
.sb-sec{padding:8px 12px 3px;font-size:10px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.35);text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 16px;color:rgba(255,255,255,.75);cursor:pointer;font-size:13px;border-left:2px solid transparent;transition:background .12s}
.sb-item:hover{background:rgba(255,255,255,.07)}
.sb-item.on{background:rgba(59,130,196,.25);border-left-color:var(--sky);color:#fff;font-weight:600}
.sb-div{height:1px;background:rgba(255,255,255,.1);margin:8px 12px}
.sb-flt{padding:6px 16px;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer;transition:background .12s;user-select:none}
.sb-flt:hover{background:rgba(255,255,255,.06)}
.sb-flt.on{color:#fff;font-weight:600}
.sb-flt .ct{font-size:10px;margin-left:4px;background:rgba(255,255,255,.15);padding:0 5px;border-radius:8px}
.sb-flt .ct.a{background:rgba(245,158,11,.3);color:var(--amber)}
.sb-flt .ct.b{background:rgba(16,185,129,.3);color:var(--green)}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:16px 20px;min-width:0}

/* TOOLBAR */
.tb{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.srch{flex:1;min-width:180px;max-width:340px;position:relative}
.srch input{width:100%;padding:8px 12px 8px 30px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
.srch input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(59,130,196,.12)}
.srch::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.sel{padding:8px 10px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.cnt{margin-left:auto;font-size:12px;color:var(--text-lo);white-space:nowrap}

/* TABLE */
.tw{overflow-x:auto;border-radius:8px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;background:var(--card);min-width:960px}
thead th{background:var(--navy);color:rgba(255,255,255,.85);font-size:11px;font-weight:600;letter-spacing:.04em;padding:10px 11px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:10}
thead th.r{text-align:right}
thead th.c{text-align:center}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover:not(.hist-row){background:var(--sky-bg)}
tbody tr.exp{background:var(--sky-bg)}
td{padding:8px 11px;font-size:12px;vertical-align:middle}
td.code{font-family:'JetBrains Mono','Courier New',monospace;font-size:11px;color:var(--text-mid)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}

.bdg{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.04em;white-space:nowrap}
.bdg-a{background:var(--amber-bg);color:#92400e}
.bdg-b{background:var(--green-bg);color:#065f46}
.bdg-rev{background:var(--red-bg);color:var(--red)}
.bdg-cat{background:var(--sky-bg);color:var(--sky)}

.tb-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--text-mid);cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
.tb-btn:hover,.tb-btn.on{background:var(--sky-bg);border-color:var(--sky);color:var(--sky)}

/* HISTORY */
.hist-row td{background:var(--sky-bg);padding:0}
.hist-inner{padding:12px 16px}
.hist-ttl{font-size:11px;font-weight:700;color:var(--text-mid);letter-spacing:.04em;margin-bottom:8px;text-transform:uppercase}
.ht{width:100%;border-collapse:collapse}
.ht th{font-size:11px;color:var(--text-lo);padding:4px 10px;text-align:left;border-bottom:1px solid var(--border)}
.ht td{font-size:12px;padding:6px 10px;border-bottom:1px solid var(--border)}
.ht tr:last-child td{border-bottom:none}
.chg{font-size:10px;margin-left:5px}
.up{color:var(--red)} .dn{color:var(--green)}

/* PHOTO IN TABLE */
.ph-thumb{width:32px;height:32px;border-radius:4px;object-fit:cover;display:inline-block;border:1px solid var(--border);cursor:pointer;transition:transform .15s}
.ph-thumb:hover{transform:scale(1.1)}
.ph-ic{font-size:14px;cursor:default;color:var(--text-lo)}

/* PHOTO LIGHTBOX */
.lbox{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:900;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lbox img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6);pointer-events:none}
.lbox-cl{position:absolute;top:18px;right:22px;color:#fff;font-size:28px;cursor:pointer;line-height:1;font-weight:300}

/* FORM */
.fv{max-width:740px}
.fbk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-mid);cursor:pointer;margin-bottom:14px;width:fit-content}
.fbk:hover{color:var(--sky)}
.fcard{background:var(--card);border-radius:8px;box-shadow:var(--sh);padding:22px}
.fcard-ttl{font-size:15px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .s2{grid-column:1/-1}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:11px;font-weight:600;color:var(--text-mid);letter-spacing:.04em;text-transform:uppercase}
.fl .req{color:var(--red);margin-left:2px}
.fi{padding:9px 12px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.fi:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(59,130,196,.12)}
.fi.code{font-family:'JetBrains Mono','Courier New',monospace;font-size:13px}
.fi.err{border-color:var(--red)}
.fhint{font-size:11px;color:var(--text-lo);margin-top:2px}
.fhint.err{color:var(--red)}

.ttog{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden}
.ttog-btn{flex:1;padding:9px;background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-mid);transition:all .15s}
.ttog-btn:first-child{border-right:1px solid var(--border)}
.ttog-btn.aa{background:var(--amber-bg);color:#92400e}
.ttog-btn.ab{background:var(--green-bg);color:#065f46}

.mkprev{background:var(--sky-bg);border:1px solid var(--border);border-radius:5px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sky)}
.mkprev.custom{background:var(--amber-bg);border-color:var(--amber);color:#92400e}
.mkrate{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}

.factions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.btn{padding:9px 20px;border-radius:5px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-p{background:var(--sky);color:#fff}
.btn-p:hover{background:#2d6db0}
.btn-s{background:var(--card);color:var(--text-mid);border:1px solid var(--border)}
.btn-s:hover{background:var(--page)}

.chk-row{display:flex;align-items:center;gap:8px}
.chk-row input{width:16px;height:16px;accent-color:var(--amber);cursor:pointer}
.chk-row label{font-size:13px;cursor:pointer}

/* PHOTO UPLOAD */
.photo-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--page);position:relative}
.photo-zone:hover,.photo-zone.drag{border-color:var(--sky);background:var(--sky-bg)}
.photo-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-zone-ic{font-size:28px;margin-bottom:6px}
.photo-zone-txt{font-size:12px;color:var(--text-mid)}
.photo-zone-sub{font-size:11px;color:var(--text-lo);margin-top:3px}
.photo-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.photo-item{position:relative;display:inline-block}
.photo-item img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:2px solid var(--border);display:block}
.photo-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer;font-weight:700;border:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* OCR */
.ocr-bar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;background:var(--amber-bg);border:1px solid var(--amber);border-radius:6px}
.ocr-bar .ocr-txt{flex:1;font-size:12px;color:#92400e}
.btn-ocr{background:var(--amber);color:#fff;border:none;border-radius:5px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-ocr:hover{background:#d97706}
.btn-ocr:disabled{background:var(--text-lo);cursor:wait}
.ocr-spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-result{margin-top:8px;padding:8px 12px;background:var(--green-bg);border:1px solid var(--green);border-radius:5px;font-size:12px;color:#065f46}

/* SETTINGS */
.stcard{background:var(--card);border-radius:8px;box-shadow:var(--sh);padding:22px;max-width:540px}
.stcard-ttl{font-size:15px;font-weight:700;margin-bottom:6px}
.stcard-sub{font-size:12px;color:var(--text-mid);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.key-wrap{display:flex;gap:8px;align-items:center}
.key-wrap input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:monospace;font-size:13px;outline:none;transition:border-color .15s}
.key-wrap input:focus{border-color:var(--sky)}
.key-eye{background:none;border:1px solid var(--border);border-radius:5px;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--text-mid)}
.key-status{margin-top:8px;font-size:12px}
.key-ok{color:var(--green)} .key-ng{color:var(--text-lo)}

/* CATEGORY */
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch h2{font-size:15px;font-weight:700}
.ctw{background:var(--card);border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.ct{width:100%;border-collapse:collapse}
.ct thead th{background:var(--navy);color:rgba(255,255,255,.85);font-size:11px;font-weight:600;letter-spacing:.04em;padding:10px 16px;text-align:left}
.ct tbody tr{border-bottom:1px solid var(--border)}
.ct tbody tr:last-child{border-bottom:none}
.ct tbody tr:hover{background:var(--sky-bg)}
.ct td{padding:10px 16px;font-size:13px}
.mki{width:72px;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:13px;font-variant-numeric:tabular-nums;text-align:right;background:var(--card);color:var(--text);outline:none}
.mki:focus{border-color:var(--sky)}
.cat-note{font-size:11px;color:var(--text-lo);margin-left:4px}
.adr{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:var(--page)}
.adr input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.adr input:focus{border-color:var(--sky)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:500;transition:transform .25s cubic-bezier(.22,.61,.36,1),opacity .25s;opacity:0;pointer-events:none;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .sb{display:none}
  .fgrid{grid-template-columns:1fr}
  .fgrid .s2{grid-column:1}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <span class="hdr-logo">宜野湾電設 <span class="ac">商品マスター</span></span>
    <span class="hdr-badge">DB v2</span>
  </div>
  <div class="hdr-r">
    <span id="hdr-tot"></span>
    <span class="hdr-warn" id="hdr-rev" hidden></span>
    <button class="btn btn-p" onclick="go('new')">＋ 新規登録</button>
  </div>
</header>

<div class="app">
  <nav class="sb" id="sb"></nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="lbox" id="lbox" hidden onclick="closeLbox()"><span class="lbox-cl" onclick="closeLbox()">✕</span><img id="lbox-img" src="" alt=""></div>

const PHOTOS = {}; // code -> [dataURL, ...]

// ── STATE ──
let S = {tab:'list', tf:'all', cf:'', q:'', exp:null, addCatName:'',
  f:{code:'',name:'',cat:'',t:'A',unit:'',cost:'',sell:'',sup:'',dt:'',rev:false,over:false,photos:[]}};

// ── RENDER ──
function render(){renderSb();renderMain();renderHdr()}

function renderHdr(){
  try{const n=JSON.parse(localStorage.getItem(LS_KEY)||'[]').length;
    document.getElementById('hdr-tot').textContent = PRODS.length+' 商品'+(n?` (+${n}件追加)`:'');
  }catch(e){document.getElementById('hdr-tot').textContent = PRODS.length+' 商品';}
  const rc = PRODS.filter(p=>p.rev).length;
  const re = document.getElementById('hdr-rev');
  re.hidden = !rc; if(rc) re.textContent = '要確認 '+rc+'件';
}

function renderSb(){
  const cc={};PRODS.forEach(p=>{cc[p.cat]=(cc[p.cat]||0)+1});
  const ac=PRODS.filter(p=>p.t==='A').length, bc=PRODS.filter(p=>p.t==='B').length;
  const ni=(tab,ic,lb)=>`<div class="sb-item ${S.tab===tab?'on':''}" onclick="go('${tab}')">${ic} ${lb}</div>`;
  const nf=(tf,lb,n,cl)=>`<div class="sb-flt ${S.tf===tf?'on':''}" onclick="stf('${tf}')">${lb}<span class="ct ${cl||''}">${n}</span></div>`;
  document.getElementById('sb').innerHTML=`
    <div class="sb-sec">メニュー</div>
    ${ni('list','≡','商品一覧')}${ni('new','＋','新規登録')}${ni('cats','◆','カテゴリ管理')}${ni('settings','⚙','設定')}
    <div class="sb-div"></div>
    <div class="sb-sec">区分</div>
    ${nf('all','全商品',PRODS.length,'')}${nf('A','A材（機器）',ac,'a')}${nf('B','B材（部材）',bc,'b')}
    <div class="sb-div"></div>
    <div class="sb-sec">カテゴリ</div>
    ${CATS.filter(c=>cc[c.name]).map(c=>`<div class="sb-flt ${S.cf===c.name?'on':''}" onclick="scf('${c.name}')">${c.name}<span class="ct">${cc[c.name]}</span></div>`).join('')}
    <div class="sb-flt ${S.cf===''?'on':''}" onclick="scf('')" style="color:rgba(255,255,255,.4);font-size:11px">すべて表示</div>`;
}

function renderMain(){
  const m=document.getElementById('main');
  if(S.tab==='list') m.innerHTML=rList();
  else if(S.tab==='new') m.innerHTML=rForm();
  else if(S.tab==='settings') m.innerHTML=rSettings();
  else m.innerHTML=rCats();
}

// ── LIST ──
function rList(){
  let ps=PRODS;
  if(S.tf!=='all') ps=ps.filter(p=>p.t===S.tf);
  if(S.cf) ps=ps.filter(p=>p.cat===S.cf);
  if(S.q){const q=S.q.toLowerCase();ps=ps.filter(p=>p.code.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||(p.sup||''). toLowerCase().includes(q)||p.cat.toLowerCase().includes(q))}

  const copts=CATS.map(c=>`<option value="${c.name}" ${S.cf===c.name?'selected':''}>${c.name}</option>`).join('');
  const rows=ps.map(p=>{
    const co=CATS.find(c=>c.name===p.cat), std=co?co.mk:1.5;
    const am=p.cost>0?(p.sell/p.cost):0, isCus=Math.abs(am-std)>0.005;
    const hh=!!HIST[p.code], isExp=S.exp===p.code;
    const ph=PHOTOS[p.code]||[];
    let r=`<tr class="${isExp?'exp':''}" onclick="${hh?`tgh('${p.code}')`:''}" style="cursor:${hh?'pointer':'default'}">
      <td class="code">${p.code}</td>
      <td>${p.name}${p.rev?' <span class="bdg bdg-rev">要確認</span>':''}</td>
      <td class="c"><span class="bdg ${p.t==='A'?'bdg-a':'bdg-b'}">${p.t}材</span></td>
      <td><span class="bdg bdg-cat">${p.cat}</span></td>
      <td class="c">${p.unit}</td>
      <td class="num">¥${f(p.cost)}</td>
      <td class="num">¥${f(p.sell)}</td>
      <td class="c" style="font-variant-numeric:tabular-nums;${isCus?'color:var(--amber);font-weight:600':'color:var(--text-mid)'}">${am.toFixed(2)}${isCus?' ★':''}</td>
      <td style="color:var(--text-mid)">${p.sup||'—'}</td>
      <td style="color:var(--text-lo)">${p.dt}</td>
      <td class="c" onclick="event.stopPropagation()">
        ${ph.length>0?`<img src="${ph[0]}" class="ph-thumb" onclick="openLbox('${p.code}')" title="写真あり ${ph.length}枚">`:          `<span class="ph-ic" title="写真なし">📷</span>`}
      </td>
      <td class="c" onclick="event.stopPropagation()">${hh?`<button class="tb-btn ${isExp?'on':''}" onclick="tgh('${p.code}')">履歴</button>`:        '<span style="color:var(--text-lo)">—</span>'}</td>
    </tr>`;
    if(isExp&&hh){
      const h=HIST[p.code];
      r+=`<tr class="hist-row"><td colspan="12"><div class="hist-inner">
        <div class="hist-ttl">価格履歴 — ${p.name}</div>
        <table class="ht"><thead><tr><th>仕入日</th><th>仕入値</th><th>変動</th><th>仕入先</th></tr></thead><tbody>
        ${h.map((hh,i)=>{const pv=h[i+1],diff=pv?hh.price-pv.price:null,pct=pv?((diff/pv.price)*100).toFixed(1):null;
          return`<tr><td style="color:var(--text-mid)">${hh.date}</td><td style="font-weight:600;font-variant-numeric:tabular-nums">¥${f(hh.price)}</td>
          <td>${diff!==null?(diff>0?`<span class="chg up">▲${f(diff)} (+${pct}%)</span>`:`<span class="chg dn">▼${f(Math.abs(diff))} (${pct}%)</span>`):'-'}</td>
          <td style="color:var(--text-lo)">${hh.sup}</td></tr>`;}).join('')}
        </tbody></table></div></td></tr>`;
    }
    return r;
  }).join('');

  return`<div class="tb">
    <div class="srch"><input type="search" placeholder="商品名・コード・仕入先で検索…" value="${esc(S.q)}" oninput="sq(this.value)" id="si"></div>
    <select class="sel" onchange="scf(this.value)"><option value="">全カテゴリ</option>${copts}</select>
    <span class="cnt">${ps.length}件 / 全${PRODS.length}件</span>
  </div>
  <div class="tw"><table>
    <thead><tr>
      <th>商品コード</th><th>商品名</th><th class="c">区分</th><th>カテゴリ</th>
      <th class="c">単位</th><th class="r">仕入値</th><th class="r">売価</th>
      <th class="c">掛け率</th><th>仕入先</th><th>最終仕入日</th><th class="c">写真</th><th class="c">履歴</th>
    </tr></thead>
    <tbody>${rows||'<tr><td colspan="12" style="text-align:center;padding:24px;color:var(--text-lo)">該当商品なし</td></tr>'}</tbody>
  </table></div>`;
}

// ── FORM ──
function rForm(){
  const g=S.f, co=CATS.find(c=>c.name===g.cat), std=co?co.mk:null;
  const cv=parseFloat(g.cost)||0, sv=parseFloat(g.sell)||0;
  const auto=std&&cv?Math.round(cv*std):null;
  const am=cv>0&&sv>0?(sv/cv):null;
  const isCus=std&&am&&Math.abs(am-std)>0.005;
  const isDup=g.code&&PRODS.some(p=>p.code===g.code.trim());

  let mkb='';
  if(std){
    if(!g.over||!sv) mkb=`<div class="mkprev"><span>カテゴリ掛け率: <strong>${g.cat}</strong></span><span class="mkrate">×${std.toFixed(2)}</span></div>`;
    else if(isCus) mkb=`<div class="mkprev custom"><span>⚠ カスタム掛け率（標準: ×${std.toFixed(2)}）</span><span class="mkrate">×${am.toFixed(2)}</span></div>`;
    else mkb=`<div class="mkprev"><span>掛け率: ×${am.toFixed(2)} ✓ 標準と一致</span></div>`;
  }

  const copts=CATS.map(c=>`<option value="${c.name}" ${g.cat===c.name?'selected':''}>${c.name}</option>`).join('');
  const uopts=['個','m','台','組','本','袋','巻','式','枚','セット'].map(u=>`<option value="${u}" ${g.unit===u?'selected':''}>${u}</option>`).join('');

  const photoItems=(g.photos||[]).map((d,i)=>`<div class="photo-item">
    <img src="${d}" onclick="openLboxData('${i}')">
    <button class="photo-del" onclick="rmPhoto(${i})">×</button>
  </div>`).join('');

  return`<div class="fv">
    <div class="fbk" onclick="go('list')">← 商品一覧に戻る</div>
    <div class="fcard">
      <div class="fcard-ttl">新規商品登録</div>
      <div class="fgrid">
        <div class="fg s2">
          <label class="fl">商品コード <span class="req">*</span></label>
          <input class="fi code ${isDup?'err':''}" id="fc" type="text" value="${esc(g.code)}" placeholder="例: VVF2.0-3C" oninput="ff('code',this.value)">
          ${isDup?'<span class="fhint err">⚠ このコードはすでに登録されています</span>':''}</div>
        <div class="fg s2">
          <label class="fl">商品名 <span class="req">*</span></label>
          <input class="fi" id="fn" type="text" value="${esc(g.name)}" placeholder="例: VVFケーブル 2.0mm 3芯" oninput="ff('name',this.value)">
        </div>
        <div class="fg">
          <label class="fl">カテゴリ <span class="req">*</span></label>
          <select class="fi" id="fcat" onchange="ff('cat',this.value)"><option value="">── 選択 ──</option>${copts}</select>
        </div>
        <div class="fg">
          <label class="fl">区分</label>
          <div class="ttog">
            <button class="ttog-btn ${g.t==='A'?'aa':''}" onclick="ff('t','A')">A材（機器・器具）</button>
            <button class="ttog-btn ${g.t==='B'?'ab':''}" onclick="ff('t','B')">B材（部材・副資材）</button>
          </div>
        </div>
        ${g.cat?`<div class="fg s2">${mkb}</div>`:''}
        <div class="fg">
          <label class="fl">仕入値（税抜） <span class="req">*</span></label>
          <input class="fi" id="fcost" type="number" value="${g.cost}" placeholder="0" oninput="fc(this.value)">
          <span class="fhint">${auto&&!g.over?`自動計算: ¥${f(auto)}（×${std.toFixed(2)}）`:'カテゴリ掛け率で売価を自動計算'}</span>
        </div>
        <div class="fg">
          <label class="fl">売価（税抜）</label>
          <input class="fi" id="fsell" type="number" value="${g.sell}" placeholder="${auto?f(auto):'自動計算'}" oninput="fs(this.value)">
          <span class="fhint">変更するとカスタム掛け率として記録されます</span>
        </div>
        <div class="fg">
          <label class="fl">単位</label>
          <select class="fi" id="funit" onchange="ff('unit',this.value)"><option value="">── 選択 ──</option>${uopts}</select>
        </div>
        <div class="fg">
          <label class="fl">仕入先</label>
          <input class="fi" id="fsup" type="text" value="${esc(g.sup)}" placeholder="例: パナソニック電工" oninput="ff('sup',this.value)">
        </div>
        <div class="fg">
          <label class="fl">最終仕入日</label>
          <input class="fi" id="fdt" type="date" value="${g.dt}" oninput="ff('dt',this.value)">
        </div>
        <div class="fg" style="justify-content:flex-end">
          <div class="chk-row" style="margin-top:auto;padding-bottom:4px">
            <input type="checkbox" id="frev" ${g.rev?'checked':''} onchange="ff('rev',this.checked)">
            <label for="frev">要確認フラグを立てる（価格未確定・廃盤疑い等）</label>
          </div>
        </div>
        <div class="fg s2">
          <label class="fl">商品写真</label>
          <div class="photo-zone" id="pzone" ondragover="event.preventDefault();this.classList.add('drag')"
               ondragleave="this.classList.remove('drag')" ondrop="onDrop(event)">
            <input type="file" accept="image/*" multiple onchange="onFileChange(this)">
            <div class="photo-zone-ic">📷</div>
            <div class="photo-zone-txt">クリックまたはドラッグ＆ドロップで写真を追加</div>
            <div class="photo-zone-sub">JPG・PNG・HEIC対応 / 複数枚選択可</div>
          </div>
          ${(g.photos||[]).length>0?`<div class="photo-grid" id="pgrid">${photoItems}</div>
          <div class="ocr-bar">
            <span class="ocr-txt">📷 写真からAIで品番・品名・価格を自動入力できます</span>
            <button class="btn-ocr" id="ocr-btn" onclick="ocr()">OCRで読み取る</button>
          </div>`:''}
          <div id="ocr-msg"></div>
        </div>
      </div>
      <div class="factions">
        <button class="btn btn-s" onclick="go('list')">キャンセル</button>
        <button class="btn btn-p" onclick="sub()">登録する</button>
      </div>
    </div>
  </div>`;
}

// ── SETTINGS ──
function rSettings(){
  return`<div class="stcard">
    <div class="stcard-ttl">⚙ 設定</div>
    <div class="stcard-sub">このツールはすべてのデータをこのデバイスにのみ保存します。外部サーバーには送信しません。</div>
    <div class="fg" style="margin-bottom:18px">
      <label class="fl">OCR機能について</label>
      <div class="key-status"><span class="key-ok">✓ Claude AI (window.claude) を使用 — APIキー不要</span></div>
      <div style="margin-top:8px;font-size:12px;color:var(--text-mid);line-height:1.7">
        写真からの文字読み取りは、Claudeのビルトイン機能を使います。<br>
        初回使用時に同意確認が表示されます。
      </div>
    </div>
  </div>`;
}

// ── OCR ──
async function ocr(){
  const photos=S.f.photos||[];
  if(!photos.length){toast('先に写真を選択してください');return}
  const btn=document.getElementById('ocr-btn');
  const msg=document.getElementById('ocr-msg');
  if(!btn||!msg)return;
  btn.disabled=true;
  btn.innerHTML='<span class="ocr-spin"></span>読み取り中…';
  msg.innerHTML='';
  try{
    const sample=await window.claude?.use('sample');
    if(!sample)throw new Error('OCR機能はClaudeのArtifact上でのみ使えます');
    // dataURL → Blob
    const dataUrl=photos[0];
    const arr=dataUrl.split(',');
    const mime=(arr[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
    const bstr=atob(arr[1]);
    const ia=new Uint8Array(bstr.length);
    for(let i=0;i<bstr.length;i++)ia[i]=bstr.charCodeAt(i);
    const blob=new Blob([ia],{type:mime});
    const prompt=`この画像から電気工事部材・照明器具の商品情報を抽出してください。
JSONのみ返してください（説明文不要）：
{"code":"品番・型番（英数字）","name":"商品名","unit":"単位（台/個/m/本/式等）","cost":仕入価格の数値,"sup":"メーカー・仕入先名"}
見つからない項目はnullにしてください。`;
    const ex=await sample.json(prompt,{images:[blob],modelTier:'quick',cache:false});
    let filled=[];
    if(ex.code){S.f.code=ex.code;filled.push('品番')}
    if(ex.name){S.f.name=ex.name;filled.push('品名')}
    if(ex.unit){S.f.unit=ex.unit;filled.push('単位')}
    if(ex.cost){S.f.cost=String(ex.cost);filled.push('仕入値');
      const co=CATS.find(c=>c.name===S.f.cat);
      if(co&&!S.f.over)S.f.sell=String(Math.round(ex.cost*co.mk));
    }
    if(ex.sup){S.f.sup=ex.sup;filled.push('仕入先')}
    renderMain();
    const msgEl=document.getElementById('ocr-msg');
    if(msgEl)msgEl.innerHTML=`<div class="ocr-result">✓ 自動入力: ${filled.join('・')}</div>`;
  }catch(e){
    btn.disabled=false;btn.innerHTML='OCRで読み取る';
    const msgEl2=document.getElementById('ocr-msg');
    if(msgEl2)msgEl2.innerHTML=`<div style="margin-top:8px;padding:10px 14px;background:var(--red-bg);border:1px solid var(--red);border-radius:5px;font-size:12px;color:var(--red);word-break:break-all">⚠ エラー: ${esc(e.message)}</div>`;
  }
}

// ── CATS ──
function rCats(){
  const cc={};PRODS.forEach(p=>{cc[p.cat]=(cc[p.cat]||0)+1});
  return`<div>
    <div class="ch"><h2>カテゴリ・掛け率管理</h2></div>
    <div class="ctw">
      <table class="ct">
        <thead><tr><th>カテゴリ名</th><th>掛け率</th><th>利益率</th><th>登録商品数</th><th></th></tr></thead>
        <tbody>
          ${CATS.map((c,i)=>{
            const cnt=cc[c.name]||0, margin=(((c.mk-1)/c.mk)*100).toFixed(1);
            return`<tr>
              <td><strong>${c.name}</strong></td>
              <td>×<input class="mki" type="number" step="0.01" min="1.00" max="9.99" value="${c.mk.toFixed(2)}" onchange="umk(${i},parseFloat(this.value))">
                <span class="cat-note">(${((c.mk-1)*100).toFixed(0)}%増し)</span></td>
              <td style="color:var(--green);font-weight:600">${margin}%</td>
              <td style="color:var(--text-mid)">${cnt}点</td>
              <td><button class="tb-btn" onclick="delCat(${i})">削除</button></td>
            </tr>`;}).join('')}
        </tbody>
      </table>
      <div class="adr">
        <input type="text" placeholder="新しいカテゴリ名を入力…" id="nc" value="${esc(S.addCatName)}" oninput="S.addCatName=this.value">
        <button class="btn btn-p" style="white-space:nowrap" onclick="addCat()">追加</button>
      </div>
    </div>
  </div>`;
}

// ── ACTIONS ──
function go(tab){
  S.tab=tab;
  if(tab==='new') S.f={code:'',name:'',cat:'',t:'A',unit:'',cost:'',sell:'',sup:'',dt:'',rev:false,over:false,photos:[]};
  if(tab==='settings'||tab==='cats'||tab==='list') {} // no form reset needed
  render();
  if(tab==='list'){const si=document.getElementById('si');if(si)si.focus()}
}
function stf(v){S.tf=v;render()}
function scf(v){S.cf=v;if(S.tab!=='list')S.tab='list';render()}
function sq(v){S.q=v;document.getElementById('main').innerHTML=rList();renderSb();renderHdr()}
function tgh(code){S.exp=S.exp===code?null:code;document.getElementById('main').innerHTML=rList()}

function ff(k,v){
  S.f[k]=v;
  if(k==='cat'){const co=CATS.find(c=>c.name===v);if(co&&S.f.cost&&!S.f.over)S.f.sell=String(Math.round(parseFloat(S.f.cost)*co.mk))}
  renderMain();
}
function fc(v){
  S.f.cost=v;
  const co=CATS.find(c=>c.name===S.f.cat);
  if(co&&!S.f.over){const c=parseFloat(v)||0;S.f.sell=c>0?String(Math.round(c*co.mk)):''}
  renderMain();
}
function fs(v){
  S.f.sell=v;S.f.over=true;
  const co=CATS.find(c=>c.name===S.f.cat),c=parseFloat(S.f.cost)||0,s=parseFloat(v)||0;
  if(co&&c>0&&s>0&&Math.abs(s/c-co.mk)<0.005)S.f.over=false;
  renderMain();
}

function sub(){
  const g=S.f;
  if(!g.code.trim()||!g.name.trim()||!g.cat||!g.cost){toast('必須項目を入力してください');return}
  if(PRODS.some(p=>p.code===g.code.trim())){toast('このコードはすでに登録されています');return}
  const c=parseFloat(g.cost)||0, s=parseFloat(g.sell)||0, co=CATS.find(x=>x.name===g.cat);
  PRODS.push({code:g.code.trim(),name:g.name.trim(),t:g.t,cat:g.cat,unit:g.unit||'個',
    cost:c, sell:s||(co?Math.round(c*co.mk):c), sup:g.sup, dt:g.dt||new Date().toISOString().slice(0,10), rev:g.rev});
  if(g.photos&&g.photos.length) PHOTOS[g.code.trim()]=g.photos;
  toast(`「${g.name.trim()}」を登録しました`);go('list');
}

function umk(i,v){if(!isNaN(v)&&v>=1){CATS[i].mk=v;renderMain()}}
function delCat(i){
  const nm=CATS[i].name;
  if(PRODS.some(p=>p.cat===nm)){toast(`「${nm}」は使用中のため削除できません`);return}
  CATS.splice(i,1);renderMain();toast(`「${nm}」を削除しました`);
}
function addCat(){
  const nm=S.addCatName.trim();
  if(!nm)return;
  if(CATS.some(c=>c.name===nm)){toast('同じカテゴリ名がすでにあります');return}
  CATS.push({name:nm,mk:1.50});S.addCatName='';renderMain();toast(`「${nm}」を追加しました`);
}

// ── PHOTO ──
function onFileChange(inp){
  const files=Array.from(inp.files);
  Promise.all(files.map(readFile)).then(datas=>{
    S.f.photos=(S.f.photos||[]).concat(datas);
    renderMain();
  });
}
function onDrop(e){
  e.preventDefault();document.getElementById('pzone').classList.remove('drag');
  const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
  Promise.all(files.map(readFile)).then(datas=>{
    S.f.photos=(S.f.photos||[]).concat(datas);
    renderMain();
  });
}
function readFile(file){
  return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
}
function rmPhoto(i){S.f.photos.splice(i,1);renderMain()}
function openLbox(code){
  const ph=PHOTOS[code]||[];
  if(!ph.length)return;
  document.getElementById('lbox-img').src=ph[0];
  document.getElementById('lbox').hidden=false;
}
function openLboxData(i){
  const d=S.f.photos[i];if(!d)return;
  document.getElementById('lbox-img').src=d;
  document.getElementById('lbox').hidden=false;
}
function closeLbox(){document.getElementById('lbox').hidden=true;document.getElementById('lbox-img').src=''}

// ── UTILS ──
const f=n=>Math.round(n).toLocaleString('ja-JP');
const esc=s=>(s||''). replace(/"/g,'&quot;').replace(/</g,'&lt;');

let _tid;
function toast(msg){
  clearTimeout(_tid);
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  _tid=setTimeout(()=>el.classList.remove('on'),2600);
}

// ── PERSISTENCE ──
const LS_KEY = 'ginoden_prods_v1';
let _db = null;

function initDB(){
  return new Promise(res=>{
    try{
      const req=indexedDB.open('ginoden_photos',1);
      req.onupgradeneeded=e=>e.target.result.createObjectStore('photos',{keyPath:'code'});
      req.onsuccess=e=>{_db=e.target.result;res()};
      req.onerror=()=>res();
    }catch(e){res()}
  });
}

function loadLocalProds(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
    saved.forEach(p=>{if(!PRODS.find(x=>x.code===p.code))PRODS.push(p)});
  }catch(e){}
}

function loadPhotosDB(){
  if(!_db)return Promise.resolve();
  return new Promise(res=>{
    const tx=_db.transaction('photos','readonly');
    const req=tx.objectStore('photos').getAll();
    req.onsuccess=e=>{e.target.result.forEach(r=>{PHOTOS[r.code]=r.photos});res()};
    req.onerror=()=>res();
  });
}

function saveProdLocal(prod){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
    saved.push(prod);
    localStorage.setItem(LS_KEY,JSON.stringify(saved));
  }catch(e){}
}

function savePhotosDB(code,photos){
  if(!_db)return Promise.resolve();
  return new Promise(res=>{
    const tx=_db.transaction('photos','readwrite');
    const store=tx.objectStore('photos');
    photos.length>0?store.put({code,photos}):store.delete(code);
    tx.oncomplete=res;tx.onerror=res;
  });
}

// Override sub() to persist
const _subOrig=sub;
async function sub(){
  const g=S.f;
  if(!g.code.trim()||!g.name.trim()||!g.cat||!g.cost){toast('必須項目を入力してください');return}
  if(PRODS.some(p=>p.code===g.code.trim())){toast('このコードはすでに登録されています');return}
  const c=parseFloat(g.cost)||0, s=parseFloat(g.sell)||0, co=CATS.find(x=>x.name===g.cat);
  const prod={code:g.code.trim(),name:g.name.trim(),t:g.t,cat:g.cat,unit:g.unit||'個',
    cost:c,sell:s||(co?Math.round(c*co.mk):c),sup:g.sup,dt:g.dt||new Date().toISOString().slice(0,10),rev:g.rev};
  PRODS.push(prod);
  saveProdLocal(prod);
  if(g.photos&&g.photos.length){
    PHOTOS[prod.code]=g.photos;
    await savePhotosDB(prod.code,g.photos);
  }
  toast(`「${prod.name}」を登録しました（ローカル保存済）`);go('list');
}

async function startup(){
  await initDB();
  loadLocalProds();
  await loadPhotosDB();
  render();
}
startup();
</script>
