<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業CRMリスト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --primary: #1e40af;
  --primary-d: #1e3a8a;
  --primary-l: #dbeafe;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --c-pending: #94a3b8;
  --c-contacted: #3b82f6;
  --c-callback: #f97316;
  --c-mailed: #8b5cf6;
  --c-won: #10b981;
  --c-declined: #cbd5e1;
  --won-bg: #f0fdf4;
  --today-bg: #fff1f2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
    --border: #334155; --primary-l: #1e3a5f; --won-bg: #052e16; --today-bg: #3f0d10;
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
  --border: #334155; --primary-l: #1e3a5f; --won-bg: #052e16; --today-bg: #3f0d10;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}

/* ── HEADER ── */
.hdr{background:var(--primary);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hdr h1{font-size:16px;font-weight:800;flex:1;letter-spacing:-.01em}
.hdr-sub{font-size:11px;opacity:.75}
.btn-add{padding:6px 13px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:rgba(255,255,255,.28)}
.btn-refresh{padding:6px 10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;font-size:13px;cursor:pointer}

/* ── STATS ── */
.stats{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.sc{flex-shrink:0;text-align:center;padding:8px 12px;border-radius:10px;cursor:pointer;border:2px solid transparent;background:var(--bg);min-width:64px;transition:all .12s}
.sc:hover{transform:translateY(-1px)}
.sc.on{border-color:var(--primary);background:var(--primary-l)}
.sc .n{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sc .l{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
.sc.st .n{color:#ef4444}
.sc.sp .n{color:var(--c-pending)}
.sc.sco .n{color:var(--c-contacted)}
.sc.scb .n{color:var(--c-callback)}
.sc.sm .n{color:var(--c-mailed)}
.sc.sw .n{color:var(--c-won)}
.sc.sd .n{color:var(--muted)}

/* ── FILTER BAR ── */
.fbar{padding:9px 12px;display:flex;gap:7px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.fbar input,.fbar select{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.fbar input{flex:1;min-width:160px}
.fbar select{cursor:pointer}

/* ── LIST ── */
.lwrap{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--card);border-radius:11px;padding:12px 14px;border-left:4px solid var(--c-pending);cursor:pointer;transition:transform .1s,box-shadow .1s;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card.p-contacted{border-left-color:var(--c-contacted)}
.card.p-pending_callback{border-left-color:var(--c-callback)}
.card.p-mailed{border-left-color:var(--c-mailed)}
.card.p-won{border-left-color:var(--c-won);background:var(--won-bg)}
.card.p-declined{border-left-color:var(--c-declined);opacity:.65}
.card.is-today{background:var(--today-bg)}
.co-name{font-size:14px;font-weight:700;margin-bottom:4px;word-break:break-all}
.co-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
.co-meta+.co-meta{margin-top:4px}
.co-phone{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:var(--primary);font-variant-numeric:tabular-nums}

/* rank badges */
.rk{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:800}
.rk-S{background:#fee2e2;color:#b91c1c}
.rk-A{background:#fef3c7;color:#92600b}
.rk-B{background:#d1fae5;color:#065f46}
.rk-C{background:#f1f5f9;color:#64748b}
.seg{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
.seg-shiki{background:#fee2e2;color:#b91c1c}
.seg-rinen{background:#e0e7ff;color:#3730a3}
.seg-ai{background:#dcfce7;color:#166534}
.segbar{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border);align-items:center}
.segbar .lbl{font-size:11px;color:var(--muted);margin-right:2px}
.segbtn{padding:4px 11px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;font-variant-numeric:tabular-nums}
.segbtn.on{border-color:var(--primary);background:var(--primary-l)}
.segbtn small{font-weight:400;color:var(--muted);margin-left:3px}
.info-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.info-edit input{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;min-width:0}
.info-edit input.full{grid-column:1/-1}

/* phase label */
.pl{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700}
.pl-pending{background:#f3f4f6;color:#6b7280}
.pl-contacted{background:#dbeafe;color:#1e40af}
.pl-pending_callback{background:#fed7aa;color:#9a3412}
.pl-mailed{background:#ede9fe;color:#5b21b6}
.pl-won{background:#d1fae5;color:#065f46}
.pl-declined{background:#f3f4f6;color:#9ca3af}

.nt{font-size:10px;color:var(--muted)}
.nt.past{color:#ef4444;font-weight:700}
.nt.due{color:#f97316;font-weight:700}
.log-cnt{font-size:10px;color:var(--muted)}

/* ── MODAL ── */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.ovl.open{display:flex}
.modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -4px 30px rgba(0,0,0,.2)}
.mhd{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.mhd h2{font-size:15px;font-weight:800;flex:1;word-break:break-all;line-height:1.3}
.mclose{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mtabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted);transition:color .1s}
.mtab.on{border-bottom-color:var(--primary);color:var(--primary)}
.mbody{padding:14px;overflow-y:auto;flex:1}

/* action grid */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.abtn{padding:12px 8px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .1s,transform .1s;font-family:inherit}
.abtn:hover{opacity:.85;transform:scale(.98)}
.a-ok{background:#dbeafe;color:#1e40af}
.a-ab{background:#fed7aa;color:#9a3412}
.a-cb{background:#fef3c7;color:#92600b}
.a-dm{background:#ede9fe;color:#5b21b6}
.a-lt{background:#d1fae5;color:#065f46}
.a-won{background:#bbf7d0;color:#14532d}
.a-no{background:#fee2e2;color:#7f1d1d}

/* log */
.log-item{padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.log-item:last-child{border-bottom:none}
.log-act{font-weight:700}
.log-dt{color:var(--muted);font-size:11px;margin-top:1px}
.log-note{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}

/* script */
.script-box{background:var(--bg);border-radius:10px;padding:14px;font-size:13px;line-height:1.9;white-space:pre-wrap;border:1px solid var(--border)}

/* info */
.irow{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.irow:last-of-type{border-bottom:none}
.ilabel{color:var(--muted);width:72px;flex-shrink:0;font-size:12px;padding-top:1px}
.ival{flex:1;word-break:break-all;line-height:1.5}
.ival a{color:var(--primary);text-decoration:none}
.ival a:hover{text-decoration:underline}
.sns-wrap{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.sl{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none}
.sl-ig{background:#fce7f3;color:#9d174d}
.sl-x{background:#f3f4f6;color:#111827}
.sl-fb{background:#dbeafe;color:#1e3a8a}
.sl-tt{background:#e0f2fe;color:#0c4a6e}
.sl-job{background:#ede9fe;color:#4c1d95}

/* form elements */
.note-ta{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;margin-top:6px;resize:vertical;min-height:60px;font-family:inherit}
.note-ta:focus{outline:none;border-color:var(--primary)}
.date-row{display:flex;gap:8px;align-items:center;margin-top:12px}
.date-inp{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.save-btn{padding:7px 13px;background:var(--primary);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.save-btn:hover{background:var(--primary-d)}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}

/* add modal form */
.add-form{display:flex;flex-direction:column;gap:9px}
.add-inp{padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
.add-inp:focus{outline:none;border-color:var(--primary)}
.add-submit{padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.add-submit:hover{background:var(--primary-d)}

/* houjin search */
.houjin-search-row{display:flex;align-items:center;gap:8px;margin:-3px 0 0}
.houjin-srch-btn{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text);font-family:inherit;white-space:nowrap}
.houjin-srch-btn:hover{border-color:var(--primary);color:var(--primary)}
.houjin-status{font-size:11px;color:var(--muted)}
.houjin-results{display:flex;flex-direction:column;gap:3px;max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:4px}
.houjin-results:empty{display:none}

/* discover modal */
.disc-form{display:flex;flex-direction:column;gap:10px}
.disc-row{display:flex;flex-direction:column;gap:4px}
.disc-lbl{font-size:12px;font-weight:700;color:var(--muted)}
.disc-sel,.disc-inp{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
.disc-sel:focus,.disc-inp:focus{outline:none;border-color:var(--primary)}
.disc-start-btn{padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
.disc-start-btn:hover{background:var(--primary-d)}
.disc-prog-bar{height:8px;background:var(--hover);border-radius:999px;overflow:hidden;margin-bottom:4px}
.disc-prog-fill{height:100%;background:var(--primary);border-radius:999px;width:0%;transition:width .3s}
.disc-result-hd{font-size:12px;font-weight:700;color:var(--muted);padding:6px 0 8px;display:flex;justify-content:space-between;align-items:center}
.disc-all-btn{font-size:11px;padding:3px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit}
.disc-card{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:5px;transition:border-color .1s}
.disc-card:hover{border-color:var(--primary);background:var(--hover)}
.disc-card-on{border-color:var(--primary)!important;background:var(--primary-l)!important}
.disc-cb{margin-top:2px;width:16px;height:16px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
.disc-card-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.disc-cname{font-size:14px;font-weight:700;color:var(--text)}
.disc-ckind{display:inline-block;font-size:10px;font-weight:700;background:var(--hover);color:var(--muted);padding:1px 6px;border-radius:4px;width:fit-content;margin-top:1px}
.disc-caddr{font-size:12px;color:var(--muted)}
.disc-ccn{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.disc-add-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 2px;border-top:1px solid var(--border);margin-top:8px}
.disc-add-btn{padding:10px 18px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.disc-add-btn:hover{background:var(--primary-d)}
.disc-empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.houjin-row{padding:6px 8px;border-radius:6px;cursor:pointer;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:1px 6px}
.houjin-row:hover{background:var(--hover)}
.houjin-rname{font-size:13px;font-weight:700;color:var(--text);grid-column:1}
.houjin-raddr{font-size:11px;color:var(--muted);grid-column:1}
.houjin-rnum{font-size:10px;color:var(--muted);grid-row:1/3;align-self:center;font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;z-index:200;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* empty / loading */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* ── SCRIPT TABS ── */
.stabs{display:flex;gap:5px;margin-bottom:10px}
.stab{padding:6px 18px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s}
.stab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.script-name-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sname{font-size:12px;font-weight:700;color:var(--muted);flex:1}
.edit-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer}
.edit-btn:hover{background:var(--border)}
.script-edit-ta{width:100%;padding:10px 12px;border:1px solid var(--primary);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;line-height:1.9;min-height:260px;resize:vertical;font-family:inherit}
.script-name-inp{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;margin-bottom:8px}
.script-name-inp:focus,.script-edit-ta:focus{outline:none;border-color:var(--primary)}
.edit-actions{display:flex;gap:7px;margin-top:8px;align-items:center}
.save-scr-btn{padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.cancel-scr-btn{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.reset-scr-btn{padding:8px 12px;background:var(--bg);border:1px solid #fca5a5;border-radius:8px;font-size:11px;color:#dc2626;cursor:pointer;margin-left:auto}

/* ── VERIFIED BLOCK ── */
.v-block{margin:14px 0;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.v-hantei{font-weight:600;padding:2px 8px;border-radius:6px;display:inline-block}
.v-ok{background:#d1fae5;color:#065f46}
.v-warn{background:#fef3c7;color:#92400e}
.v-unk{background:#e5e7eb;color:#374151}
.v-notes{display:block;font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap}
/* ── LETTER TAB ── */
.letter-ta{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;line-height:1.8;min-height:280px;resize:vertical;font-family:inherit}
.letter-ta:focus{outline:none;border-color:var(--primary)}
.letter-checks{display:flex;gap:20px;margin:12px 0;padding:12px 16px;background:var(--bg);border-radius:9px;border:1px solid var(--border);flex-wrap:wrap}
.lchk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:700;user-select:none}
.lchk input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--primary);flex-shrink:0}
.lchk-written{color:#b45309}
.lchk-made{color:#059669}
.lchk-sent{color:#7c3aed}
.ls{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:800}
.ls-written{background:#fef3c7;color:#92400e}
.ls-made{background:#d1fae5;color:#065f46}
.ls-sent{background:#ede9fe;color:#5b21b6}
.ls-dm{background:#dbeafe;color:#1e40af}

/* ── LOGIN ── */
.login-ovl{position:fixed;inset:0;background:#0f172a;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#1e293b;border-radius:18px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.login-box h2{color:#f1f5f9;text-align:center;margin-bottom:6px;font-size:20px}
.login-sub{color:#94a3b8;text-align:center;font-size:13px;margin-bottom:22px}
.l-inp{width:100%;padding:11px 14px;border:1px solid #334155;border-radius:9px;background:#0f172a;color:#f1f5f9;font-size:15px;font-family:inherit;margin-bottom:12px;outline:none;box-sizing:border-box}
.l-inp:focus{border-color:#3b82f6}
.l-btn{width:100%;padding:12px;background:#1d4ed8;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.l-btn:hover{background:#1e40af}
.l-err{color:#f87171;font-size:13px;text-align:center;margin-top:10px;display:none}
.u-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;background:rgba(255,255,255,.15);border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap}
.u-chip:hover{background:rgba(255,255,255,.25)}

/* ── FILTER TOGGLES ── */
.flt-grp{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding-top:4px;width:100%;border-top:1px solid var(--border);margin-top:3px}
.flt-grp .lbl{font-size:11px;color:var(--muted);white-space:nowrap;margin-right:1px}
.ftgl{padding:4px 11px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.4;transition:all .12s}
.ftgl:hover{border-color:var(--primary)}
.ftgl.on{border-color:var(--primary);background:var(--primary-l);color:var(--primary)}
.ftgl[data-flt="dm_ready"].on{border-color:#7c3aed;background:#ede9fe;color:#5b21b6}
.ftgl[data-flt="dm"].on{border-color:#1d4ed8;background:#dbeafe;color:#1e40af}
.ftgl[data-flt="none"].on{border-color:#94a3b8;background:#f1f5f9;color:#374151}

/* ── BULK BAR ── */
.bulk-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:#1e40af;color:#fff;display:none;align-items:center;gap:10px;z-index:50;box-shadow:0 -3px 20px rgba(0,0,0,.3);flex-wrap:wrap}
.bulk-btn{padding:8px 18px;background:#fff;color:#1e40af;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px;font-family:inherit}
.bulk-btn:hover{background:#dbeafe}
.bulk-clr{padding:7px 12px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;font-weight:600;cursor:pointer;font-size:12px;font-family:inherit}
.ls-ready{background:#ede9fe;color:#5b21b6}
/* ── IMPORT ── */
.imp-hint{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.8;background:var(--bg);padding:10px 12px;border-radius:8px;border:1px solid var(--border)}
.imp-hint code{font-family:'SF Mono',Menlo,Consolas,monospace;background:var(--border);padding:1px 4px;border-radius:3px}
.imp-csv-ta{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;line-height:1.6;min-height:130px;resize:vertical;font-family:'SF Mono',Menlo,Consolas,monospace}
.imp-csv-ta:focus{outline:none;border-color:var(--primary)}
.file-lbl{display:block;margin:8px 0;font-size:12px;color:var(--muted)}
.imp-parse-btn{padding:11px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;margin-top:6px}
.imp-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ichip{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700}
.ichip-n{background:#d1fae5;color:#065f46}
.ichip-d{background:#fed7aa;color:#9a3412}
.ichip-s{background:#f3f4f6;color:#6b7280}
.imp-sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.new-list{border:1px solid var(--border);border-radius:8px;overflow:hidden;max-height:160px;overflow-y:auto;margin-bottom:8px}
.new-item{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:8px;align-items:center}
.new-item:last-child{border-bottom:none}
.conflict-card{border:1px solid var(--c-callback);border-radius:9px;margin-bottom:10px;overflow:hidden}
.conflict-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--border);font-size:13px;font-weight:700}
.cbadge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;background:#fed7aa;color:#9a3412}
.cfield{display:grid;grid-template-columns:68px 1fr 1fr;gap:5px;padding:7px 12px;border-bottom:1px solid var(--border);align-items:start;font-size:12px}
.cfield:last-child{border-bottom:none}
.cfield-lbl{color:var(--muted);font-size:11px;padding-top:5px}
.cfield-head{font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:3px}
.cv{padding:5px 8px;border-radius:6px;border:2px solid var(--border);cursor:pointer;background:var(--bg);line-height:1.4;word-break:break-all;transition:all .1s}
.cv.sel{border-color:var(--primary);background:var(--primary-l)}
.cv-same{padding:5px 8px;border-radius:6px;background:var(--bg);line-height:1.4;word-break:break-all;color:var(--muted);font-size:11px}
.imp-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.iact{padding:10px 16px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.iact-new{background:#d1fae5;color:#065f46}
.iact-all{background:var(--primary);color:#fff}
.iact-can{background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.imp-back{padding:5px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:12px}

/* ── VERIFY MODE ── */
.vfy-bar{padding:8px 14px;background:var(--ok-bg);border-bottom:1px solid var(--ok);font-size:13px;font-weight:700;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.vfy-bar.show{display:flex}
.vfy-prog{flex:1;min-width:100px;background:rgba(0,0,0,.1);border-radius:999px;height:6px;overflow:hidden}
.vfy-fill{height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.vfy-count{white-space:nowrap;color:var(--ok);font-size:13px}
.btn-vfy{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.35);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .12s}
.btn-vfy-off{background:rgba(255,255,255,.15);color:#fff}
.btn-vfy-on{background:#fff;color:#065f46;border-color:#a7f3d0}
.btn-vfy-off:hover,.btn-vfy-on:hover{opacity:.85}
.vfy-badge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:800}
.vb-done{background:#d1fae5;color:#065f46}
.vb-ng{background:#fef9c3;color:#713f12}
.card.vfy-ok{border-left-color:#10b981!important;background:var(--won-bg)!important}
/* assign badge */
.asn{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:800}
.asn-hibiki{background:#dbeafe;color:#1e3a8a}
.asn-megu{background:#fce7f3;color:#9d174d}
/* inline quick-edit */
.qe-form{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.qe-inp{padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;min-width:0}
.qe-inp.full{grid-column:1/-1}
.qe-save{padding:7px 12px;background:var(--ok);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;grid-column:1/-1}
.qe-save:hover{opacity:.85}
/* letter template */
.ltpl-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ltpl-btn{padding:6px 13px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s}
.ltpl-btn:hover{border-color:var(--primary);background:var(--primary-l);color:var(--primary)}
/* ── AUTO-SELECT & PROGRESS ── */
.ftgl[data-flt="letter_top30"].on{border-color:#059669;background:#d1fae5;color:#065f46}
.bulk-prog{font-size:12px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.2);padding:4px 10px;border-radius:6px;white-space:nowrap}
.bulk-auto-btn{padding:8px 18px;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px;font-family:inherit}
.bulk-auto-btn:hover{background:#059669}
/* ── MOBILE ────────────────────────────────────────────── */
@media (max-width: 640px) {
  /* Header: compact, hide low-priority buttons */
  .hdr { padding: 9px 12px; gap: 6px; }
  .hdr h1 { font-size: 14px; }
  .hdr-sub { display: none; }
  .btn-vfy { display: none; }
  .btn-add[onclick*="openImp"], .btn-add[onclick*="exportDm"] { display: none; }
  .u-chip { padding: 2px 7px; font-size: 11px; }

  /* Stats */
  .sc { min-width: 52px; padding: 6px 8px; }
  .sc .n { font-size: 17px; }
  .sc .l { font-size: 9px; }

  /* Segbar */
  .segbar { padding: 6px 10px; gap: 5px; }
  .segbtn { font-size: 11px; padding: 3px 9px; }

  /* Filter bar: stack search full-width, selects in row */
  .fbar { padding: 7px 10px; gap: 5px; }
  .fbar input { min-width: 100%; order: -1; }
  .fbar select { flex: 1; min-width: 0; font-size: 12px; padding: 6px 4px; }
  .flt-grp { gap: 4px; padding-top: 3px; margin-top: 2px; }
  .ftgl { font-size: 11px; padding: 3px 9px; }

  /* List */
  .lwrap { padding: 7px 8px; gap: 5px; }
  .card { padding: 9px 11px; }
  .co-name { font-size: 13px; }
  .co-meta { font-size: 10px; gap: 4px; }

  /* Modal: full-screen friendly */
  .modal { max-height: 97vh; border-radius: 14px 14px 0 0; }
  .mhd { padding: 11px 14px 9px; }
  .mhd h2 { font-size: 14px; }
  .mtab { padding: 8px 11px; font-size: 11px; }
  .mbody { padding: 10px 12px; }

  /* Action buttons */
  .agrid { grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }
  .abtn { padding: 10px 5px; font-size: 12px; }

  /* Info grid */
  .info-edit { grid-template-columns: 1fr; }
  .info-edit input.full { grid-column: 1; }

  /* Script tabs: horizontal scroll, no wrap */
  .stabs { flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .stabs::-webkit-scrollbar { display: none; }
  .stab { font-size: 11px; padding: 5px 12px; flex-shrink: 0; white-space: nowrap; }

  /* Conversation tree: touch-friendly */
  .ct-say { font-size: 13px; padding: 12px 13px; line-height: 1.8; }
  .ct-rbtn { padding: 12px 14px; font-size: 12px; width: 100%; display: block; text-align: left; }
  .ct-reactions { flex-direction: column; gap: 6px; }
  .ct-header { gap: 5px; }
  .ct-back, .ct-reset, .ct-edit-btn { font-size: 11px; padding: 5px 9px; }
  .ct-memo-ta { min-height: 70px; font-size: 13px; }
  .ct-memo-save { width: 100%; padding: 12px; font-size: 14px; }
  .ct-end-banner { font-size: 18px; padding: 14px; }
  .ct-node-ta { font-size: 12px; }
  .ct-react-row { flex-wrap: wrap; gap: 4px; }
  .ct-react-sel { max-width: 100%; width: 100%; }

  /* Quick edit */
  .qe-form { grid-template-columns: 1fr; }

  /* Letter */
  .letter-checks { gap: 10px; padding: 10px 12px; }
  .lchk { font-size: 13px; }
  .letter-ta { min-height: 220px; font-size: 13px; }

  /* Bulk bar */
  .bulk-bar { padding: 8px 10px; gap: 6px; }
  .bulk-btn { padding: 7px 12px; font-size: 12px; }
  .bulk-auto-btn { padding: 7px 14px; font-size: 12px; }
  .bulk-prog { font-size: 11px; }

  /* Log */
  .log-item { font-size: 12px; }

  /* irow (info rows) */
  .irow { flex-direction: column; gap: 2px; padding: 7px 0; }
  .ilabel { width: auto; font-size: 11px; padding-top: 0; }
}

/* ── CONVERSATION TREE ── */
.ct-header{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.ct-step{font-size:11px;font-weight:800;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:6px;border:1px solid var(--border)}
.ct-back,.ct-reset,.ct-edit-btn{padding:5px 11px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s}
.ct-back:hover,.ct-reset:hover,.ct-edit-btn:hover{border-color:var(--primary);color:var(--primary)}
.ct-breadcrumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px}
.ct-breadcrumb span{background:var(--border);color:var(--muted);padding:2px 8px;border-radius:5px;font-size:11px}
.ct-lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:12px}
.ct-say{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.9;color:var(--text);white-space:pre-wrap;margin-bottom:10px}
.ct-reactions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.ct-rbtn{padding:10px 18px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;text-align:left}
.ct-rbtn:hover{border-color:var(--primary);background:var(--primary-l);color:var(--primary);transform:translateY(-1px)}
.ct-end-banner{text-align:center;font-size:22px;font-weight:800;padding:18px;border-radius:12px;margin-bottom:14px;border:2px solid}
.ct-end-banner.won{background:#d1fae5;color:#065f46;border-color:#10b981}
.ct-end-banner.doc{background:#dbeafe;color:#1e40af;border-color:#3b82f6}
.ct-end-banner.cb{background:#fef3c7;color:#92400e;border-color:#f59e0b}
.ct-end-banner.hold{background:#f3f4f6;color:#374151;border-color:#9ca3af}
.ct-end-banner.decline{background:#fee2e2;color:#991b1b;border-color:#f87171}
.ct-memo-ta{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;line-height:1.7;min-height:80px;resize:vertical;font-family:inherit;margin-bottom:9px}
.ct-memo-ta:focus{outline:none;border-color:var(--primary)}
.ct-memo-save{padding:9px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px;font-family:inherit}
/* edit mode */
.ct-edit-hd{display:flex;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ct-back-play{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.ct-reset-tree{padding:7px 14px;border-radius:8px;border:1px solid #fca5a5;background:transparent;color:#dc2626;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.ct-node-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ct-node-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ct-node-id{font-size:11px;font-weight:800;color:var(--muted);background:var(--border);padding:2px 8px;border-radius:5px;font-family:monospace}
.ct-root-chip{font-size:10px;font-weight:800;background:#dbeafe;color:#1e40af;padding:2px 7px;border-radius:5px}
.ct-end-chip{font-size:10px;font-weight:800;background:#d1fae5;color:#065f46;padding:2px 7px;border-radius:5px}
.ct-node-ta{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;line-height:1.7;resize:vertical;font-family:inherit}
.ct-node-ta:focus,.ct-react-inp:focus,.ct-react-sel:focus{outline:none;border-color:var(--primary)}
.ct-react-row{display:flex;gap:5px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.ct-react-inp{flex:1;min-width:100px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit}
.ct-arrow{color:var(--muted);font-size:13px;flex-shrink:0}
.ct-react-sel{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;max-width:160px}
.ct-del-react{padding:4px 8px;border:1px solid #fca5a5;border-radius:6px;background:transparent;color:#dc2626;font-size:11px;cursor:pointer;font-family:inherit;flex-shrink:0}
.ct-add-react{display:block;width:100%;padding:6px;border:1px dashed var(--border);border-radius:7px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;margin:4px 0 10px;text-align:center}
.ct-save-node{padding:6px 16px;background:var(--primary);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="hdr">
  <div style="flex:1">
    <h1>📋 営業CRMリスト</h1>
  </div>
  <button class="btn-refresh" onclick="loadData()" title="再読込">🔄</button>
  <button class="btn-vfy btn-vfy-off" id="btn-vfy" onclick="toggleVerifyMode()" title="住所・代表者を確認する（hibiki用）">🔍 住所チェック</button>
  <button class="btn-add" onclick="openImp()" style="background:rgba(255,255,255,.12);">📥 インポート</button>
  <button class="btn-add" onclick="exportDmCsv()" style="background:rgba(255,255,255,.12);" title="今の絞り込み結果をDM発送用CSVで保存">📤 DM用CSV</button>
  <button class="btn-add" id="btn-discover" onclick="openDiscover()" style="display:none;background:rgba(255,255,255,.22)">🔍 発掘</button>
  <button class="btn-add" onclick="openAdd()">＋ 追加</button>
  <span class="u-chip" id="u-chip" onclick="doLogout()" title="クリックでログアウト"></span>
</div>

<div class="stats" id="stats"></div>
<div class="vfy-bar" id="vfy-bar">
  <span class="vfy-count" id="vfy-count">確認済 0 / 0 社</span>
  <div class="vfy-prog"><div class="vfy-fill" id="vfy-fill" style="width:0%"></div></div>
  <span style="font-size:11px;color:var(--muted)">全部確認できたら管理者がDM郵送済にしてください</span>
</div>
<div class="segbar" id="segbar"></div>

<div class="fbar">
  <input type="text" id="q" placeholder="会社名・代表者・電話番号で検索..." oninput="renderList()">
  <select id="fi" onchange="renderList()"><option value="">業種: 全て</option></select>
  <select id="fc" onchange="renderList()"><option value="">市区町村: 全て</option></select>
  <select id="fr" onchange="renderList()">
    <option value="">周年ランク: 全て</option>
    <option value="S">S（最優先）</option>
    <option value="A">A</option>
    <option value="B">B</option>
    <option value="C">C</option>
  </select>
  <div class="flt-grp">
    <span class="lbl">状態:</span>
    <button class="ftgl" data-flt="written"  onclick="toggleFlt('written')">✏️ 作文済</button>
    <button class="ftgl" data-flt="made"     onclick="toggleFlt('made')">✅ 制作済</button>
    <button class="ftgl" data-flt="ltr_sent" onclick="toggleFlt('ltr_sent')">📬 お渡し済</button>
    <button class="ftgl" data-flt="dm_ready" onclick="toggleFlt('dm_ready')">📋 DM準備済</button>
    <button class="ftgl" data-flt="dm"       onclick="toggleFlt('dm')">📮 DM郵送済</button>
    <button class="ftgl" data-flt="none"     onclick="toggleFlt('none')">未着手</button>
    <button class="ftgl" data-flt="my_calls" onclick="toggleFlt('my_calls')" style="border-color:#7c3aed">📞 自分の担当</button>
    <button class="ftgl" data-flt="unassigned" onclick="toggleFlt('unassigned')" style="color:var(--muted)">🔀 未割当</button>
    <button class="ftgl" data-flt="letter_top30" onclick="toggleFlt('letter_top30')" style="border-color:#059669">✉️ 手紙候補30社</button>
  </div>  <select id="fs" onchange="renderList()">
    <option value="">並べ替え: デフォルト</option>
    <option value="rank">ランク順</option>
    <option value="years_asc">周年年数（少→多）</option>
    <option value="years_desc">周年年数（多→少）</option>
    <option value="name">会社名順</option>
    <option value="nextdate">次回フォロー日順</option>
  </select>
</div>

<div class="lwrap" id="lwrap"><div class="empty">読み込み中...</div></div>

<!-- login overlay -->
<div class="login-ovl" id="login-ovl" style="display:none">
  <div class="login-box">
    <h2>📋 CRMログイン</h2>
    <p class="login-sub">ユーザー名とパスワードを入力してください</p>
    <input class="l-inp" id="l-name" placeholder="ユーザー名" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('l-pass').focus()">
    <input class="l-inp" id="l-pass" placeholder="パスワード" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="l-btn" onclick="doLogin()">ログイン</button>
    <div class="l-err" id="l-err">ユーザー名またはパスワードが違います</div>
  </div>
</div>

<!-- bulk action bar -->
<div class="bulk-bar" id="bulk-bar">
  <span class="bulk-prog" id="dm-progress">未配布 0 / 全0社</span>

function foundYear(c) {
  const s = (c.founding_date||'') + ' ' + (c.established_date||'');
  const m = s.match(/(19|20)\d{2}/);
  return m ? parseInt(m[0],10) : null;
}
function empNum(c) {
  const s = String(c.employees||'').replace(/[０-９]/g, d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0));
  const m = s.match(/\d+/);
  return m ? parseInt(m[0],10) : null;
}
function segsOf(c) {
  const out = [];
  const fy = foundYear(c), age = fy ? THIS_YEAR - fy : null;
  const rank = c.anniversary_rank||c.ar||'';
  const emp = empNum(c);
  if ((age!==null && age>=10 && (age%5===0 || (age+1)%5===0)) || ['S','A','B'].includes(rank)) out.push('shiki');

  return out;
}

let convoHistory = [], convoTreeMode = 'play';

function getConvoTree() {
  const key = CONVO_KEYS[curScr] || CONVO_KEYS.tree1;
  const def = CONVO_DEFAULTS[curScr] || CONVO_DEFAULTS.tree1;
  try { const s=localStorage.getItem(key); return s?JSON.parse(s):JSON.parse(JSON.stringify(def)); } catch { return JSON.parse(JSON.stringify(def)); }
}
function putConvoTree(t) {
  const key = CONVO_KEYS[curScr] || CONVO_KEYS.tree1;
  try { localStorage.setItem(key, JSON.stringify(t)); } catch {}
}
function sayText(text) {
  const name = cur?.ceo_name || cur?.ceo || '担当者様';
  const city = cur?.city || '御社エリア';
  const industry = cur?.industry || '御社の業界';
  return (text||'')
    .replace(/\{\{代表者\}\}/g, name)
    .replace(/\{\{市区町村\}\}/g, city)
    .replace(/\{\{業種\}\}/g, industry);
}

function renderConvoTree() {
  const tree = getConvoTree();
  const b = document.getElementById('mbody');
  if (!b) return;

  const treeTabs = `<div class="stabs">${Object.keys(CONVO_NAMES).map(k=>`<button class="stab ${k===curScr?'on':''}" onclick="setScrTab('${k}')">${CONVO_NAMES[k]}</button>`).join('')}</div>`;

  if (convoTreeMode === 'edit') {
    const allIds = Object.keys(tree.nodes);
    const nodeCards = Object.values(tree.nodes).map(node=>`
      <div class="ct-node-card">
        <div class="ct-node-hd">
          <span class="ct-node-id">${esc(node.id)}</span>
          ${node.id===tree.rootId?'<span class="ct-root-chip">▶ スタート</span>':''}
          ${node.isEnd?`<span class="ct-end-chip">${esc(node.endLabel||'END')}</span>`:''}
        </div>
        <div class="ct-lbl">💬 あなたの言葉</div>
        <textarea class="ct-node-ta" id="ctsay-${esc(node.id)}" rows="3">${esc(node.say)}</textarea>
        ${!node.isEnd?`
          <div class="ct-lbl">相手のリアクション</div>
          ${node.reactions.map((r,i)=>`
            <div class="ct-react-row">
              <input class="ct-react-inp" id="ctrl-${esc(node.id)}-${i}" value="${esc(r.label)}" placeholder="リアクション">
              <span class="ct-arrow">→</span>
              <select class="ct-react-sel" id="ctrs-${esc(node.id)}-${i}">
                ${allIds.map(nid=>`<option value="${esc(nid)}" ${r.next===nid?'selected':''}>${esc(nid)}</option>`).join('')}
              </select>
              <button class="ct-del-react" onclick="convoDelReact('${esc(node.id)}',${i})">✕</button>
            </div>
          `).join('')}
          <button class="ct-add-react" onclick="convoAddReact('${esc(node.id)}')">＋ リアクション追加</button>
        `:''}
        <button class="ct-save-node" onclick="convoSaveNode('${esc(node.id)}')">💾 このノードを保存</button>
      </div>`).join('');
    b.innerHTML = treeTabs + `
      <div class="ct-edit-hd">
        <button class="ct-back-play" onclick="convoTreeMode='play';convoHistory=[];renderConvoTree()">← プレイに戻る</button>
        <button class="ct-reset-tree" onclick="convoResetTree()">🔄 デフォルトに戻す</button>
      </div>${nodeCards}`;
    return;
  }

  // ── PLAY MODE ──
  const nodeId = convoHistory.length ? convoHistory[convoHistory.length-1] : tree.rootId;
  const node = tree.nodes[nodeId];
  if (!node) { b.innerHTML=treeTabs+'<div class="empty">ノードが見つかりません</div>'; return; }

  const isEnd = node.isEnd || !node.reactions.length;
  const step = convoHistory.length;

  const crumbs = convoHistory.slice(0,-1).map((id,idx)=>{
    const n=tree.nodes[id], nextId=convoHistory[idx+1];
    const r=n?.reactions?.find(r=>r.next===nextId);
    return `<span>${esc(r?.label||nextId)}</span>`;
  });
  const breadcrumb = crumbs.length ? `<div class="ct-breadcrumb">${crumbs.join('<span style="color:var(--muted)">→</span>')}</div>` : '';

  const todayNote = (cur?.source_data?.convo_notes||[]).find(n=>n.date===today);
  const existingMemo = todayNote?.memo||'';

  const nodeSay = sayText(node.say);
  const content = isEnd ? `
    <div class="ct-end-banner ${node.endCls||''}">${esc(node.endLabel||'終了')}</div>
    <div class="ct-lbl">💬 最後の一言</div>
    <div class="ct-say">${esc(nodeSay)}</div>
    <div class="ct-lbl">📝 この会社のメモ（今日）</div>
    <textarea class="ct-memo-ta" id="ct-memo" placeholder="例: 担当者名、折り返し日時、要望など...">${esc(existingMemo)}</textarea>
    <button class="ct-memo-save" onclick="convoSaveMemo()">💾 保存</button>
  ` : `
    <div class="ct-lbl">💬 あなたの言葉</div>
    <div class="ct-say">${esc(nodeSay)}</div>
    <div class="ct-lbl">相手のリアクションを選んでください</div>
    <div class="ct-reactions">${node.reactions.map(r=>`<button class="ct-rbtn" onclick="convoNext('${esc(r.next)}')">${esc(r.label)}</button>`).join('')}</div>
  `;

  b.innerHTML = treeTabs + `
    <div class="ct-header">
      <span class="ct-step">Step ${step+1}</span>
      <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
        ${step>0?`<button class="ct-back" onclick="convoBack()">← 戻る</button>`:''}
        <button class="ct-reset" onclick="convoReset()">🔄 最初から</button>
        <button class="ct-edit-btn" onclick="convoTreeMode='edit';renderConvoTree()">✏️ 編集</button>
      </div>
    </div>
    ${breadcrumb}${content}`;
}

function convoNext(nodeId) { convoHistory.push(nodeId); renderConvoTree(); }
function convoBack()       { convoHistory.pop();         renderConvoTree(); }
function convoReset()      { convoHistory=[];             renderConvoTree(); }

async function convoSaveMemo() {
  if (!cur) return;
  const memo = document.getElementById('ct-memo')?.value||'';
  const tree = getConvoTree();
  const nodeId = convoHistory[convoHistory.length-1];
  const node = tree.nodes[nodeId];
  const src = {...(cur.source_data||{})};
  const entry = {date:today, outcome:node?.endLabel||'終了', path:[...convoHistory], memo};
  src.convo_notes = [...(src.convo_notes||[]).filter(n=>n.date!==today), entry];
  const {error} = await sb.from('ceremony_attacks').update({source_data:src}).eq('id',cur.id);
  if (error) { toast('❌ 保存失敗: '+error.message); return; }
  cur.source_data=src;
  const idx=cos.findIndex(x=>x.id===cur.id); if (idx>=0) cos[idx].source_data=src;
  toast('✅ メモを保存しました');
}

function convoSaveNode(nodeId) {
  const tree = getConvoTree();
  const node = tree.nodes[nodeId];
  if (!node) return;
  node.say = document.getElementById('ctsay-'+nodeId)?.value ?? node.say;
  if (!node.isEnd) {
    node.reactions = node.reactions.map((r,i)=>({
      label: document.getElementById('ctrl-'+nodeId+'-'+i)?.value ?? r.label,
      next:  document.getElementById('ctrs-'+nodeId+'-'+i)?.value ?? r.next,
    }));
  }
  putConvoTree(tree);
  toast('✅ 保存しました（全社に反映）');
  renderConvoTree();
}

function convoDelReact(nodeId, idx) {
  const tree = getConvoTree();
  if (!tree.nodes[nodeId]) return;
  tree.nodes[nodeId].reactions.splice(idx, 1);
  putConvoTree(tree);
  renderConvoTree();
}

function convoAddReact(nodeId) {
  const tree = getConvoTree();
  if (!tree.nodes[nodeId]) return;
  tree.nodes[nodeId].reactions.push({label:'新しいリアクション', next: tree.rootId});
  putConvoTree(tree);
  renderConvoTree();
}

let impParsed = {news:[], conflicts:[]};
const IMP_COLS = ['company_name','phone','website','ceo_name','industry','city','anniversary_rank','anniversary_years','postal_code','address','founding_date','employees','email'];
const IMP_LABS = {company_name:'会社名',phone:'電話番号',website:'ウェブサイト',ceo_name:'代表者名',industry:'業種',city:'市区町村',anniversary_rank:'周年ランク',anniversary_years:'周年年数',postal_code:'郵便番号',address:'住所',founding_date:'創業年',employees:'従業員数',email:'メール'};
// ヘッダー行があれば列名で自動対応（県の建設業許可業者名簿などをそのまま貼れる）
const IMP_ALIASES = [
  ['company_name', /会社名|商号|名称|company|name/i],
  ['phone',        /電話|tel|phone/i],
  ['website',      /web|url|ホームページ|hp|サイト/i],
  ['ceo_name',     /代表者|代表|社長|ceo/i],
  ['industry',     /業種|許可業種|業態|industry/i],
  ['city',         /市区町村|市町村|city/i],
  ['anniversary_rank',  /ランク|rank/i],
  ['anniversary_years', /周年年数|周年|years/i],
  ['postal_code',  /郵便番号|〒|zip|postal/i],
  ['address',      /住所|所在地|address/i],
  ['founding_date',/創業|設立|許可年月日|founded|established/i],
  ['employees',    /従業員|社員数|人数|employees/i],
  ['email',        /メール|mail/i],
];
function mapHeader(row) {
  const map = [];
  const used = new Set();
  row.forEach((h,i)=>{
    const hit = IMP_ALIASES.find(([k,re])=>!used.has(k) && re.test(h||''));
    map[i] = hit ? hit[0] : null;
    if (hit) used.add(hit[0]);
  });
  return map;
}

function onImpFile(input) {
  const f = input.files?.[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => { document.getElementById('imp-csv').value = e.target.result; };
  r.readAsText(f, 'utf-8');
}

function parseCSVLine(line) {
  const res=[]; let cur='', inQ=false;
  for (let i=0;i<line.length;i++) {
    const ch=line[i];
    if (ch==='"') { inQ=!inQ; }
    else if (ch===','&&!inQ) { res.push(cur.trim()); cur=''; }
    else { cur+=ch; }
  }
  res.push(cur.trim());
  return res;
}

function isHeaderRow(row) {
  const first=(row[0]||'').toLowerCase();
  // 「株式会社〇〇」を見出し行と誤認しないよう、完全一致に近い判定にする
  if (['会社名','商号','名称','company','company_name','名前','name'].includes(first)) return true;
  // 半分以上のセルが列名っぽければヘッダー扱い
  const hits = row.filter(h=>IMP_ALIASES.some(([,re])=>re.test(h||''))).length;
  return row.length>=2 && hits>=Math.ceil(row.length/2);
}

function parseImport() {
  const raw = (document.getElementById('imp-csv')?.value||'').trim();
  if (!raw) { toast('❌ CSVを入力してください'); return; }
  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  let startIdx = 0, hmap = null;
  const firstRow = parseCSVLine(lines[0]);
  if (isHeaderRow(firstRow)) { startIdx = 1; hmap = mapHeader(firstRow); }
  if (hmap && !hmap.includes('company_name')) { toast('❌ ヘッダーに「会社名/商号/名称」の列が見つかりません'); return; }

  const news=[], conflicts=[];
  for (let i=startIdx;i<lines.length;i++) {
    const cols = parseCSVLine(lines[i]);
    const row = {};
    if (hmap) hmap.forEach((k,j)=>{ const v=(cols[j]||'').trim(); if (k && v) row[k]=v; });
    else IMP_COLS.forEach((k,j)=>{ const v=cols[j]||''; if (v) row[k]=v; });
    if (!row.company_name) continue;
    if (row.postal_code) row.postal_code = row.postal_code.replace(/[〒\s]/g,'').replace(/^(\d{3})(\d{4})$/,'$1-$2');
    if (!row.city && row.address) { const cty=cityFromAddress(row.address); if (cty) row.city=cty; }

    const existing = cos.find(c=>{
      if (row.company_name && c.company_name===row.company_name) return true;
      if (row.phone && c.phone && c.phone===row.phone) return true;
      return false;
    });

    if (!existing) {
      news.push(row);
    } else {
      const diffs = IMP_COLS.filter(k=>{
        const nv=(row[k]||'').trim();
        const ov=(existing[k]||'').toString().trim();
        return nv && nv!==ov;
      });
      conflicts.push({existing, incoming:row, diffs, chosen:{}});
    }
  }

  impParsed = {news, conflicts};
  conflicts.forEach(cf=>{
    cf.diffs.forEach(k=>{ cf.chosen[k]='new'; });
  });
  renderImpStep2();
}

function renderImpStep2() {
  const {news, conflicts} = impParsed;
  const total = news.length + conflicts.length;
  if (!total) { toast('❌ 新規・重複ともに0件でした'); return; }

  let html = `
    <button class="imp-back" onclick="document.getElementById('imp-body').innerHTML=renderImpStep1()">← 戻る</button>
    <div class="imp-summary">
      <div class="ichip ichip-n">✅ 新規 ${news.length}件</div>
      <div class="ichip ichip-d">⚠️ 重複 ${conflicts.length}件</div>
    </div>`;

  if (news.length) {
    html += `<div class="imp-sec">新規追加（${news.length}件）</div>
    <div class="new-list">
      ${news.map(r=>`<div class="new-item">
        <span>${esc(r.company_name)}</span>
        ${r.phone?`<span style="color:var(--muted);font-size:11px;">${esc(r.phone)}</span>`:''}
        ${r.industry?`<span style="color:var(--muted);font-size:11px;">${esc(r.industry)}</span>`:''}
      </div>`).join('')}
    </div>`;
  }

  if (conflicts.length) {
    html += `<div class="imp-sec">重複（差分あり）— どちらの情報を使うか選択してください（${conflicts.length}件）</div>`;
    html += conflicts.map((cf,idx)=>{
      const fields = cf.diffs.map(k=>{
        const ov=esc(cf.existing[k]||'-');
        const nv=esc(cf.incoming[k]||'-');
        const selE=cf.chosen[k]==='existing'?'sel':'';
        const selN=cf.chosen[k]==='new'?'sel':'';
        return `<div class="cfield">
          <div class="cfield-lbl">${IMP_LABS[k]||k}</div>
          <div>
            <div class="cfield-head">現在の値</div>
            <div class="cv ${selE}" onclick="pickField(${idx},'${k}','existing')">${ov}</div>
          </div>
          <div>
            <div class="cfield-head">新しい値</div>
            <div class="cv ${selN}" onclick="pickField(${idx},'${k}','new')">${nv}</div>
          </div>
        </div>`;
      }).join('');
      const sameFields = IMP_COLS.filter(k=>!cf.diffs.includes(k)&&cf.existing[k]);
      const sameHtml = sameFields.length ? sameFields.map(k=>`<div class="cfield">
        <div class="cfield-lbl">${IMP_LABS[k]||k}</div>
        <div class="cv-same" style="grid-column:2/4">同じ: ${esc(cf.existing[k])}</div>
      </div>`).join('') : '';
      return `<div class="conflict-card" id="ccf-${idx}">
        <div class="conflict-hd">
          <span>${esc(cf.existing.company_name)}</span>
          <span class="cbadge">${cf.diffs.length}項目差分</span>
        </div>
        ${fields}${sameHtml}
      </div>`;
    }).join('');
  }

  html += `<div class="imp-acts">
    ${news.length?`<button class="iact iact-new" onclick="doImpNew()">✅ 新規${news.length}件だけ追加</button>`:''}
    ${conflicts.length?`<button class="iact iact-all" onclick="doImpAll()">💾 新規＋重複を反映</button>`:''}
    <button class="iact iact-can" onclick="closeImp()">キャンセル</button>
  </div>`;

  document.getElementById('imp-body').innerHTML = html;
}

function pickField(idx, key, side) {
  impParsed.conflicts[idx].chosen[key] = side;
  const card = document.getElementById('ccf-'+idx);
  if (!card) return;
  card.querySelectorAll('.cfield').forEach(row=>{
    const lbl = row.querySelector('.cfield-lbl');
    if (!lbl) return;
    const k = Object.entries(IMP_LABS).find(([,v])=>v===lbl.textContent)?.[0];
    if (!k) return;
    const [leftEl, rightEl] = [...row.querySelectorAll('.cv')];
    if (leftEl) leftEl.classList.toggle('sel', impParsed.conflicts[idx].chosen[k]==='existing');
    if (rightEl) rightEl.classList.toggle('sel', impParsed.conflicts[idx].chosen[k]==='new');
  });
}

async function doImpNew() {
  const {news} = impParsed;
  if (!news.length) return;
  const rows = news.map(r=>({...r, phase:'pending'}));
  const {data,error} = await sb.from('ceremony_attacks').insert(rows).select();
  if (error) { toast('❌ 追加失敗: '+error.message); return; }
  if (data) data.forEach(d=>cos.push(d));
  buildFilters(); renderStats(); renderList();
  toast(`✅ ${news.length}件を追加しました`);
  closeImp();
}

async function doImpAll() {
  const {news, conflicts} = impParsed;
  let added=0, updated=0, errs=[];

  if (news.length) {
    const rows = news.map(r=>({...r, phase:'pending'}));
    const {data,error} = await sb.from('ceremony_attacks').insert(rows).select();
    if (error) errs.push(error.message);
    else { data.forEach(d=>cos.push(d)); added=data.length; }
  }

  for (const cf of conflicts) {
    const upd = {};
    cf.diffs.forEach(k=>{
      if (cf.chosen[k]==='new') upd[k] = cf.incoming[k]||null;
    });
    if (!Object.keys(upd).length) continue;
    const {error} = await sb.from('ceremony_attacks').update(upd).eq('id',cf.existing.id);
    if (error) errs.push(error.message);
    else { Object.assign(cf.existing, upd); updated++; }
  }

  buildFilters(); renderStats(); renderList();
  if (errs.length) { toast('⚠️ 一部エラー: '+errs[0]); }
  else { toast(`✅ 追加${added}件、更新${updated}件 完了`); }
  closeImp();
}

async function loadData() {
  document.getElementById('lwrap').innerHTML = '<div class="empty">読み込み中...</div>';
  const PAGE = 1000;
  let all = [], page = 0;
  while (true) {
    const {data, error} = await sb.from('ceremony_attacks')
      .select('*')
      .range(page * PAGE, (page + 1) * PAGE - 1);
    if (error) { document.getElementById('lwrap').innerHTML = '<div class="empty">❌ 読み込みエラー: '+esc(error.message)+'</div>'; return; }
    if (data && data.length > 0) all = all.concat(data);
    if (!data || data.length < PAGE) break;
    page++;
  }
  cos = all;
  buildFilters();
  renderStats();
  renderList();
}

function getRows() {
  const q   = document.getElementById('q').value.toLowerCase();
  const fi  = document.getElementById('fi').value;
  const fc  = document.getElementById('fc').value;
  const fr  = document.getElementById('fr').value;
  const fs  = document.getElementById('fs')?.value||'';
  let rows = cos.filter(c=>{
    const industry = c.industry||c.i||'';
    const city     = c.city||c.c||'';
    const rank     = c.anniversary_rank||c.ar||'';
    if (fi && industry!==fi) return false;
    if (fc && city!==fc) return false;
    if (fr && rank!==fr) return false;
    if (curSeg!=='all') {
      const s = segsOf(c);
      if (curSeg==='none') { if (s.length) return false; }
      else if (!s.includes(curSeg)) return false;
    }
    if (curF==='today') {
      if (!c.next_date||c.next_date>today||c.phase==='declined'||c.phase==='won') return false;
    } else if (curF!=='all') {
      if (c.phase!==curF) return false;
    }
    if (activeFlt.size > 0) {
      const ltr = getLetter(c.id);
      const sd  = c.source_data||{};

      }

      }
      if (activeFlt.has('letter_top30')) {
        if (!sd.dm_mailed || ltr.sent) return false;
      }
      // OR filters
      const orFlt = [...activeFlt].filter(k => !AND_FLTS.has(k));
      if (orFlt.length > 0) {
        if (orFlt.includes('none')) {
          if (ltr.written||ltr.made||ltr.sent||sd.dm_ready||sd.dm_mailed) return false;
        } else {
          let match = false;
          if (activeFlt.has('written')  && ltr.written)   match = true;
          if (activeFlt.has('made')     && ltr.made)       match = true;
          if (activeFlt.has('ltr_sent') && ltr.sent)       match = true;
          if (activeFlt.has('dm_ready') && sd.dm_ready)    match = true;
          if (activeFlt.has('dm')       && sd.dm_mailed)   match = true;
          if (!match) return false;
        }
      }
    }
    if (q) {
      const h = ((c.company_name||'')+' '+(c.ceo_name||'')+' '+(c.phone||'')+' '+(c.city||'')).toLowerCase();
      if (!h.includes(q)) return false;
    }
    return true;
  });
  const ro={S:0,A:1,B:2,C:3,'':4};
  const po={pending_callback:0,contacted:1,mailed:2,pending:3,won:4,declined:5};
  if (fs==='rank') {
    rows.sort((a,b)=>{
      const ra=ro[a.anniversary_rank||a.ar]??99, rb=ro[b.anniversary_rank||b.ar]??99;
      return ra-rb || (a.company_name||'').localeCompare(b.company_name||'','ja');
    });
  } else if (fs==='years_asc') {
    rows.sort((a,b)=>(a.anniversary_years||a.ay||9999)-(b.anniversary_years||b.ay||9999));
  } else if (fs==='years_desc') {
    rows.sort((a,b)=>(b.anniversary_years||b.ay||0)-(a.anniversary_years||a.ay||0));
  } else if (fs==='name') {
    rows.sort((a,b)=>(a.company_name||'').localeCompare(b.company_name||'','ja'));
  } else if (fs==='nextdate') {
    rows.sort((a,b)=>{
      const da=a.next_date||'9999', db=b.next_date||'9999';
      return da<db?-1:da>db?1:0;
    });
  } else {
    rows.sort((a,b)=>{
      const at=(a.next_date&&a.next_date<=today&&a.phase!=='declined'&&a.phase!=='won')?0:1;
      const bt=(b.next_date&&b.next_date<=today&&b.phase!=='declined'&&b.phase!=='won')?0:1;
      if (at!==bt) return at-bt;
      const pa=po[a.phase]??99, pb=po[b.phase]??99;
      if (pa!==pb) return pa-pb;
      const ra=ro[a.anniversary_rank||a.ar]??99, rb=ro[b.anniversary_rank||b.ar]??99;
      return ra-rb;
    });
  }
  // 手紙候補30社: override sort by rank, limit to 30
  if (activeFlt.has('letter_top30')) {
    rows.sort((a,b)=>{
      const ra=ro[a.anniversary_rank||a.ar]??99, rb=ro[b.anniversary_rank||b.ar]??99;
      return ra-rb||(a.company_name||'').localeCompare(b.company_name||'','ja');
    });
    rows = rows.slice(0, 30);
  }
  return rows;
}

function updateBulkBar() {
  const n = cos.filter(c=>{const sd=c.source_data||{}; return sd.dm_ready && !sd.dm_mailed;}).length;
  const unmailed = cos.filter(c=>!(c.source_data||{}).dm_mailed).length;
  const bar = document.getElementById('bulk-bar');
  const cnt = document.getElementById('bulk-cnt');
  const prog = document.getElementById('dm-progress');
  const btn300 = document.getElementById('btn-auto300');
  if (!can('admin') || !cos.length) { if (bar) bar.style.display='none'; return; }
  if (bar) bar.style.display='flex';
  if (cnt) cnt.textContent = n;
  if (prog) prog.textContent = `未配布 ${unmailed} / 全${cos.length}社`;
  if (btn300) btn300.style.display = unmailed > 0 ? '' : 'none';
}

function openModal(id) {
  cur = cos.find(c=>String(c.id)===String(id));
  if (!cur) return;
  curTab='action';
  document.getElementById('m-name').textContent = cur.company_name;
  document.getElementById('ovl').classList.add('open');
  document.querySelectorAll('.mtab').forEach((el,i)=>el.classList.toggle('on',i===0));
  renderTab();
}

function closeModal(e) {
  if (e && e.target!==document.getElementById('ovl')) return;
  document.getElementById('ovl').classList.remove('open');
  cur=null;
}

function switchTab(t) {
  curTab=t;

  document.querySelectorAll('.mtab').forEach((el,i)=>el.classList.toggle('on',order[i]===t));
  renderTab();
}

// ── ACTIONS ───────────────────────────────────────────
async function doAct(key) {
  if (!can('action')) { toast('❌ 権限がありません'); return; }
  const c   = cur;
  const act = ACTS.find(a=>a.k===key);
  if (!act) return;
  const note = document.getElementById('act-note')?.value.trim()||'';
  const now  = new Date();
  const src  = {...(c.source_data||{})};
  const log  = [...(src.contact_log||[])];
  log.push({action:key, date:now.toISOString().slice(0,10), time:now.toTimeString().slice(0,5), note});
  src.contact_log = log;

  let nd = c.next_date||null;
  if (act.nd) {
    const d = new Date(); d.setDate(d.getDate()+act.days);
    nd = d.toISOString().slice(0,10);
  }

  const upd = {phase:act.phase, source_data:src, next_date:nd};
  const {error} = await sb.from('ceremony_attacks').update(upd).eq('id',c.id);
  if (error) { toast('❌ 保存失敗: '+error.message); return; }
  Object.assign(c, upd);
  const idx=cos.findIndex(x=>x.id===c.id); if (idx>=0) Object.assign(cos[idx],upd);
  const el=document.getElementById('act-note'); if (el) el.value='';
  if (document.getElementById('nd-inp')) document.getElementById('nd-inp').value=nd||'';
  renderStats(); renderList();
  toast('✅ '+act.lab+' を記録しました');
}

async function saveNd() {
  const nd = document.getElementById('nd-inp')?.value||null;
  const {error} = await sb.from('ceremony_attacks').update({next_date:nd}).eq('id',cur.id);
  if (error) { toast('❌ 保存失敗'); return; }
  cur.next_date=nd;
  const idx=cos.findIndex(x=>x.id===cur.id); if (idx>=0) cos[idx].next_date=nd;
  renderStats(); renderList();
  toast('📅 次回フォロー日を保存しました');
}

async function saveInfoFields() {
  if (!can('admin')) { toast('❌ 権限がありません'); return; }
  const g = id => (document.getElementById(id)?.value||'').trim();
  let pc = g('ie-pc').replace(/[〒\s]/g,'').replace(/^(\d{3})(\d{4})$/,'$1-$2');
  const ayRaw = g('ie-ay');
  const arVal = document.getElementById('ie-ar')?.value||null;
  const cn = g('ie-cn');
  const upd = {
    postal_code:       pc||null,
    address:           g('ie-ad')||null,
    founding_date:     g('ie-fd')||null,
    employees:         g('ie-em')||null,
    ceo_name:          g('ie-ceo')||null,
    anniversary_years: ayRaw ? parseInt(ayRaw, 10) : null,
    anniversary_basis: g('ie-ab')||null,
    anniversary_rank:  arVal||null,
  };
  if (cn) { const sd={...(cur.source_data||{})}; sd.corporate_number=cn; upd.source_data=sd; }
  if (!cur.city && upd.address) { const cty=cityFromAddress(upd.address); if (cty) upd.city=cty; }
  const {error} = await sb.from('ceremony_attacks').update(upd).eq('id',cur.id);
  if (error) { toast('❌ 保存失敗: '+error.message); return; }
  Object.assign(cur, upd);
  const idx=cos.findIndex(x=>x.id===cur.id); if (idx>=0) Object.assign(cos[idx],upd);
  buildFilters(); renderSegBar(); renderList(); renderTab();
  toast('✅ 宛先・情報を保存しました');
}

async function markDmReady(flag) {
  if (!cur) return;
  if (!can('dm_ready')) { toast('❌ 権限がありません'); return; }
  const src = {...(cur.source_data||{})};
  if (flag) { src.dm_ready = true; src.dm_ready_at = new Date().toISOString(); }
  else { delete src.dm_ready; delete src.dm_ready_at; }
  const {error} = await sb.from('ceremony_attacks').update({source_data:src}).eq('id',cur.id);
  if (error) { toast('❌ 保存失敗: '+error.message); return; }
  cur.source_data = src;

async function bulkMarkDmMailed() {
  if (!can('admin')) { toast('❌ 権限がありません'); return; }
  const targets = cos.filter(c=>{const sd=c.source_data||{}; return sd.dm_ready && !sd.dm_mailed;});
  if (!targets.length) { toast('DM準備済の会社がありません'); return; }
  if (!confirm(targets.length+'社をDM郵送済にしますか？\n（DM準備済フラグも解除、hibiki/meguに自動振り分け）')) return;
  const now = new Date().toISOString();
  let ok=0, errs=0;
  // Sort alphabetically for consistent assignment
  const sorted = [...targets].sort((a,b)=>(a.company_name||'').localeCompare(b.company_name||'','ja'));
  const ASSIGNEES = ['hibiki','megu'];
  let assignIdx = 0;
  for (const c of sorted) {
    const src = {...(c.source_data||{}), dm_mailed:true, dm_mailed_at:now};
    delete src.dm_ready; delete src.dm_ready_at;
    // Auto-assign only if not already assigned
    if (!src.call_assignee) {
      src.call_assignee = ASSIGNEES[assignIdx % ASSIGNEES.length];
      src.call_assigned_at = now;
      assignIdx++;
    }
    const {error} = await sb.from('ceremony_attacks').update({source_data:src}).eq('id',c.id);
    if (error) errs++;
    else { c.source_data=src; ok++; }
  }
  renderList(); updateBulkBar();
  const hibikiN = sorted.filter(c=>(c.source_data||{}).call_assignee==='hibiki').length;
  const meguN   = sorted.filter(c=>(c.source_data||{}).call_assignee==='megu').length;
  toast(errs
    ? `⚠️ ${ok}件完了、${errs}件失敗`
    : `📮 ${ok}社DM郵送済 → hibiki ${hibikiN}社 / megu ${meguN}社 に振り分けました`
  );
}

async function autoSelectNext300() {
  if (!can('admin')) { toast('❌ 権限がありません'); return; }
  const undelivered = cos.filter(c=>!(c.source_data||{}).dm_mailed);
  if (!undelivered.length) {
    toast('📮 全社への配布が完了しています'); return;
  }
  const ro2 = {S:0,A:1,B:2,C:3,'':4};
  const sorted = [...undelivered].sort((a,b)=>{
    const ra=ro2[a.anniversary_rank||a.ar]??99, rb=ro2[b.anniversary_rank||b.ar]??99;
    return ra-rb||(a.company_name||'').localeCompare(b.company_name||'','ja');
  });
  const top300 = sorted.slice(0, 300);
  const top300Ids = new Set(top300.map(c=>c.id));
  const toSet   = top300.filter(c=>!(c.source_data||{}).dm_ready);
  const toClear = cos.filter(c=>{const sd=c.source_data||{}; return sd.dm_ready && !sd.dm_mailed && !top300Ids.has(c.id);});
  if (!confirm(`上位${top300.length}社をDM準備済に選別します。\n追加: ${toSet.length}社 ／ 解除: ${toClear.length}社\n\n実行しますか？`)) return;
  const now = new Date().toISOString();
  let ok=0, errs=0;
  for (const c of toSet) {
    const src={...(c.source_data||{}), dm_ready:true, dm_ready_at:now};
    const {error}=await sb.from('ceremony_attacks').update({source_data:src}).eq('id',c.id);
    if (error) errs++; else { c.source_data=src; ok++; }
  }
  for (const c of toClear) {
    const src={...(c.source_data||{})};
    delete src.dm_ready; delete src.dm_ready_at;
    const {error}=await sb.from('ceremony_attacks').update({source_data:src}).eq('id',c.id);
    if (error) errs++; else { c.source_data=src; }
  }
  renderList(); updateBulkBar();
  toast(errs
    ? `⚠️ 選別完了（エラー${errs}件）`
    : `🎯 上位${top300.length}社を選別しました（残り未配布: ${undelivered.length-top300.length}社）`
  );
}

// ── 法人番号API ────────────────────────────────────────
const HOUJIN_EP = 'https://osipzwbsfbgbegjowydm.supabase.co/functions/v1/houjin-search';
let _houjinRes = [];

// ── 企業発掘 ──────────────────────────────────────────
let _discResults = [];
let _discSelected = new Set();
const CORP_KIND = {'301':'株式会社','302':'有限会社','303':'合名会社','304':'合資会社','305':'合同会社','399':'その他法人'};

function openDiscover() {
  if (!can('admin')) { toast('❌ 管理者のみ使用できます'); return; }
  document.getElementById('disc-ovl').classList.add('open');
}
function closeDiscover(e) {
  if (e && e.target !== document.getElementById('disc-ovl')) return;
  document.getElementById('disc-ovl').classList.remove('open');
  _discResults = []; _discSelected.clear();
  document.getElementById('disc-results').innerHTML = '';
  document.getElementById('disc-add-bar').style.display = 'none';
  document.getElementById('disc-progress').style.display = 'none';
}
function onDiscPrefChange() {
  const pref = document.getElementById('disc-pref').value;
  const sel = document.getElementById('disc-city-sel');
  const inp = document.getElementById('disc-city-inp');
  if (pref === '47') { sel.style.display=''; inp.style.display='none'; }
  else               { sel.style.display='none'; inp.style.display=''; }
}
async function startResearch() {
  const pref = document.getElementById('disc-pref').value;
  let cityCode = pref === '47'
    ? (document.getElementById('disc-city-sel').value || '')
    : ((document.getElementById('disc-city-inp')?.value||'').trim());
  const keyword = (document.getElementById('disc-kw')?.value||'').trim() || '株式会社';
  const limit = Math.min(30, Math.max(1, parseInt(document.getElementById('disc-limit')?.value||'30')||30));
  const address = cityCode
    ? (pref.padStart(2,'0') + cityCode.padStart(3,'0'))
    : pref.padStart(2,'0');
  const knownCNs = new Set(cos.map(c => c.source_data?.corporate_number).filter(Boolean));
  const progEl = document.getElementById('disc-progress');
  const progFill = document.getElementById('disc-prog-fill');
  const progText = document.getElementById('disc-prog-text');
  progEl.style.display = 'block';
  progFill.style.width = '0%';
  document.getElementById('disc-results').innerHTML = '';
  document.getElementById('disc-add-bar').style.display = 'none';
  _discResults = []; _discSelected.clear();
  let page = 1, totalPages = 99, collected = [];
  while (collected.length < limit && page <= totalPages && page <= 15) {
    progText.textContent = `取得中… ${collected.length}/${limit}社`;
    try {
      const r = await fetch(`${HOUJIN_EP}?address=${encodeURIComponent(address)}&keyword=${encodeURIComponent(keyword)}&page=${page}`);
      const d = await r.json();
      if (d.error) { toast('❌ ' + d.error + (d.detail ? '　' + d.detail.slice(0,80) : '')); break; }
      const corps = Array.isArray(d?.corporations?.corporation)
        ? d.corporations.corporation
        : (d?.corporations?.corporation ? [d.corporations.corporation] : []);
      const total = parseInt(d.count||'0')||0;
      const perPg = corps.length || 10;
      totalPages = total > 0 ? Math.ceil(total / perPg) : 1;
      if (!corps.length) break;
      for (const c of corps) {
        if (!c.corporateNumber) continue;
        if (knownCNs.has(c.corporateNumber)) continue;
        if (collected.find(x => x.corporateNumber === c.corporateNumber)) continue;
        collected.push(c);
        if (collected.length >= limit) break;
      }
      progFill.style.width = Math.min(100, Math.round(collected.length / limit * 100)) + '%';
      page++;
    } catch(err) { toast('❌ 通信エラー'); break; }
  }
  progEl.style.display = 'none';
  _discResults = collected;
  const resEl = document.getElementById('disc-results');
  if (!collected.length) {
    resEl.innerHTML = '<div class="disc-empty">該当する企業が見つかりませんでした。<br>キーワードや地域を変えて試してください。</div>';
    return;
  }
  _discSelected = new Set(collected.map(c => c.corporateNumber));
  renderDiscResults();
}
function renderDiscResults() {
  const el = document.getElementById('disc-results');
  el.innerHTML = `<div class="disc-result-hd">
      <span>${_discResults.length}社ヒット（既登録除外済）</span>
      <button class="disc-all-btn" onclick="discToggleAll()">全選択 / 全解除</button>
    </div>` +
    _discResults.map(c => {
      const addr = (c.prefectureName||'')+(c.cityName||'')+(c.streetNumber||'');
      const kind = CORP_KIND[c.kind]||'';
      const cn = c.corporateNumber||'';
      const on = _discSelected.has(cn);
      return `<div class="disc-card ${on?'disc-card-on':''}" onclick="toggleDiscCard('${cn}',this)">
        <input type="checkbox" class="disc-cb" ${on?'checked':''} onclick="event.stopPropagation()">
        <div class="disc-card-body">
          <span class="disc-cname">${esc(c.name||'')}</span>
          ${kind?`<span class="disc-ckind">${esc(kind)}</span>`:''}
          <span class="disc-caddr">${esc(addr)}</span>
          <span class="disc-ccn">法人番号: ${esc(cn)}</span>
        </div>
      </div>`;
    }).join('');
  document.getElementById('disc-add-bar').style.display = 'flex';
  updateDiscSelCount();
}
function discToggleAll() {
  if (_discSelected.size === _discResults.length) {
    _discSelected.clear();
  } else {
    _discSelected = new Set(_discResults.map(c => c.corporateNumber));
  }
  renderDiscResults();
}
function toggleDiscCard(cn, el) {
  if (_discSelected.has(cn)) { _discSelected.delete(cn); el.classList.remove('disc-card-on'); el.querySelector('.disc-cb').checked=false; }
  else { _discSelected.add(cn); el.classList.add('disc-card-on'); el.querySelector('.disc-cb').checked=true; }
  updateDiscSelCount();
}
function updateDiscSelCount() {
  document.getElementById('disc-sel-count').textContent = `${_discSelected.size}社選択中`;
}
async function addDiscovered() {
  if (!_discSelected.size) { toast('1社以上選択してください'); return; }
  const toAdd = _discResults.filter(c => _discSelected.has(c.corporateNumber));
  let added = 0, failed = 0;
  for (const c of toAdd) {
    const pc = (c.postCode||'').replace(/^(\d{3})(\d{4})$/, '$1-$2');
    const addr = (c.prefectureName||'')+(c.cityName||'')+(c.streetNumber||'');
    const city = (c.prefectureName||'')+(c.cityName||'');
    const row = {
      company_name: c.name||'（名称不明）',
      postal_code: pc||null,
      address: addr||null,
      city: city||null,
      phase: 'pending',
      source_data: {corporate_number: c.corporateNumber, discover_source:'houjin_api'},
    };
    const {data,error} = await sb.from('ceremony_attacks').insert(row).select().single();
    if (!error && data) { cos.push(data); added++; } else { failed++; }
  }
  buildFilters(); renderStats(); renderList();
  closeDiscover();
  toast(`✅ ${added}社を追加しました${failed?` (${failed}社失敗)`:''}`);
}

async function houjinSearch(mode) {
  const query = mode === 'add'
    ? (document.getElementById('an')?.value||'').trim()
    : (cur?.company_name||'');
  if (!query) { toast('❌ 会社名を入力してから検索してください'); return; }
  const stEl = document.getElementById(`houjin-${mode}-status`);
  const reEl = document.getElementById(`houjin-${mode}-results`);
  if (!stEl || !reEl) return;
  stEl.textContent = '🔄 検索中…';
  reEl.innerHTML = '';
  _houjinRes = [];
  try {
    const r = await fetch(`${HOUJIN_EP}?name=${encodeURIComponent(query)}`);
    const d = await r.json();
    if (d.error) { stEl.textContent = '❌ ' + d.error; return; }
    const list = d?.corporations?.corporation || [];
    _houjinRes = list;
    if (!list.length) { stEl.textContent = '該当なし'; return; }
    stEl.textContent = `${Math.min(list.length,10)}件ヒット`;
    reEl.innerHTML = list.slice(0,10).map((c,i) => {
      const addr = (c.prefectureName||'')+(c.cityName||'')+(c.streetNumber||'');
      return `<div class="houjin-row" onclick="houjinSelect('${mode}',${i})"><span class="houjin-rname">${esc(c.name||'')}</span><span class="houjin-raddr">${esc(addr)}</span><span class="houjin-rnum">${esc(c.corporateNumber||'')}</span></div>`;
    }).join('');
  } catch(e) {
    stEl.textContent = '❌ 通信エラー';
  }
}

function houjinSelect(mode, idx) {
  const c = _houjinRes[idx];
  if (!c) return;
  const addr = (c.prefectureName||'')+(c.cityName||'')+(c.streetNumber||'');
  const city = (c.prefectureName||'')+(c.cityName||'');
  const pc = (c.postCode||'').replace(/^(\d{3})(\d{4})$/,'$1-$2');
  if (mode === 'add') {
    if (c.name) document.getElementById('an').value = c.name;
    if (pc) document.getElementById('apc').value = pc;
    if (addr) document.getElementById('aad').value = addr;
    if (city) document.getElementById('acy').value = city;
    if (c.representativeName) document.getElementById('ac').value = c.representativeName;
    const cnEl = document.getElementById('acn'); if (cnEl && c.corporateNumber) cnEl.value = c.corporateNumber;
  } else {
    if (pc) document.getElementById('ie-pc').value = pc;
    if (addr) document.getElementById('ie-ad').value = addr;
    if (c.representativeName) document.getElementById('ie-ceo').value = c.representativeName;
    const cnEl = document.getElementById('ie-cn'); if (cnEl && c.corporateNumber) cnEl.value = c.corporateNumber;
  }
  const reEl = document.getElementById(`houjin-${mode}-results`);
  const stEl = document.getElementById(`houjin-${mode}-status`);
  if (reEl) reEl.innerHTML = '';
  if (stEl) stEl.textContent = '✅ 入力しました';
  toast('✅ ' + (c.name||'') + ' の情報を自動入力しました');
}

function esc(s) {
  if (s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600);
}

async function quickEditSave(id) {

  if (!c) return;
  const newAddr = document.getElementById('qe-addr-'+id)?.value.trim()||'';
  const newCeo  = document.getElementById('qe-ceo-'+id)?.value.trim()||'';
  const updates = {};
  if (newAddr) updates.address  = newAddr;
  if (newCeo)  updates.ceo_name = newCeo;
  const src = {...(c.source_data||{}), addr_verified: true, addr_verified_at: new Date().toISOString()};
  updates.source_data = src;
  const {error} = await sb.from('ceremony_attacks').update(updates).eq('id', id);
  if (error) { toast('❌ 保存失敗: '+error.message); return; }
  if (newAddr) c.address  = newAddr;
  if (newCeo)  c.ceo_name = newCeo;
  c.source_data = src;
  toast('💾 保存・確認済にしました');
  renderList();
}
