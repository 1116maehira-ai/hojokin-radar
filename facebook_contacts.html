<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook 友達申請 - TENOHIRA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .summary-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .summary-item .label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .contact-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .contact-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .contact-index {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .contact-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .contact-company {
            color: #667eea;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .contact-details {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .contact-details-row {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
        }

        .contact-details-label {
            color: #999;
            min-width: 60px;
            font-weight: 500;
        }

        .contact-details-value {
            flex: 1;
            word-break: break-all;
        }

        .contact-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-facebook {
            background: #1877f2;
            color: white;
        }

        .btn-facebook:hover {
            background: #0a66c2;
        }

        .btn-copy {
            background: #f0f0f0;
            color: #333;
        }

        .btn-copy:hover {
            background: #e0e0e0;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        footer {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 Facebook 友達申請サポート</h1>
            <p>メルマガ登録者の検索＆メッセージ送信を簡単に</p>
            <div class="summary" id="summary">
                <div class="summary-item">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">登録者数</div>
                </div>
                <div class="summary-item">
                    <div class="number" id="categoryDisplay">-</div>
                    <div class="label">カテゴリ</div>
                </div>
                <div class="summary-item">
                    <div class="number" id="generatedDate">-</div>
                    <div class="label">生成日時</div>
                </div>
            </div>
        </header>

        <div id="error" class="error" style="display: none;"></div>

        <div class="contacts-grid" id="contactsGrid">
            <!-- コンタクトカードが動的に挿入されます -->
        </div>

        <footer>
            💡 使い方：
            1️⃣「Facebook検索」をクリック → 2️⃣「コピー」でメッセージをコピー
            → 3️⃣ 友達申請後、メッセージを貼り付けて送信
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('facebook_search_results.json');
                if (!response.ok) {
                    throw new Error(`HTTPエラー: ${response.status}`);
                }
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                showError(`データ読み込みエラー: ${error.message}`);
                console.error('Error:', error);
            }
        }

        function renderDashboard(data) {
            // サマリーを更新
            document.getElementById('totalCount').textContent = data.total_contacts;
            document.getElementById('categoryDisplay').textContent = data.category;

            const date = new Date(data.generated_at);
            const formattedDate = date.toLocaleDateString('ja-JP', {
                month: 'short',
                day: 'numeric'
            });
            document.getElementById('generatedDate').textContent = formattedDate;

            // コンタクトカードを描画
            const grid = document.getElementById('contactsGrid');
            grid.innerHTML = '';

            data.contacts.forEach(contact => {
                const card = createContactCard(contact);
                grid.appendChild(card);
            });
        }

        function createContactCard(contact) {
            const card = document.createElement('div');
            card.className = 'contact-card';

            const info = contact.contact_info;
            const fb = contact.facebook_search;
            const msg = contact.message_template;

            card.innerHTML = `
                <div class="contact-index">${contact.index}</div>
                <div class="contact-name">${info.name}</div>
                <div class="contact-company">${info.company}</div>

                <div class="contact-details">
                    <div class="contact-details-row">
                        <span class="contact-details-label">役職</span>
                        <span class="contact-details-value">${info.role}</span>
                    </div>
                    <div class="contact-details-row">
                        <span class="contact-details-label">電話</span>
                        <span class="contact-details-value">${info.phone}</span>
                    </div>
                    <div class="contact-details-row">
                        <span class="contact-details-label">メール</span>
                        <span class="contact-details-value" style="font-size: 12px;">${info.email}</span>
                    </div>
                </div>

                <div class="contact-actions">
                    <a href="${fb.search_url}" target="_blank" class="btn btn-facebook">
                        🔍 Facebook検索
                    </a>
                    <button class="btn btn-copy" onclick="copyToClipboard('${escapeForJs(msg)}')">
                        📋 メッセージをコピー
                    </button>
                </div>
            `;

            return card;
        }

        function escapeForJs(str) {
            return str
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\n/g, '\\n');
        }

        function copyToClipboard(text) {
            // 実際のテキストに戻す
            const actualText = text
                .replace(/\\n/g, '\n')
                .replace(/\\'/g, "'")
                .replace(/\\\\/g, '\\');

            navigator.clipboard.writeText(actualText)
                .then(() => showToast('✅ メッセージをコピーしました'))
                .catch(() => showToast('⚠️ コピーに失敗しました'));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = `❌ ${message}`;
            errorDiv.style.display = 'block';
        }

        // ページ読み込み時にデータを読み込む
        loadData();
    </script>
</body>
</html>
