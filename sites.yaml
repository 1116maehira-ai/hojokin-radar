    url: https://www.smart-hojokin.jp/subsidy/prefectures/47
    include: "(公募|補助|助成|申請|支援|募集)"
    exclude: "(終了|締切済|受付終了)"

# 通知の足切り：スコアがこの値以上のものだけLINE通知
notify_threshold: 60
